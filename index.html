  host.innerHTML =
    '<div class="view-inner">' +
      studyNav() +
      '<div class="seg"><button class="' + (wState.mode === 'card' ? 'active' : '') + '" data-wmode="card">카드</button>' +
        '<button class="' + (wState.mode === 'quiz' ? 'active' : '') + '" data-wmode="quiz">퀴즈</button></div>' +
      '<div class="chips">' + chips + '</div>' +
      toggles +
      body +
    '</div>';
}

/* ---------------- 문법·회화·JLPT 화면 ---------------- */
let gTab = 'gram';
let sentScene = '전체';

function renderGram() {
  const host = $('#view-gram');
  let body = '';
  if (gTab === 'gram') {
    body = GRAMMAR.map(function (g, i) {
      const rel = SENTENCES.filter(function (s) { return s.gram === g.id; }).slice(0, 2);
      const exs = g.ex.map(function (ex) {
        return '<div class="ex">' +
          '<div class="ex-jp">' + rubyHTML(ex.jp, ex.kana, S.settings.furigana) + '</div>' +
          (S.settings.furigana ? '<div class="ex-kana">' + esc(ex.kana) + '</div>' : '') +
          (S.settings.romaji ? '<div class="ex-romaji">' + esc(ex.romaji) + '</div>' : '') +
          '<div class="ex-ko">' + esc(ex.ko) + '</div>' +
          '<div class="ex-actions"><button class="mini-btn" data-speak="' + esc(ex.kana) + '">🔊 듣기</button>' +
            '<button class="mini-btn" data-speak-slow="' + esc(ex.kana) + '">🐢 느리게</button></div>' +
        '</div>';
      }).join('');
      const relHTML = rel.length ? '<div style="margin-top:12px">' +
        '<div style="font-size:11.5px;color:var(--ink-3);margin-bottom:2px">이 문법이 쓰인 회화</div>' +
        rel.map(function (s) {
          return '<div class="ex" style="margin-top:6px">' +
            '<div class="ex-jp" style="font-size:14.5px">' + rubyHTML(s.jp, s.kana, S.settings.furigana) + '</div>' +
            '<div class="ex-ko">' + esc(s.ko) + '</div>' +
            '<div class="ex-actions"><button class="mini-btn" data-speak="' + esc(s.kana) + '">🔊</button>' +
              '<button class="mini-btn" data-sent="' + s.id + '">회화로 열기</button></div>' +
          '</div>';
        }).join('') + '</div>' : '';
      return '<details class="gram-card" ' + (i === 0 ? 'open' : '') + '>' +
        '<summary><div class="gram-key">' + esc(g.key) + '</div>' +
          '<div class="gram-t"><b>' + esc(g.title) + '</b><span>' + esc(g.tag) + '</span></div></summary>' +
        '<div class="gram-body"><p>' + esc(g.sum) + '</p>' + exs + relHTML + '</div>' +
      '</details>';
    }).join('');
    body = '<div class="section-title"><h2>JLPT N5 핵심 문법 ' + GRAMMAR.length + '개</h2><span class="hint">조사 · 활용 · 표현</span></div>' + body;
  } else if (gTab === 'sent') {
    const list = sentScene === '전체' ? SENTENCES : SENTENCES.filter(function (s) { return s.scene === sentScene; });
    const chips = SENT_SCENES.map(function (c) {
      return '<button class="chip ' + (sentScene === c ? 'active' : '') + '" data-scene="' + esc(c) + '">' +
        (SCENES_ICON[c] ? SCENES_ICON[c] + ' ' : '') + esc(c) + '</button>';
    }).join('');
    const cards = list.map(function (s) {
      const starred = S.star.sent.indexOf(s.id) >= 0;
      const g = GRAMMAR.filter(function (x) { return x.id === s.gram; })[0];
      return '<div class="ex" style="padding:13px">' +
        '<div class="ex-jp">' + rubyHTML(s.jp, s.kana, S.settings.furigana) + '</div>' +
        '<div class="ex-kana">' + esc(s.kana) + '</div>' +
        (S.settings.romaji ? '<div class="ex-romaji">' + esc(s.romaji) + '</div>' : '') +
        '<div class="ex-ko">' + esc(s.ko) + '</div>' +
        '<div class="ex-actions">' +
          '<button class="mini-btn" data-speak="' + esc(s.kana) + '">🔊</button>' +
          '<button class="mini-btn" data-speak-slow="' + esc(s.kana) + '">🐢</button>' +
          '<button class="mini-btn ' + (starred ? 'on' : '') + '" data-starsent="' + s.id + '">★</button>' +
          (g ? '<button class="mini-btn" data-gram="' + g.id + '">문법 ' + esc(g.key) + '</button>' : '') +
        '</div>' +
      '</div>';
    }).join('');
    body = '<div class="chips">' + chips + '</div>' +
      '<div class="section-title"><h2>일상·여행 회화 ' + SENTENCES.length + '문장</h2><span class="hint">' + list.length + '개 표시</span></div>' +
      '<div class="card" style="padding:12px">' + cards + '</div>' +
      '<button class="btn btn-primary btn-block" data-squiz="10">회화 문장 퀴즈 10문제</button>';
  } else {
    const acc = S.stats.answered ? Math.round(S.stats.correct / S.stats.answered * 100) : 0;
    const moji = JLPT.filter(function (q) { return q.kind === 'moji'; }).length;
    const bunpo = JLPT.filter(function (q) { return q.kind === 'bunpo'; }).length;
    body =
      '<div class="card">' +
        '<div class="card-head"><h3>JLPT N5 실전 미니 퀴즈</h3><span class="badge gold">' + JLPT.length + '문항</span></div>' +
        '<p style="font-size:12.5px;color:var(--ink-2);line-height:1.65">' +
          '실제 시험처럼 文字・語彙(문자·어휘 ' + moji + '문항)와 文法(문법 빈칸 ' + bunpo + '문항)으로 나눠 풀 수 있어요. ' +
          '틀린 문제는 복습 탭에 자동으로 기록됩니다.</p>' +
        '<div style="display:flex;flex-direction:column;gap:8px;margin-top:13px">' +
          '<button class="btn btn-primary btn-block" data-jlpt="all">전체 12문제 풀기</button>' +
          '<button class="btn btn-block" data-jlpt="moji">문자·어휘만 풀기</button>' +
          '<button class="btn btn-block" data-jlpt="bunpo">문법만 풀기</button>' +
        '</div>' +
      '</div>' +
      '<div class="stat-grid">' +
        '<div class="stat"><b>' + S.stats.answered + '</b><span>누적 푼 문제</span></div>' +
        '<div class="stat"><b>' + acc + '%</b><span>정답률</span></div>' +
      '</div>' +
      '<div class="card tight"><div class="card-head" style="margin-bottom:6px"><h3>N5 시험 구성 메모</h3></div>' +
        '<p style="font-size:12px;color:var(--ink-2);line-height:1.7">' +
          'N5는 言語知識(문자·어휘·문법)·読解 60분, 聴解 35분으로 치러져요. ' +
          '문자·어휘에서 점수를 확보하면 합격선(총점 180점 중 80점, 과목별 최소 19점)에 가까워집니다.</p>' +
      '</div>';
  }

  host.innerHTML =
    '<div class="view-inner">' +
      studyNav() +
      '<div class="seg">' +
        '<button class="' + (gTab === 'gram' ? 'active' : '') + '" data-gtab="gram">문법</button>' +
        '<button class="' + (gTab === 'sent' ? 'active' : '') + '" data-gtab="sent">회화</button>' +
        '<button class="' + (gTab === 'jlpt' ? 'active' : '') + '" data-gtab="jlpt">JLPT</button>' +
      '</div>' + body +
    '</div>';
}

/* ---------------- 복습 화면 ---------------- */
function wrongItems(type) {
  const map = S.wrong[type] || {};
  return Object.keys(map).map(function (id) { return { id: id, n: map[id].n || 1, t: map[id].t || 0 }; });
}
function renderReview() {
  const host = $('#view-review');
  if (fc.active) { host.innerHTML = '<div class="view-inner">' + fcViewHTML() + '</div>'; return; }
  const acc = S.stats.answered ? Math.round(S.stats.correct / S.stats.answered * 100) : 0;
  const days = Object.keys(S.days).length;
  const wKana = wrongItems('kana'), wWord = wrongItems('word'), wSent = wrongItems('sent'), wJlpt = wrongItems('jlpt');
  const totalWrong = wKana.length + wWord.length + wSent.length + wJlpt.length;

  let wrongHTML = '';
  if (!totalWrong) {
    wrongHTML = '<div class="card"><div class="empty">아직 오답이 없어요.<br>퀴즈를 풀면 틀린 항목이 여기 자동으로 쌓입니다.</div></div>';
  } else {
    const kanaRows = wKana.map(function (x) {
      const info = kanaInfo(x.id);
      return '<div class="word-row"><div class="word-main"><div class="word-jp">' + esc(x.id) + '</div>' +
        '<div class="word-sub">' + (info ? esc(info.r) : '') + ' · 오답 ' + x.n + '회</div></div>' +
        '<button class="icon-btn" data-speak="' + esc(x.id) + '">🔊</button></div>';
    }).join('');
    const wordRows = wWord.map(function (x) {
      const w = WORDS.filter(function (v) { return v.id === x.id; })[0];
      if (!w) return '';
      return '<div class="word-row"><div class="word-main"><div class="word-jp">' + esc(w.jp) + '</div>' +
        '<div class="word-sub">' + esc(w.kana) + ' · 오답 ' + x.n + '회</div></div>' +
        '<div class="word-ko">' + esc(w.ko) + '</div>' +
        '<button class="icon-btn" data-speak="' + esc(w.kana) + '">🔊</button></div>';
    }).join('');
    const sentRows = wSent.map(function (x) {
      const s = SENTENCES.filter(function (v) { return v.id === x.id; })[0];
      if (!s) return '';
      return '<div class="word-row"><div class="word-main"><div class="word-jp" style="font-size:14px">' + esc(s.jp) + '</div>' +
        '<div class="word-sub">' + esc(s.ko) + ' · 오답 ' + x.n + '회</div></div>' +
        '<button class="icon-btn" data-sent="' + s.id + '">›</button></div>';
    }).join('');
    const jlptRows = wJlpt.map(function (x) {
      const q = JLPT.filter(function (v) { return v.id === x.id; })[0];
      if (!q) return '';
      return '<div class="word-row"><div class="word-main"><div class="word-jp" style="font-size:14px">' + esc(q.prompt) + '</div>' +
        '<div class="word-sub">정답 ' + esc(q.options[q.answer]) + ' · 오답 ' + x.n + '회</div></div></div>';
    }).join('');

    wrongHTML =
      (wKana.length ? '<div class="section-title"><h2>가나 ' + wKana.length + '</h2>' +
        '<button class="hint" style="color:var(--primary);font-weight:600" data-review="kana">다시 풀기 ›</button></div>' +
        '<div class="card tight"><div class="word-list">' + kanaRows + '</div></div>' : '') +
      (wWord.length ? '<div class="section-title"><h2>단어·한자 ' + wWord.length + '</h2>' +
        '<button class="hint" style="color:var(--primary);font-weight:600" data-review="word">다시 풀기 ›</button></div>' +
        '<div class="card tight"><div class="word-list">' + wordRows + '</div></div>' : '') +
      (wSent.length ? '<div class="section-title"><h2>회화 문장 ' + wSent.length + '</h2>' +
        '<button class="hint" style="color:var(--primary);font-weight:600" data-review="sent">다시 풀기 ›</button></div>' +
        '<div class="card tight"><div class="word-list">' + sentRows + '</div></div>' : '') +
      (wJlpt.length ? '<div class="section-title"><h2>JLPT ' + wJlpt.length + '</h2>' +
        '<button class="hint" style="color:var(--primary);font-weight:600" data-review="jlpt">다시 풀기 ›</button></div>' +
        '<div class="card tight"><div class="word-list">' + jlptRows + '</div></div>' : '');
  }

  const starKana = S.star.kana.filter(function (c) { return kanaInfo(c); });
  const starWord = S.star.word.map(function (id) { return WORDS.filter(function (w) { return w.id === id; })[0]; }).filter(Boolean);
  const starSent = S.star.sent.map(function (id) { return SENTENCES.filter(function (s) { return s.id === id; })[0]; }).filter(Boolean);

  const starHTML =
    (!starKana.length && !starWord.length && !starSent.length)
      ? '<div class="card"><div class="empty">★ 를 누른 항목이 여기 모입니다.<br>가나·단어·회화 카드에서 별을 눌러보세요.</div></div>'
      : (starKana.length ? '<div class="section-title"><h2>가나 ' + starKana.length + '</h2></div>' +
          '<div class="card"><div class="kana-grid">' + starKana.map(function (c) {
            return '<button class="kana-cell" data-speak="' + esc(c) + '" data-unstar-kana="' + esc(c) + '">' +
              '<span class="k">' + esc(c) + '</span><span class="r">' + esc(kanaInfo(c).r) + '</span></button>';
          }).join('') + '</div></div>' : '') +
        (starWord.length ? '<div class="section-title"><h2>단어 ' + starWord.length + '</h2></div>' +
          '<div class="card tight"><div class="word-list">' + starWord.map(function (w) {
            return '<div class="word-row"><div class="word-main"><div class="word-jp">' + esc(w.jp) + '</div>' +
              '<div class="word-sub">' + esc(w.kana) + ' · ' + esc(w.romaji) + '</div></div>' +
              '<div class="word-ko">' + esc(w.ko) + '</div>' +
              '<button class="icon-btn starred" data-unstar-word="' + w.id + '">★</button></div>';
          }).join('') + '</div></div>' : '') +
        (starSent.length ? '<div class="section-title"><h2>회화 ' + starSent.length + '</h2></div>' +
          '<div class="card tight"><div class="word-list">' + starSent.map(function (s) {
            return '<div class="word-row"><div class="word-main"><div class="word-jp" style="font-size:14px">' + esc(s.jp) + '</div>' +
              '<div class="word-sub">' + esc(s.ko) + '</div></div>' +
              '<button class="icon-btn" data-sent="' + s.id + '">›</button>' +
              '<button class="icon-btn starred" data-unstar-sent="' + s.id + '">★</button></div>';
          }).join('') + '</div></div>' : '');

  host.innerHTML =
    '<div class="view-inner">' +
      '<div class="stat-grid">' +
        '<div class="stat"><b>' + (S.streak || 0) + '일</b><span>연속 학습</span></div>' +
        '<div class="stat"><b>' + days + '일</b><span>학습한 날</span></div>' +
        '<div class="stat"><b>' + S.stats.answered + '</b><span>푼 문제</span></div>' +
        '<div class="stat"><b>' + acc + '%</b><span>정답률</span></div>' +
      '</div>' +
      '<div class="section-title"><h2>오답노트</h2><span class="hint">' + totalWrong + '개</span></div>' +
      '<div class="card fc-cta">' +
        '<div class="card-head"><h3>🔁 오답 집중 플래시카드</h3><span class="sub">' + totalWrong + '장</span></div>' +
        '<p style="font-size:12px;color:var(--ink-2);line-height:1.6">틀린 가나·단어·회화·JLPT만 모아 <b>앞면 일본어 → 뒷면 읽기·뜻</b>으로 빠르게 회독해요. [다시 볼래요]를 누른 카드는 맨 뒤로 갑니다.</p>' +
        '<button class="btn btn-accent btn-block" data-fc="start"' + (totalWrong ? '' : ' disabled') + '>오답 ' + totalWrong + '장 회독 시작</button>' +
      '</div>' +
      wrongHTML +
      (totalWrong ? '<button class="btn btn-block" data-review="all">오답 전체 다시 풀기</button>' : '') +
      '<div class="section-title"><h2>★ 즐겨찾기</h2><span class="hint">' + (starKana.length + starWord.length + starSent.length) + '개</span></div>' +
      starHTML +
      '<div class="section-title"><h2>한 줄 일기</h2><span class="hint">' + Object.keys(S.diary || {}).length + '편</span></div>' +
      '<div class="card">' +
        '<div class="card-head"><h3>ひとこと日記</h3><span class="sub">매일 한 줄</span></div>' +
        '<p style="font-size:12.5px;color:var(--ink-2);line-height:1.65">쓴 일기는 이 기기에 날짜별로 저장되고, 아래 JSON 백업에 함께 담깁니다.</p>' +
        '<div class="btn-row" style="margin-top:12px">' +
          '<button class="btn" data-diary-list="1">지난 일기</button>' +
          '<button class="btn btn-primary" data-diary="' + dkey() + '">오늘 일기</button>' +
        '</div>' +
        (String((diaryFor(dkey()) || {}).text || '').trim()
          ? '<button class="btn btn-copy btn-block" style="margin-top:8px" data-dcopykey="' + dkey() + '">📋 오늘 일기 첨삭용으로 복사</button>'
          : '') +
      '</div>' +
      '<div class="section-title"><h2>학습 기록</h2><span class="hint">이 기기에만 저장</span></div>' +
      '<div class="card">' +

/* ---------------- 백업 ---------------- */
function exportData() {
  const payload = { app: 'nihongo-note', v: 1, exportedAt: new Date().toISOString(), state: S };
  try {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'nihongo-note-' + dkey() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    toast('백업 파일을 내려받았어요');
  } catch (e) { toast('백업 파일을 만들지 못했어요'); }
}
function importData(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = function () {
    try {
      const parsed = JSON.parse(String(fr.result));
      const st = parsed && parsed.state ? parsed.state : parsed;
      if (!st || typeof st !== 'object' || (!st.days && !st.stats && !st.star && !st.diary && !st.routine)) throw new Error('bad');
      S = normalizeState(st);
      save();
      updateStreak();
      renderCurrent();
      toast('학습 기록을 가져왔어요');
    } catch (e) { toast('이 파일은 학습 기록 백업이 아니에요'); }
  };
  fr.onerror = function () { toast('파일을 읽지 못했어요'); };
  fr.readAsText(file);
}

/* ---------- 첨삭용 복사 ----------
   일기를 채팅창에 붙여넣어 첨삭을 받을 수 있는 형식으로 만든다. */
let copySheetBack = false;
function proofreadBlock(date, mood, weather, jp, ko) {
  const d = String(date || '').trim() || dkey();
  const meta = [String(mood || '').replace(/\s+/g, ''), String(weather || '').replace(/\s+/g, '')]
    .filter(Boolean).join(' ');
  const lines = [
    '[일본어 일기 첨삭 부탁해요]',
    '날짜: ' + d + (meta ? ' (' + meta + ')' : ''),
    '일본어: ' + String(jp || '').trim()
  ];
  const k = String(ko || '').trim();
  if (k) lines.push('한국어 메모: ' + k);
  return lines.join('\n');
}
function legacyCopy(text) {
  let ok = false;
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  return ok;
}
function flashCopied(btn) {
  if (!btn || !btn.dataset) return;
  if (!btn.dataset.copyLabel) btn.dataset.copyLabel = btn.textContent;
  btn.textContent = '✅ 복사했어요';
  btn.classList.add('on');
  clearTimeout(btn._copyTimer);
  btn._copyTimer = setTimeout(function () {
    btn.textContent = btn.dataset.copyLabel;
    btn.classList.remove('on');
  }, 1600);
}
function copyProofreadRequest(text, btn, backToDiary) {
  const done = function (ok) {
    if (ok) {
      toast('복사됐어요! 채팅창에 붙여넣기 해주세요');
      flashCopied(btn);
    } else {
      showCopySheet(text, backToDiary);
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(legacyCopy(text)); });
  } else {
    done(legacyCopy(text));
  }
}
/* 클립보드가 막힌 환경(비보안 컨텍스트·권한 거부)에서는 직접 고를 수 있게 보여준다 */

function insertTemplate(t) {

  if (!ta || !t) return;
  const cur = ta.value;

  ta.focus();
  try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
  const c = $('#diaryCount');
  if (c) c.textContent = ta.value.length + '자';
  toast('템플릿을 넣었어요. 〇〇 부분을 바꿔보세요');
}
function saveDiary() {
  syncDiaryInputs();
  if (!diaryDraft) return;
  const text = (diaryDraft.text || '').trim();
  const ko = (diaryDraft.ko || '').trim();
  if (!text && !ko) { toast('한 줄이라도 적어 주세요'); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(diaryDraft.date)) diaryDraft.date = dkey();
  if (!S.diary) S.diary = {};
  const prev = S.diary[diaryDraft.date] || {};
  S.diary[diaryDraft.date] = {
    mood: diaryDraft.mood, weather: diaryDraft.weather, text: text, ko: ko,
    ts: prev.ts || Date.now(), updated: Date.now()
  };
  save();
  /* 노션 '일기쓰기'처럼, 한 줄 일기를 저장하면 그 날 루틴의 일기 항목을 자동 체크 */
  if (routineItems().some(function (it) { return it.id === 'diary'; })) {
    const rd = routineDay(diaryDraft.date, true);
    if (!rd.checks.diary) { rd.checks.diary = true; save(); }
  }
  markStudy('diary');
  closeSheet();
  renderCurrent();
  toast('일기를 저장했어요 · 今日もおつかれさま');
}
function deleteDiary(key) {
  if (!diaryFor(key)) return;
  askConfirm('이 일기를 삭제할까요?', esc(key) + ' 일기 한 편을 지웁니다. 되돌릴 수 없어요.', '삭제', function () {
    delete S.diary[key];
    save();
    if (diaryDraft && diaryDraft.date === key) { diaryDraft.text = ''; diaryDraft.ko = ''; }
    renderCurrent();
    openDiaryList();
    toast('일기를 삭제했어요');
  });
}

/* ---------------- 냉장고 (fridge-data.json 시드 동기화) ----------------
   저장소의 fridge-data.json을 읽어 재료 목록을 맞추고, 앱에서 직접 추가·수정·소진한 것은 이 기기에 남깁니다. */
const FRIDGE_PLACES = [
  { k: 'fridge',  l: '냉장', e: '❄️' },
  { k: 'freezer', l: '냉동', e: '🧊' },
  { k: 'room',    l: '실온', e: '🍎' }
];
const FRIDGE_VOCA = [
  { jp: '卵', kana: 'たまご', ko: '계란' },
  { jp: '牛乳', kana: 'ぎゅうにゅう', ko: '우유' },
  { jp: '野菜', kana: 'やさい', ko: '채소' },
  { jp: '肉', kana: 'にく', ko: '고기' },
  { jp: '魚', kana: 'さかな', ko: '생선' },
  { jp: '豆腐', kana: 'とうふ', ko: '두부' },
  { jp: '米', kana: 'こめ', ko: '쌀' },
  { jp: '果物', kana: 'くだもの', ko: '과일' }
];
const FRIDGE_SEED_KEY = 'fridge_seed_version';
let fridgeFilter = 'all';
let fridgeDraft = null;
let fridgeDelAsk = false;
let fridgeDelId = '';
let fridgeSyncing = false;

/* 이미 쓴 한 줄 일기도 루틴의 '일기쓰기' 체크로 맞춰 둔다 */
function syncDiaryToRoutine() {
  const items = routineItems();
  if (!items.some(function (it) { return it.id === 'diary'; })) return;
  const r = routineState();
  let changed = false;
  Object.keys(S.diary || {}).forEach(function (k) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    if (!r.days[k]) r.days[k] = { checks: {}, mood: '', memo: '' };
    const d = r.days[k];
    if (!d.checks) d.checks = {};
    if (!d.checks.diary) { d.checks.diary = true; changed = true; }
  });
  if (changed) save();
}

function fridgeState() {
  if (!S.fridge || typeof S.fridge !== 'object') S.fridge = { items: [], seedVersion: 0, syncedAt: '' };
  if (!Array.isArray(S.fridge.items)) S.fridge.items = [];
  return S.fridge;
}
function fridgeItems() { return fridgeState().items; }
/* 보관 위치 이름은 frozen/freezer/냉동 → 냉동, pantry/room/실온 → 실온 처럼 여러 표기를 받아 줍니다 */
function normFridgePlace(v) {
  const s = String(v || '').trim().toLowerCase();
  if (s === 'freezer' || s === 'frozen' || s === '냉동' || s === 'frozen_food') return 'freezer';
  if (s === 'room' || s === 'pantry' || s === 'shelf' || s === '실온') return 'room';
  return 'fridge';
}
function fridgePlaceInfo(k) {
  return FRIDGE_PLACES.filter(function (p) { return p.k === k; })[0] || FRIDGE_PLACES[0];
}
function daysUntil(dateStr) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dateStr || ''))) return null;
  const d = parseDkey(dateStr);
  const t = parseDkey(dkey());
  return Math.round((d.getTime() - t.getTime()) / 86400000);
}
function expiryBadge(dateStr) {
  const d = daysUntil(dateStr);
  if (d === null) return '';
  if (d < 0) return '<span class="fr-badge over">' + Math.abs(d) + '일 지남</span>';
  if (d === 0) return '<span class="fr-badge over">오늘까지</span>';
  if (d <= 3) return '<span class="fr-badge soon">D-' + d + '</span>';
  return '<span class="fr-badge">' + dateStr.slice(5).replace('-', '/') + '까지</span>';
}

/* 채팅으로 넘겨받은 최신 목록(fridge-data.json)을 반영. 사용자가 고친 값과 직접 넣은 재료는 살립니다. */
function applyFridgeSeed(data) {
  const fs2 = fridgeState();
  const seed = Array.isArray(data && data.items) ? data.items : [];
  const byId = {};
  fs2.items.forEach(function (it) { if (it && it.id) byId[it.id] = it; });
  const next = [];
  const seedIds = {};
  let added = 0, removed = 0;
  seed.forEach(function (raw) {
    if (!raw || !raw.name) return;
    const id = String(raw.id || ('s-' + String(raw.name).trim()));
    seedIds[id] = true;
    const base = {
      id: id,
      name: String(raw.name).slice(0, 40),
      jp: String(raw.jp || '').slice(0, 40),
      kana: String(raw.kana || '').slice(0, 60),
      place: normFridgePlace(raw.place),
      qty: String(raw.qty || '').slice(0, 24),
      expires: /^\d{4}-\d{2}-\d{2}$/.test(String(raw.expires || '')) ? raw.expires : '',
      memo: String(raw.memo || '').slice(0, 120),
      nutri: normalizeFridgeNutri(raw.nutri),
      out: false,
      src: 'seed'
    };
    const prev = byId[id];
    if (prev) {
      if (prev.edited) {
        next.push(Object.assign({}, base, { qty: prev.qty, memo: prev.memo, expires: prev.expires || base.expires, edited: true }));
      } else if (prev.out && !raw.out) {
        next.push(Object.assign({}, base, { out: true }));
      } else {
        next.push(base);
      }
    } else {
      next.push(base);
      added++;
    }
  });
  fs2.items.forEach(function (it) {
    if (!it || !it.id) return;
    if (seedIds[it.id]) return;
    if (it.src === 'seed' && !it.edited) { removed++; return; }
    next.push(it);
  });
  fs2.items = next;
  return { added: added, removed: removed };
}
function syncFridgeSeed(force) {
  if (fridgeSyncing) return Promise.resolve({ busy: true });
  fridgeSyncing = true;
  const url = 'fridge-data.json?t=' + Date.now();
  return fetch(url, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      const ver = Number(data && data.version) || 0;
      let cur = 0;
      try { cur = Number(localStorage.getItem(FRIDGE_SEED_KEY)) || 0; } catch (e) { cur = 0; }
      const fs2 = fridgeState();
      if (Number(fs2.seedVersion) > cur) cur = Number(fs2.seedVersion);
      if (!force && ver > 0 && ver <= cur) return { applied: false, version: ver, current: cur };
      const res = applyFridgeSeed(data || {});
      fs2.seedVersion = ver;
      fs2.syncedAt = new Date().toISOString();
      try { localStorage.setItem(FRIDGE_SEED_KEY, String(ver)); } catch (e) {}
      save();
      return { applied: true, version: ver, added: res.added, removed: res.removed, total: fs2.items.length };
    })
    .catch(function (e) { return { error: String((e && e.message) || e) }; })
    .then(function (out) { fridgeSyncing = false; return out; });
}
/* 앱을 열 때·냉장고 탭을 열 때 조용히 최신 목록 확인 */
function fridgeQuietSync() {
  syncFridgeSeed(false).then(function (r) {
    if (!r || !r.applied) return;
    if (currentTab === 'fridge') renderFridge();
    if (r.added || r.removed) toast('냉장고 목록을 최신으로 맞췄어요');
  });
}
function syncFridgeNow(force) {  toast(force ? '최신 목록을 확인하는 중…' : '냉장고 목록을 확인하는 중…');
  syncFridgeSeed(force).then(function (r) {
    if (!r || r.busy) return;

/* ---------------- 식단 기록 (diet-data.json 시드 동기화) ----------------
   채팅에서 넘겨준 식단(diet-data.json)을 목표·하루 기록으로 반영하고,
   앱에서 직접 넣고 지운 날짜·항목은 이 기기에 남깁니다. */
const DIET_MEALS = [
  { k: 'breakfast', l: '아침', e: '🌅' },
  { k: 'lunch',     l: '점심', e: '🍚' },
  { k: 'dinner',    l: '저녁', e: '🌙' },
  { k: 'snack',     l: '간식', e: '🍪' }
];
const DIET_GOALS_DEFAULT = { calories: 1250, carbs: [110, 120], protein: [75, 85], fat: [35, 45], waterStepMl: 500 };
const DIET_SEED_KEY = 'diet_seed_version';
let dietDate = dkey();
let routineSub = 'routine';   /* 루틴 탭 안의 서브 화면: routine | diet */
let dietDraft = null;
let dietDelAsk = false;
let dietSyncing = false;

function num1(v) { const n = Number(v); if (!isFinite(n)) return '0'; return String(Math.round(n * 10) / 10); }
/* 1,250 처럼 세 자리 쉼표 */
function numComma(v) { return String(Math.round(Number(v) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
/* 받침에 따라 조사를 골라 "초콜릿을" / "샐러드를" 처럼 읽히게 합니다. */
function josaKo(word, withB, withoutB) {
  const s = String(word || '').trim();
  if (!s) return withB;
  const c = s.charCodeAt(s.length - 1);
  if (c < 0xac00 || c > 0xd7a3) return withB;
  return (c - 0xac00) % 28 !== 0 ? withB : withoutB;
}
function dietNum(v, max) {
  const n = Number(v);
  if (!isFinite(n) || n < 0) return 0;
  const r = Math.round(n * 10) / 10;
  return max ? Math.min(r, max) : r;
}
function dietRange(v, fallback) {
  const a = Array.isArray(v) ? v : null;
  const lo = a ? dietNum(a[0]) : fallback[0];
  const hi = a ? dietNum(a[1] === undefined ? a[0] : a[1]) : fallback[1];
  return [Math.min(lo, hi), Math.max(lo, hi)];
}
function normalizeDietGoals(raw) {
  const g = raw && typeof raw === 'object' ? raw : {};
  const def = DIET_GOALS_DEFAULT;
  return {
    calories: dietNum(g.calories, 10000) || def.calories,
    carbs: dietRange(g.carbs, def.carbs),
    protein: dietRange(g.protein, def.protein),
    fat: dietRange(g.fat, def.fat),
    waterStepMl: dietNum(g.waterStepMl, 2000) || def.waterStepMl
  };
}
function normalizeDietItem(raw) {
  if (!raw || !raw.name) return null;
  return {
    id: String(raw.id || ('x-' + Math.random().toString(36).slice(2, 8))),
    name: String(raw.name).slice(0, 50),
    kcal: dietNum(raw.kcal, 5000),
    carb: dietNum(raw.carb, 500),
    protein: dietNum(raw.protein, 500),
    fat: dietNum(raw.fat, 500),
    est: !!raw.est,
    src: raw.src === 'user' ? 'user' : 'seed'
  };
}
function normalizeDietDay(raw) {
  const d = raw && typeof raw === 'object' ? raw : {};
  const meals = {};
  DIET_MEALS.forEach(function (m) {
    const arr = d.meals && Array.isArray(d.meals[m.k]) ? d.meals[m.k] : [];
    meals[m.k] = arr.map(normalizeDietItem).filter(Boolean);
  });
  return {
    water: dietNum(d.water, 20000),
    meals: meals,
    edited: !!d.edited,
    del: Array.isArray(d.del) ? d.del.map(String).slice(0, 200) : []
  };
}
function normalizeDiet(raw) {
  const d = raw && typeof raw === 'object' ? raw : {};
  const days = {};
  if (d.days && typeof d.days === 'object') {
    Object.keys(d.days).forEach(function (k) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      days[k] = normalizeDietDay(d.days[k]);
    });
  }
  return {
    goals: normalizeDietGoals(d.goals),
    days: days,
    seedVersion: Number(d.seedVersion) || 0,
    syncedAt: typeof d.syncedAt === 'string' ? d.syncedAt : ''
  };
}
function dietState() {
  if (!S.diet || typeof S.diet !== 'object') S.diet = normalizeDiet(null);
  if (!S.diet.days || typeof S.diet.days !== 'object') S.diet.days = {};
  if (!S.diet.goals || typeof S.diet.goals !== 'object') S.diet.goals = normalizeDietGoals(null);
  return S.diet;
}
function dietGoals() { return dietState().goals; }
function dietDay(k, create) {
  const ds = dietState();
  let d = ds.days[k];
  if (!d && create) d = ds.days[k] = { water: 0, meals: { breakfast: [], lunch: [], dinner: [], snack: [] }, edited: true, del: [] };
  return d || null;
}
function dietTotals(day) {
  const t = { kcal: 0, carb: 0, protein: 0, fat: 0, count: 0 };
  if (!day || !day.meals) return t;
  DIET_MEALS.forEach(function (m) {
    (day.meals[m.k] || []).forEach(function (it) {
      t.kcal += it.kcal; t.carb += it.carb; t.protein += it.protein; t.fat += it.fat; t.count++;
    });
  });
  ['kcal', 'carb', 'protein', 'fat'].forEach(function (k) { t[k] = Math.round(t[k] * 10) / 10; });
  return t;
}
function dietDayTotals(k) { return dietTotals(dietState().days[k]); }
function dietMealSum(day, meal) {
  const arr = (day && day.meals && day.meals[meal]) || [];
  return Math.round(arr.reduce(function (a, it) { return a + it.kcal; }, 0) * 10) / 10;
}

/* 채팅으로 넘겨받은 최신 식단(diet-data.json)을 반영.
   앱에서 고친 날은 그 기록을 살리고, 새로 온 항목만 더하며, 앱에서 지운 항목은 되살리지 않습니다. */
function applyDietSeed(data) {
  const ds = dietState();
  if (data && data.goals) ds.goals = normalizeDietGoals(data.goals);
  const seedDays = data && data.days && typeof data.days === 'object' ? data.days : {};
  let changed = 0;
  Object.keys(seedDays).forEach(function (k) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
    const seed = normalizeDietDay(seedDays[k]);
    const cur = ds.days[k];
    if (!cur) { ds.days[k] = seed; changed++; return; }
    if (!cur.edited) { ds.days[k] = seed; changed++; return; }
    const del = cur.del || [];
    DIET_MEALS.forEach(function (m) {
      const have = {};
      (cur.meals[m.k] || []).forEach(function (it) { have[it.id] = true; });
      (seed.meals[m.k] || []).forEach(function (it) {
        if (have[it.id] || del.indexOf(it.id) >= 0) return;
        cur.meals[m.k].push(it); changed++;
      });
    });
    if (!cur.water && seed.water) { cur.water = seed.water; changed++; }
  });
  return changed;
}
function syncDietSeed(force) {
  if (dietSyncing) return Promise.resolve({ busy: true });
  dietSyncing = true;
  const url = 'diet-data.json?t=' + Date.now();
  return fetch(url, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      const ver = Number(data && data.version) || 0;
      let cur = 0;
      try { cur = Number(localStorage.getItem(DIET_SEED_KEY)) || 0; } catch (e) { cur = 0; }
      const ds = dietState();
      if (Number(ds.seedVersion) > cur) cur = Number(ds.seedVersion);
      if (!force && ver > 0 && ver <= cur) return { applied: false, version: ver, current: cur };
      const changed = applyDietSeed(data || {});
      ds.seedVersion = ver;
      ds.syncedAt = new Date().toISOString();
      try { localStorage.setItem(DIET_SEED_KEY, String(ver)); } catch (e) {}
      save();
      return { applied: true, version: ver, changed: changed, days: Object.keys(ds.days).length };
    })
    .catch(function (e) { return { error: String((e && e.message) || e) }; })
    .then(function (out) { dietSyncing = false; return out; });
}
/* 앱을 열 때 조용히 최신 식단 확인 */
function dietQuietSync() {
  syncDietSeed(false).then(function (r) {
    if (!r || !r.applied) return;
    if (currentTab === 'routine') renderRoutine();
    if (currentTab === 'home') renderHome();
    if (r.changed) toast('식단 기록을 최신으로 맞췄어요');
  });
}
function syncDietNow(force) {
  toast('최신 식단을 확인하는 중…');
  syncDietSeed(force).then(function (r) {
    if (!r || r.busy) return;

}

function dietKcalRow(value, goal) {

    '<div class="dgo-top"><span class="dgo-k">🔥 칼로리</span>' +
      '<span class="dgo-v">' + num1(value) + '<small> / ' + goal + ' kcal</small></span></div>' +

function dietRangeRow(label, value, range, cls) {

    ? { t: '목표 ' + range[1] + 'g보다 ' + num1(value - range[1]) + 'g 많아요', c: 'over' }

      ? { t: num1(range[0] - value) + 'g 더 필요', c: 'short' }

  const g = dietGoals();
  const step = Number(g.waterStepMl) || 500;
  const day = dietDay(dietDate, true);
  const next = Math.max(0, Math.round((day.water + dir * step) * 10) / 10);
  if (next === day.water) { toast('더 줄일 수 없어요'); return; }
  day.water = next;
  day.edited = true;
  save();
  renderRoutine();
  toast('물 ' + num1(next) + ' mL');
}

function saveDietItem() {
  if (!dietDraft) return;
  syncDietInputs();
  const name = String(dietDraft.name || '').trim();
  if (!name) { toast('음식 이름을 잠깐 적어 주세요'); return; }
  if (String(dietDraft.kcal).trim() === '' || !isFinite(Number(dietDraft.kcal))) { toast('칼로리를 숫자로 적어 주세요'); return; }
  const editing = !!dietDraft.id;
  const meal = dietDraft.meal || 'snack';
  const day = dietDay(dietDate, true);
  if (!Array.isArray(day.meals[meal])) day.meals[meal] = [];
  const val = {
    name: name.slice(0, 50),
    kcal: dietNum(dietDraft.kcal, 5000),
    carb: dietNum(dietDraft.carb, 500),
    protein: dietNum(dietDraft.protein, 500),
    fat: dietNum(dietDraft.fat, 500),
    est: !!dietDraft.est
  };
  if (editing) {
    const it = day.meals[meal].filter(function (x) { return x.id === dietDraft.id; })[0];
    if (it) Object.assign(it, val, { src: 'user' });
    else day.meals[meal].push(Object.assign({ id: 'u-' + Date.now().toString(36) + '-' + rand(999), src: 'user' }, val));
  } else {
    day.meals[meal].push(Object.assign({ id: 'u-' + Date.now().toString(36) + '-' + rand(999), src: 'user' }, val));
  }
  day.edited = true;
  save();
  closeSheet();
  renderRoutine();
  const m = DIET_MEALS.filter(function (x) { return x.k === meal; })[0] || DIET_MEALS[0];
  toast((editing ? '기록을 고쳤어요' : m.l + '에 넣었어요') + ' · ' + name);
}
function deleteDietItem(meal, id) {
  const ds = dietState();
  const day = ds.days[dietDate];
  if (!day) return;
  const arr = day.meals[meal] || [];
  const i = arr.map(function (x) { return x.id; }).indexOf(id);
  if (i < 0) return;
  const name = arr[i].name;
  arr.splice(i, 1);
  if (!Array.isArray(day.del)) day.del = [];
  if (day.del.indexOf(id) < 0) day.del.push(id);
  day.edited = true;
  dietDelAsk = false;
  save();
  closeSheet();
  renderRoutine();
  toast(name + josaKo(name, '을', '를') + ' 지웠어요');
}

  const sp = t.closest('[data-speak]');

  return false;

function onDietSheetClick(e) {
  if (!dietDraft) return false;

}

/* ---------------- 체중 · 인바디 · 마운자로 (weight-data.json 시드 동기화) ----------------
   채팅에서 넘겨준 체중·인바디 기록(weight-data.json)을 받아 주간 추세로 보여주고,
   앱에서 직접 넣은 체중·허리둘레·주사 기록은 이 기기에 남깁니다.
   하루 수치가 아니라 주간 평균으로 판단하는 기준을 그대로 따릅니다. */
const WEIGHT_SEED_KEY = 'weight_seed_version';
const WEIGHT_DEFAULT_PROFILE = {
  heightCm: 158, startDate: '2026-07-21', startWeight: 91.2, goalWeight: 58,
  bmr: 1230, startWaist: 100, latestWaist: 97, waistNote: ''
};
let weightSyncing = false;
let weightDraft = null;
let weightDelAsk = false;
let weightChartRange = 12;   /* 12주 | 0(전체) */

function wtNum(v) { const n = Number(v); return (v === '' || v === null || v === undefined || !isFinite(n)) ? null : n; }
function wtDateStr(v) { return /^\d{4}-\d{2}-\d{2}$/.test(String(v || '')) ? String(v) : ''; }

function normalizeWeightProfile(raw) {
  const p = Object.assign({}, WEIGHT_DEFAULT_PROFILE);
  const r = raw && typeof raw === 'object' ? raw : {};
  ['heightCm', 'startWeight', 'goalWeight', 'bmr', 'startWaist', 'latestWaist'].forEach(function (k) {
    const v = wtNum(r[k]);
    if (v !== null && v > 0) p[k] = v;
  });
  if (wtDateStr(r.startDate)) p.startDate = wtDateStr(r.startDate);
  if (typeof r.waistNote === 'string') p.waistNote = r.waistNote.slice(0, 120);
  return p;
}
function normalizeWeightEntry(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const date = wtDateStr(raw.date);
  const kg = wtNum(raw.kg);
  if (!date || kg === null || kg <= 0) return null;
  const e = { date: date, kg: Math.round(kg * 100) / 100, src: raw.src === 'user' ? 'user' : 'seed' };
  ['bodyFat', 'fatMass', 'muscle', 'visceral', 'waist'].forEach(function (f) {
    const v = wtNum(raw[f]);
    if (v !== null && v > 0) e[f] = Math.round(v * 100) / 100;
  });

/* 주간(월~일) 평균 체중. 기록이 없는 주는 건너뛰고, 전주 대비 변화도 함께 계산합니다. */
function weightWeeks(limit) {
  const map = {};
  weightEntries().forEach(function (e) {
    const w = weekStartOf(e.date);
    (map[w] = map[w] || []).push(e.kg);

  let weeks = Object.keys(map).sort().map(function (w) {
    const arr = map[w];
    const avg = arr.reduce(function (a, b) { return a + b; }, 0) / arr.length;
    const d = parseDkey(w);

      week: w,

/* 주간 평균 SVG 라인 + 전주 대비 막대(아래로 = 감소) */
function weightChartSVG(limit) {
  const weeks = weightWeeks(limit);
  if (weeks.length < 2) {
    return '<div class="empty">기록이 2주 이상 쌓이면 주간 추세선이 그려져요.<br>아래 <b>＋ 기록 추가</b>로 체중을 남겨 보세요.</div>';
  }
  const W = 340, H = 176;
  const x0 = 32, x1 = 332, yTop = 12, yBot = 104;
  const barMid = 137, barMax = 15;
  const vals = weeks.map(function (w) { return w.avg; });
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi - lo < 1) { hi = lo + 0.5; lo -= 0.5; }
  const padY = (hi - lo) * 0.18;
  lo -= padY; hi += padY;
  const X = function (i) { return weeks.length === 1 ? x0 : x0 + (x1 - x0) * i / (weeks.length - 1); };
  const Y = function (v) { return yBot - (v - lo) / (hi - lo) * (yBot - yTop); };

  let line = '', dots = '';
  weeks.forEach(function (w, i) {
    const x = X(i), y = Y(w.avg);
    line += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    const last = i === weeks.length - 1;
    dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (last ? 3.4 : 2.1) + '" fill="' + (last ? '#DC2626' : '#15803D') + '"/>';
  });
  const area = '<path d="' + line + ' L' + X(weeks.length - 1).toFixed(1) + ' ' + (yBot + 2) +
    ' L' + X(0).toFixed(1) + ' ' + (yBot + 2) + ' Z" fill="#15803D" opacity=".07"/>';
  /* 마지막 값 라벨 */
  const lastW = weeks[weeks.length - 1];
  const lx = Math.min(x1 - 16, Math.max(x0 + 16, X(weeks.length - 1)));
  const ly = Math.max(yTop + 8, Y(lastW.avg) - 8);

  const deltas = weeks.map(function (w, i) { return i ? w.delta : 0; });
  const maxAbs = Math.max(0.4, Math.max.apply(null, deltas.map(function (v) { return Math.abs(v); })));
  const bw = Math.max(6, Math.min(16, (x1 - x0) / weeks.length * 0.5));
  let bars = '';
  weeks.forEach(function (w, i) {
    if (!i) return;
    const cx = X(i);
    const h = Math.max(1, Math.min(barMax, Math.abs(w.delta) / maxAbs * barMax));
    const up = w.delta > 0;
    bars += '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + (up ? barMid - h : barMid).toFixed(1) +
      '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="' + (up ? '#DC2626' : '#15803D') + '" opacity=".72"/>';
  });

  const step = weeks.length > 8 ? Math.ceil(weeks.length / 5) : 1;
  let labels = '';
  weeks.forEach(function (w, i) {
    if (i % step && i !== weeks.length - 1) return;
    labels += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle" font-size="7.5" fill="#8D939C">' + esc(w.label) + '</text>';
  });

  return '<svg class="wt-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="주간 평균 체중 추세선과 전주 대비 막대">' +
    '<line x1="' + x0 + '" y1="' + yTop + '" x2="' + x1 + '" y2="' + yTop + '" stroke="#E4E6EA" stroke-width="1"/>' +
    '<line x1="' + x0 + '" y1="' + yBot + '" x2="' + x1 + '" y2="' + yBot + '" stroke="#E4E6EA" stroke-width="1"/>' +
    '<text x="' + (x0 - 4) + '" y="' + (yTop + 3) + '" text-anchor="end" font-size="7.5" fill="#8D939C">' + hi.toFixed(1) + '</text>' +
    '<text x="' + (x0 - 4) + '" y="' + (yBot - 1) + '" text-anchor="end" font-size="7.5" fill="#8D939C">' + lo.toFixed(1) + '</text>' +
    area +
    '<path d="' + line + '" fill="none" stroke="#15803D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots +
    '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle" font-size="8.5" font-weight="700" fill="#DC2626">' + lastW.avg.toFixed(2) + '</text>' +
    '<line x1="' + x0 + '" y1="' + barMid + '" x2="' + x1 + '" y2="' + barMid + '" stroke="#E3E5E9" stroke-width="1"/>' +
    bars + labels +
  '</svg>';
}

function weightSummary() {

/* 채팅으로 넘겨받은 최신 기록(weight-data.json) 반영.

function applyWeightSeed(data) {
  if (!data || typeof data !== 'object') return { added: 0, updated: 0 };
  const ws = weightState();
  ws.profile = normalizeWeightProfile(data.profile);
  let added = 0, updated = 0;
  (Array.isArray(data.entries) ? data.entries : []).forEach(function (raw) {
    const e = normalizeWeightEntry(raw);
    if (!e) return;
    const cur = ws.entries[e.date];
    if (cur && cur.src === 'user' && cur.edited) return;
    if (!cur) added++;
    else if (cur.kg !== e.kg) updated++;
    ws.entries[e.date] = e;
  });
  const keepUser = ws.doses.filter(function (d) { return d.src === 'user'; });
  const seedDoses = (Array.isArray(data.doses) ? data.doses : []).map(function (d) { return normalizeWeightDose(Object.assign({ src: 'seed' }, d)); }).filter(Boolean);
  ws.doses = seedDoses.concat(keepUser).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  return { added: added, updated: updated };
}
function syncWeightSeed(force) {
  if (weightSyncing) return Promise.resolve({ busy: true });
  weightSyncing = true;
  return fetch('weight-data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      const ver = Number(data && data.version) || 0;
      let cur = 0;
      try { cur = Number(localStorage.getItem(WEIGHT_SEED_KEY)) || 0; } catch (e) { cur = 0; }
      const ws = weightState();
      if (Number(ws.seedVersion) > cur) cur = Number(ws.seedVersion);
      if (!force && ver > 0 && ver <= cur) return { applied: false, version: ver, current: cur };
      const res = applyWeightSeed(data || {});
      ws.seedVersion = ver;
      ws.syncedAt = new Date().toISOString();
      try { localStorage.setItem(WEIGHT_SEED_KEY, String(ver)); } catch (e) {}
      save();
      return Object.assign({ applied: true, version: ver }, res);
    })
    .catch(function (e) { return { error: String((e && e.message) || e) }; })
    .then(function (out) { weightSyncing = false; return out; });
}

/* ---------------- 🔁 오답 집중 플래시카드 ----------------
   틀린 문제만 모아 앞면(일본어) → 뒷면(읽기·뜻·예문)으로 빠르게 회독합니다.
   [다시 볼래요]를 누른 카드는 맨 뒤로 돌아가고, [알겠음]을 누른 카드는 이번 회독에서 빠집니다. */
let fc = { active: false, deck: [], i: 0, flipped: false, known: 0, again: 0, total: 0, done: false };

function fcBuildDeck() {
  const cards = [];
  wrongItems('kana').forEach(function (x) {
    const info = kanaInfo(x.id);
    if (!info) return;
    cards.push({ type: '가나', id: x.id, front: x.id, frontSub: '이 가나의 발음은?', back: info.r,
      backSub: (isKata(x.id) ? '가타카나' : '히라가나'), speak: x.id, n: x.n });
  });
  wrongItems('word').forEach(function (x) {
    const w = WORDS.filter(function (v) { return v.id === x.id; })[0];
    if (!w) return;
    cards.push({ type: '단어', id: w.id, front: w.jp, frontSub: '읽기와 뜻은?',
      back: w.ko, backSub: w.kana + ' · ' + w.romaji, speak: w.kana, n: x.n });
  });
  wrongItems('sent').forEach(function (x) {
    const s = SENTENCES.filter(function (v) { return v.id === x.id; })[0];
    if (!s) return;
    cards.push({ type: '회화', id: s.id, front: s.jp, frontSub: s.scene || '뜻은?',
      back: s.ko, backSub: s.kana || '', speak: s.kana || s.jp, n: x.n });
  });
  wrongItems('jlpt').forEach(function (x) {
    const q = JLPT.filter(function (v) { return v.id === x.id; })[0];
    if (!q) return;
    cards.push({ type: 'JLPT', id: q.id, front: q.prompt, frontSub: q.sub || '정답은?',
      back: q.options[q.answer], backSub: q.exp || '', speak: '', n: x.n });
  });
  /* 많이 틀린 카드부터, 같은 횟수면 섞어서 */
  return shuffle(cards).sort(function (a, b) { return (b.n || 1) - (a.n || 1); });
}
function startFlashcards() {
  const deck = fcBuildDeck();
  if (!deck.length) { toast('오답이 없어요 · 퀴즈를 먼저 풀어 주세요'); return; }
  fc = { active: true, deck: deck, i: 0, flipped: false, known: 0, again: 0, total: deck.length, done: false };
  renderReview();
  try { window.scrollTo(0, 0); } catch (e) {}
}
function fcViewHTML() {
  const card = fc.deck[fc.i];

  if (!card || fc.done) {

    return '<div class="fc-wrap">' +
      '<div class="card">' +
        '<div class="card-head"><h3>🔁 오답 집중 플래시카드</h3><span class="sub">' + (fc.done ? '한 바퀴 끝' : '진행 중') + '</span></div>' +
        '<div class="wt-grid" style="margin-top:0">' +
          '<div class="wt-stat"><b>' + fc.known + '</b><span>알겠음</span></div>' +
          '<div class="wt-stat"><b>' + fc.again + '</b><span>다시 볼래요</span></div>' +
          '<div class="wt-stat"><b>' + left + '</b><span>남은 카드</span></div>' +

        '</div>' +
        '<p class="menu-eff" style="margin-top:10px">' + (fc.done
          ? '이번 오답 카드를 모두 봤어요. 틀린 문제는 퀴즈를 풀수록 다시 쌓입니다.'
          : '카드를 모두 확인했어요.') + '</p>' +
        '<div class="btn-row" style="margin-top:12px">' +
          '<button class="btn btn-primary" data-fc="start">🔁 다시 시작</button>' +

        '</div>' +

  }

  return '<div class="fc-wrap">' +

      '<div class="card-head"><h3>🔁 오답 집중 플래시카드</h3>' +

    '</div>' +
    '<button class="fc-card" data-fc="flip" aria-label="카드를 눌러 ' + (fc.flipped ? '앞면' : '뒷면') + ' 보기">' +
      '<span class="fc-type">' + esc(card.type) + ' · 오답 ' + (card.n || 1) + '회</span>' +
      (fc.flipped
        ? '<span class="fc-back">' + esc(card.back) + '</span>' +
          (card.backSub ? '<span class="fc-back-sub">' + esc(card.backSub) + '</span>' : '') +
          '<span class="fc-front' + (isLong ? ' small' : '') + '" style="color:var(--ink-2)">' + esc(card.front) + '</span>'
        : '<span class="fc-front' + (isLong ? ' small' : '') + '">' + esc(card.front) + '</span>' +
          (card.frontSub ? '<span class="fc-back-sub">' + esc(card.frontSub) + '</span>' : '')) +
      '<span class="fc-hint">' + (fc.flipped ? '카드를 누르면 앞면' : '카드를 누르면 읽기·뜻이 보여요') + '</span>' +
    '</button>' +
    (card.speak ? '<button class="mini-btn" data-speak="' + esc(card.speak) + '" style="align-self:center">🔊 발음 듣기</button>' : '') +
    '<div class="fc-btns">' +
      '<button class="btn btn-primary" data-fc="known">✓ 알겠음</button>' +
      '<button class="btn btn-accent" data-fc="again">↻ 다시 볼래요</button>' +
    '</div>' +
    '<button class="btn btn-ghost" data-fc="stop">그만두기</button>' +
  '</div>';
}
function fcAct(act) {
  if (act === 'start') { startFlashcards(); return; }
  if (act === 'stop') { fc.active = false; renderReview(); return; }
  const card = fc.deck[fc.i];
  if (!card) { fc.done = true; renderReview(); return; }
  if (act === 'flip') { fc.flipped = !fc.flipped; renderReview(); return; }
  if (act === 'known') {
    fc.known++;
    fc.i++;
    fc.flipped = false;
    if (fc.i >= fc.deck.length) fc.done = true;
    renderReview();
    return;
  }
  if (act === 'again') {
    fc.again++;
    fc.deck.push(card);
    fc.i++;
    fc.flipped = false;
    if (fc.i >= fc.deck.length) fc.done = true;
    renderReview();
  }
}

    const n = Number(kq.dataset.kquiz) || 5;
    if (n === 46) {
      const all = (kanaScript === 'kata' ? KANA_SEION.map(function (r) { return r[1]; }) : KANA_SEION.map(function (r) { return r[0]; }));
      const items = all.map(function (ch, i) {
        const info = kanaInfo(ch);
        const opts = [info.r];
        shuffle(all.map(function (c) { return kanaInfo(c).r; }).filter(function (r) { return r !== info.r; })).forEach(function (r) {
          if (opts.length < 4 && opts.indexOf(r) < 0) opts.push(r);
        });
        const options = shuffle(opts);
        return { type: 'kana', id: ch, main: ch, mainHTML: esc(ch), sub: '이 가나의 발음은?', speak: ch,
          options: options, answer: options.indexOf(info.r), explain: '<b>' + esc(ch) + '</b> = ' + esc(info.r) };
      });
      startQuiz({ title: '가나 46음 훑기', items: items, onDone: function () { markStudy('kana'); } });
      return;
    }
    startQuiz({ title: '헷갈리는 가나 ' + n + '문제', items: buildKanaQuestions(n), onDone: function () { markStudy('kana'); } });
    return;
  }
  const padBtn = t.closest('[data-pad]');
  if (padBtn) {
    const act = padBtn.dataset.pad;
    if (act === 'clear') { pad.strokes = []; drawPad(); return; }
    if (act === 'prev') { padMove(-1); return; }
    if (act === 'next') { padMove(1); return; }
    if (act === 'speak') { speak(pad.char); return; }
    if (act === 'star') { toggleStar('kana', pad.char); return; }
  }
  const sp = t.closest('[data-speak]');
  if (sp) { speak(sp.dataset.speak); return; }
}

function onWordsClick(e) {
  const t = e.target;
  const mode = t.closest('[data-wmode]');
  if (mode) { wState.mode = mode.dataset.wmode; wState.reveal = false; renderWords(); return; }
  const cat = t.closest('[data-cat]');
  if (cat) { wState.cat = cat.dataset.cat; wState.idx = 0; wState.reveal = false; renderWords(); return; }
  const wset = t.closest('[data-wset]');
  if (wset) {
    const k = wset.dataset.wset;
    if (k === 'furigana') { S.settings.furigana = !S.settings.furigana; toast('후리가나 ' + (S.settings.furigana ? 'ON · 읽기가 보여요' : 'OFF · 읽기 연습')); }
    else if (k === 'romaji') { S.settings.romaji = !S.settings.romaji; toast('로마자 ' + (S.settings.romaji ? 'ON' : 'OFF')); }
    else if (k === 'rate') { S.settings.rate = Number(S.settings.rate) === 1 ? 0.75 : 1; toast('재생 속도 ' + (Number(S.settings.rate) === 1 ? '1.0배' : '0.75배 (느리게)')); }
    else if (k === 'staronly') { wState.starredOnly = !wState.starredOnly; wState.idx = 0; if (wState.starredOnly && !S.star.word.length) toast('아직 즐겨찾기한 단어가 없어요'); }
    else if (k === 'shuffle') { wState.idx = rand(Math.max(1, filteredWords().length)); wState.reveal = false; toast('카드를 섞었어요'); }
    save();
    renderWords();
    return;
  }
  const flash = t.closest('[data-flash]');
  if (flash && !t.closest('[data-star]')) {
    wState.reveal = !wState.reveal;
    const card = flash;
    card.classList.toggle('revealed', wState.reveal);
    const ko = card.querySelector('.flash-ko');
    if (ko) ko.classList.toggle('hidden', !wState.reveal);
    const hint = card.querySelector('.tap-hint');
    if (hint) hint.textContent = wState.reveal ? '카드를 눌러 접기' : '카드를 누르면 뜻이 보여요';
    const arr = filteredWords();
    const w = arr[wState.idx];
    if (w && wState.reveal && !S.settings.furigana && w.jp !== w.kana) {
      const k = card.querySelector('.flash-kana');
      if (!k) {
        const div = document.createElement('div');
        div.className = 'flash-kana';
        div.textContent = w.kana;
        const wordEl = card.querySelector('.flash-word');
        if (wordEl && wordEl.parentNode) wordEl.parentNode.insertBefore(div, wordEl.nextSibling);
      }
    } else {
      const k = card.querySelector('.flash-kana');
      if (k && !S.settings.furigana) k.remove();
    }
    return;
  }
  const star = t.closest('[data-star]');
  if (star) { toggleStar('word', star.dataset.star); return; }
  const move = t.closest('[data-wmove]');
  if (move) {
    const arr = filteredWords();
    if (!arr.length) return;
    wState.idx = (wState.idx + Number(move.dataset.wmove) + arr.length) % arr.length;
    wState.reveal = false;
    renderWords();
    return;
  }
  const wq = t.closest('[data-wquiz]');
  if (wq) {
    const arr = filteredWords();
    const k = wq.dataset.wquiz;
    if (k === 'today') { startQuiz({ title: '오늘의 단어 5개', items: buildWordQuestions(todayWords(), 5, 'mix'), onDone: function () { markStudy('words'); } }); return; }
    if (k === 'single') {
      const w = arr[wState.idx];
      if (w) startQuiz({ title: '이 단어 퀴즈', items: buildWordQuestions([w], 1, 'mix'), onDone: function () { markStudy('words'); } });
      return;
    }
    const mode = k === 'meaning' ? 'meaning' : k === 'reading' ? 'reading' : 'mix';
    startQuiz({ title: '단어 퀴즈 · ' + (mode === 'mix' ? '섞어서' : mode === 'meaning' ? '뜻' : '읽기'), items: buildWordQuestions(arr, 10, mode), onDone: function () { markStudy('words'); } });
    return;
  }
  const slow = t.closest('[data-speak-slow]');
  if (slow) { speak(slow.dataset.speakSlow, 0.6); return; }
  const sp = t.closest('[data-speak]');
  if (sp) { speak(sp.dataset.speak); return; }
}

function onGramClick(e) {
  const t = e.target;
  const gt = t.closest('[data-gtab]');
  if (gt) { gTab = gt.dataset.gtab; renderGram(); return; }
  const sc = t.closest('[data-scene]');
  if (sc) { sentScene = sc.dataset.scene; renderGram(); return; }
  const g = t.closest('[data-gram]');
  if (g) {
    const item = GRAMMAR.filter(function (x) { return x.id === g.dataset.gram; })[0];
    gTab = 'gram';
    renderGram();
    setTimeout(function () {
      $$('#view-gram details').forEach(function (d) {
        const keyEl = d.querySelector('.gram-key');
        if (item && keyEl && keyEl.textContent.trim() === item.key) d.open = true;
      });
      const el = $$('#view-gram details').filter(function (d) { return d.open; }).pop();
      if (el) el.scrollIntoView({ block: 'center' });
    }, 60);
    return;
  }
  const jq = t.closest('[data-jlpt]');
  if (jq) {
    const kind = jq.dataset.jlpt;
    startQuiz({
      title: 'JLPT N5 미니 퀴즈',
      items: buildJlptQuestions(kind, kind === 'all' ? 12 : 8),
      onDone: function () { toast('JLPT 퀴즈 결과가 오답노트에 기록됐어요'); }
    });
    return;
  }
  const sq = t.closest('[data-squiz]');
  if (sq) {
    const list = sentScene === '전체' ? SENTENCES : SENTENCES.filter(function (s) { return s.scene === sentScene; });
    startQuiz({ title: '회화 문장 퀴즈', items: buildSentQuestions(list, 10), onDone: function () { markStudy('talk'); } });
    return;
  }
  const starsent = t.closest('[data-starsent]');
  if (starsent) { toggleStar('sent', starsent.dataset.starsent); return; }
  const sent = t.closest('[data-sent]');
  if (sent) { openSentence(sent.dataset.sent); return; }
  const slow = t.closest('[data-speak-slow]');
  if (slow) { speak(slow.dataset.speakSlow, 0.6); return; }
  const sp = t.closest('[data-speak]');
  if (sp) { speak(sp.dataset.speak); return; }
}

function onReviewClick(e) {
  const t = e.target;
  const fcb = t.closest('[data-fc]');
  if (fcb) { fcAct(fcb.dataset.fc); return; }
  const rv = t.closest('[data-review]');
  if (rv) {
    const kind = rv.dataset.review;
    let items = [];
    if (kind === 'kana' || kind === 'all') {
      items = items.concat(wrongItems('kana').map(function (x) {
        const info = kanaInfo(x.id);
        if (!info) return null;
        const script = isKata(x.id) ? 'kata' : 'hira';
        const opts = [info.r];
        shuffle(allKana(script).filter(function (c) { return c.r !== info.r; })).forEach(function (c) {
          if (opts.length < 4 && opts.indexOf(c.r) < 0) opts.push(c.r);
        });
        const options = shuffle(opts);
        return { type: 'kana', id: x.id, main: x.id, mainHTML: esc(x.id), sub: '이 가나의 발음은?', speak: x.id,
          options: options, answer: options.indexOf(info.r),
          explain: '<b>' + esc(x.id) + '</b> = ' + esc(info.r), review: true };
      }).filter(Boolean));
    }
    if (kind === 'word' || kind === 'all') {
      const ids = wrongItems('word').map(function (x) { return x.id; });
      const list = WORDS.filter(function (w) { return ids.indexOf(w.id) >= 0; });
      items = items.concat(buildWordQuestions(list, list.length, 'mix').map(function (it) { it.review = true; return it; }));
    }
    if (kind === 'sent' || kind === 'all') {
      const ids = wrongItems('sent').map(function (x) { return x.id; });
      const list = SENTENCES.filter(function (s) { return ids.indexOf(s.id) >= 0; });
      items = items.concat(buildSentQuestions(list, list.length).map(function (it) { it.review = true; return it; }));
    }
    if (kind === 'jlpt' || kind === 'all') {
      const ids = wrongItems('jlpt').map(function (x) { return x.id; });
      const list = JLPT.filter(function (q) { return ids.indexOf(q.id) >= 0; });
      if (kind === 'jlpt') {
        items = items.concat(buildJlptQuestions('all', 99).filter(function (it) { return ids.indexOf(it.id) >= 0; }).map(function (it) { it.review = true; return it; }));
      } else {
        buildJlptQuestions('all', 99).forEach(function (it) {
          if (ids.indexOf(it.id) >= 0) { it.review = true; items.push(it); }
        });
      }
    }
    if (!items.length) { toast('다시 풀 문제가 없어요'); return; }
    startQuiz({ title: '오답 다시 풀기', items: items });
    return;
  }
  const uk = t.closest('[data-unstar-kana]');
  if (uk) { toggleStar('kana', uk.dataset.unstarKana); return; }
  const uw = t.closest('[data-unstar-word]');
  if (uw) { toggleStar('word', uw.dataset.unstarWord); return; }
  const us = t.closest('[data-unstar-sent]');
  if (us) { toggleStar('sent', us.dataset.unstarSent); return; }
  const dl = t.closest('[data-diary-list]');
  if (dl) { openDiaryList(); return; }
  const dw = t.closest('[data-diary]');
  if (dw) { openDiary(dw.dataset.diary); return; }
  const dcp = t.closest('[data-dcopykey]');
  if (dcp) { copyDiaryEntry(dcp.dataset.dcopykey, dcp); return; }
  const back = t.closest('[data-backup]');
  if (back) {
    const k = back.dataset.backup;
    if (k === 'export') { exportData(); return; }
    if (k === 'import') { const f = $('#importFile'); if (f) f.click(); return; }
    if (k === 'reset') {
      askConfirm('학습 기록을 초기화할까요?', '연속 학습일, 즐겨찾기, 오답노트, 쓴 일기, <b>데일리 루틴과 냉장고 목록</b>이 모두 사라집니다.<br>필요하면 먼저 <b>JSON 백업</b>을 내려받아 두세요.', '초기화', function () {
        S = defaultState();
        save();
        updateStreak();
        renderCurrent();
        toast('학습 기록을 초기화했어요');
      });
      return;
    }
  }
  const sent = t.closest('[data-sent]');
  if (sent) { openSentence(sent.dataset.sent); return; }
  const sp = t.closest('[data-speak]');
  if (sp) { speak(sp.dataset.speak); return; }
}

function onSheetClick(e) {
  const t = e.target;
  if (onRoutineSheetClick(e)) return;
  if (onFridgeSheetClick(e)) return;
  if (onDietSheetClick(e)) return;
  if (onWeightSheetClick(e)) return;
  if (t.closest('[data-n3esave]')) { n3SaveEdit(); return; }
  if (t.closest('[data-n3ereset]')) { n3ResetEdit(); return; }
  if (t.closest('[data-rmemosave]')) { saveRoutineMemo(); return; }
  if (t.closest('[data-rmemodel]')) {
    const mk = rMemoDraft ? rMemoDraft.date : routineDate;
    askConfirm('자세한 일기 지우기', '이 날 적어둔 메모를 지울까요?', '지우기', function () { clearRoutineMemo(mk); });
    return;
  }
  if (t.closest('[data-qnext]')) {
    Q.i++;
    Q.answered = false;
    renderQuiz();
    return;
  }
  if (t.closest('[data-qagain]')) {
    Q.i = 0; Q.ok = 0; Q.answered = false;
    renderQuiz();
    return;
  }
  if (t.closest('[data-qclose]')) { finishQuiz(); return; }
  if (t.closest('[data-confirm]')) {
    const cb = confirmCb;
    closeSheet();
    if (cb) cb();
    return;
  }
  if (t.closest('[data-cancel]')) { closeSheet(); return; }
  if (t.closest('[data-close]')) {
    const back = copySheetBack;
    copySheetBack = false;
    closeSheet();
    if (back && diaryDraft) renderDiarySheet();
    return;
  }
  const dlist = t.closest('[data-diary-list]');
  if (dlist) { openDiaryList(); return; }
  const dnew = t.closest('[data-diary]');
  if (dnew) { openDiary(dnew.dataset.diary); return; }
  const dm = t.closest('[data-dmood]');
  if (dm) { syncDiaryInputs(); diaryDraft.mood = dm.dataset.dmood; renderDiarySheet(); return; }
  const dwt = t.closest('[data-dweather]');
  if (dwt) { syncDiaryInputs(); diaryDraft.weather = dwt.dataset.dweather; renderDiarySheet(); return; }
  const dtp = t.closest('[data-dtpl]');
  if (dtp) { insertTemplate(DIARY_TEMPLATES[Number(dtp.dataset.dtpl)]); return; }
  const dsv = t.closest('[data-dsave]');
  if (dsv) { saveDiary(); return; }
  const dcp = t.closest('[data-dcopy]');
  if (dcp) { copyDiarySheet(); return; }
  const dcpk = t.closest('[data-dcopykey]');
  if (dcpk) { copyDiaryEntry(dcpk.dataset.dcopykey, dcpk); return; }
  const cps = t.closest('[data-copysheet]');
  if (cps) {
    const ta = $('#copyFallback');
    const txt = ta ? ta.value : '';
    if (!txt) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () {
        toast('복사됐어요! 채팅창에 붙여넣기 해주세요');
      }, function () {
        if (legacyCopy(txt)) toast('복사됐어요! 채팅창에 붙여넣기 해주세요');
        else toast('자동 복사가 안 돼요. 내용을 길게 눌러 복사해 주세요');
      });
    } else if (legacyCopy(txt)) {
      toast('복사됐어요! 채팅창에 붙여넣기 해주세요');
    } else {
      toast('자동 복사가 안 돼요. 내용을 길게 눌러 복사해 주세요');
    }
    return;
  }
  const ddel = t.closest('[data-ddel]');
  if (ddel) { deleteDiary(ddel.dataset.ddel); return; }
  const dedit = t.closest('[data-dedit]');
  if (dedit) { openDiary(dedit.dataset.dedit); return; }
  const dspk = t.closest('[data-dspeak]');
  if (dspk) {
    const e = diaryFor(dspk.dataset.dspeak);
    const live = $('#diaryText');
    speak((live && live.value.trim()) || (e && e.text) || '');
    return;
  }
  const opt = t.closest('[data-opt]');
  if (opt) { answerQuiz(Number(opt.dataset.opt)); return; }
  const td = t.closest('[data-talk-done]');
  if (td) {
    markStudy('talk');
    toast('오늘의 회화 학습 완료 🎌');
    closeSheet();
    renderCurrent();
    return;
  }
  const ss = t.closest('[data-starsent]');
  if (ss) {
    const id = ss.dataset.starsent;
    const arr = S.star.sent;
    const i = arr.indexOf(id);
    if (i >= 0) { arr.splice(i, 1); toast('즐겨찾기에서 뺐어요'); }
    else { arr.push(id); toast('★ 즐겨찾기에 저장했어요'); }
    save();
    ss.classList.toggle('on', i < 0);
    ss.textContent = (i < 0 ? '★ 저장됨' : '★ 저장');
    return;
  }
  const slow = t.closest('[data-speak-slow]');
  if (slow) { speak(slow.dataset.speakSlow, 0.6); return; }
  const sp = t.closest('[data-speak]');
  if (sp) { speak(sp.dataset.speak); return; }
}

/* ---------------- 시작 ---------------- */
function init() {
  loadState();
  updateStreak();
  syncDiaryToRoutine();
  save();

  $('#tabbar').addEventListener('click', function (e) {
    const b = e.target.closest('[data-tab]');
    if (b) switchTab(b.dataset.tab);
  });
  $('#streakChip').addEventListener('click', function () { switchTab('review'); });
  /* 바쿠고 사진 로드 실패는 조용히 다음 사진으로 (사진 목록에 아직 없는 파일이 있어도 화면이 비지 않게) */
  document.addEventListener('error', function (e) {
    const el = e.target;
    if (el && el.classList && el.classList.contains('buddy-img')) buddyImageBroken(el);
  }, true);
  $('#view-home').addEventListener('click', onHomeClick);
  $('#view-studytoday').addEventListener('click', onHomeClick);
  $('#view-routine').addEventListener('click', onRoutineClick);
  $('#view-routine').addEventListener('input', onRoutineInput);
  $('#view-routine').addEventListener('change', onRoutineInput);
  $('#view-fridge').addEventListener('click', onFridgeClick);
  /* 공부 하위 이동(가나/단어/회화) 등 어느 화면에서든 동작하는 탭 이동 */
  document.querySelector('main').addEventListener('click', function (e) {
    const g = e.target.closest ? e.target.closest('[data-goto]') : null;
    if (!g) return;
    if (currentTab === 'home' || currentTab === 'studytoday') return; /* 홈·오늘의 학습은 자체 핸들러가 처리 */
    switchTab(g.dataset.goto);
  });
  $('#view-kana').addEventListener('click', onKanaClick);
  $('#view-words').addEventListener('click', onWordsClick);
  $('#view-gram').addEventListener('click', onGramClick);
  $('#view-review').addEventListener('click', onReviewClick);
  $('#sheetPanel').addEventListener('click', onSheetClick);
  $('#sheetPanel').addEventListener('change', onRoutineSheetChange);
  $('#sheetBackdrop').addEventListener('click', function () {
    if (Q.active) { Q.active = false; Q.items = []; Q.onDone = null; }
    closeSheet();
    renderCurrent();
  });
  $('#view-review').addEventListener('change', function (e) {
    if (e.target && e.target.id === 'importFile') importData(e.target.files && e.target.files[0]);
  });

  let rt = null;
  window.addEventListener('resize', function () {
    if (currentTab !== 'kana') return;
    clearTimeout(rt);
    rt = setTimeout(function () {
      const keep = pad.strokes.slice();
      initPad();
      pad.strokes = keep;
      drawPad();
    }, 180);
  });

  renderCurrent();
  updateStreakChip();
  fridgeQuietSync();
  dietQuietSync();
  weightQuietSync();

  /* 홈 화면 추가·오프라인용 서비스 워커 (http/https에서만, 파일로 열 때는 건너뜀) */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>
