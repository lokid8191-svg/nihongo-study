<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<meta name="description" content="JLPT N5 · 일상회화 일본어 학습 앱. 오프라인 단독 실행.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日本語ノート">
<!-- 홈 화면에 추가(PWA). manifest·아이콘이 없어도 index.html 단독으로 그대로 동작합니다. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>日本語ノート · N5 학습</title>
<style>
:root{
  --bg:#F7F5F0;
  --surface:#FFFFFF;
  --surface-2:#FBF9F5;
  --ink:#1F2733;
  --ink-2:#5C6572;
  --ink-3:#8D939C;
  --line:#E7E2D8;
  --primary:#2C5D52;
  --primary-soft:#E7F0EC;
  --accent:#C2563C;
  --accent-soft:#FBEBE5;
  --gold:#D9A441;
  --ok:#2F7D5C;
  --bad:#C0453A;
  --shadow:0 1px 2px rgba(31,39,51,.04), 0 6px 18px rgba(31,39,51,.045);
  --radius:16px;
  --tab-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none}
body{
  font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{cursor:default}
h1,h2,h3,h4,p{margin:0}
ruby{ruby-position:over}
rt{font-size:.5em;color:var(--ink-3);font-weight:500;letter-spacing:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow-x:hidden}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 16px 12px;background:rgba(247,245,240,.92);
  backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid rgba(231,226,216,.7);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:40px;height:40px;border-radius:13px;background:var(--primary);color:#fff;
  display:grid;place-items:center;font-size:21px;font-weight:600;flex:none;
  box-shadow:0 4px 12px rgba(44,93,82,.24);letter-spacing:-1px;
}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand p{font-size:11.5px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak-chip{
  display:flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;flex:none;
  box-shadow:var(--shadow);
}
.streak-chip span{color:var(--accent)}

/* ---------- views ---------- */
main{flex:1 0 auto;padding-bottom:calc(var(--tab-h) + 26px + env(safe-area-inset-bottom))}
.view{display:none;animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.view-inner{padding:16px 16px 8px;display:flex;flex-direction:column;gap:14px}

.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 2px -2px}
.section-title h2{font-size:14.5px;font-weight:700;letter-spacing:.1px;display:flex;align-items:center;gap:7px}
.section-title h2::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent);display:inline-block}
.section-title .hint{font-size:11.5px;color:var(--ink-3)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card.tight{padding:13px 14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-head h3{font-size:13.5px;font-weight:700}
.card-head .sub{font-size:11.5px;color:var(--ink-3)}

/* ---------- streak / today ---------- */
.hero{
  border-radius:20px;padding:18px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#2C5D52 0%,#356A5C 55%,#2A4E57 100%);
  box-shadow:0 10px 24px rgba(44,93,82,.24);
}
.hero::after{
  content:"あ";position:absolute;right:-16px;bottom:-66px;font-size:104px;font-weight:700;
  color:rgba(255,255,255,.055);line-height:1;pointer-events:none;
}
.hero .greet{font-size:12.5px;opacity:.82;letter-spacing:.2px}
.hero .streak-line{display:flex;align-items:flex-end;gap:8px;margin-top:6px}
.hero .streak-num{font-size:40px;font-weight:800;line-height:1;letter-spacing:-1px}
.hero .streak-msg{font-size:12.5px;opacity:.9;padding-bottom:5px}
.hero .hero-sub{font-size:12.5px;opacity:.85;margin-top:10px}
.week-row{display:flex;justify-content:space-between;margin-top:14px;position:relative;z-index:1}
.day-cell{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.day-dot{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  background:rgba(255,255,255,.14);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.16);
}
.day-dot.on{background:#fff;color:var(--primary);font-weight:700;border-color:#fff}
.day-dot.today{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.day-label{font-size:10px;opacity:.7}

.checklist{display:flex;flex-direction:column;gap:2px}
.check-row{display:flex;align-items:center;gap:12px;padding:11px 2px;min-height:56px}
.check-row + .check-row{border-top:1px solid var(--surface-2)}
.check-circle{
  width:26px;height:26px;border-radius:50%;border:1.8px solid var(--line);flex:none;
  display:grid;place-items:center;color:#fff;font-size:14px;transition:.2s;background:var(--surface-2);
}
.check-row.done .check-circle{background:var(--primary);border-color:var(--primary)}
.check-txt{flex:1;min-width:0}
.check-txt b{display:block;font-size:13.5px;font-weight:600}
.check-txt span{display:block;font-size:11.5px;color:var(--ink-3)}
.check-row.done .check-txt b{color:var(--ink-3);text-decoration:line-through}
.progress{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#4E8A76);border-radius:99px;transition:width .35s ease;width:0}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;
  border-radius:12px;font-size:14px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);
  transition:transform .06s ease, background .15s ease;white-space:nowrap;
}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(44,93,82,.2)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(194,86,60,.18)}
.btn-ghost{background:transparent}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn-danger{color:var(--bad);border-color:#EFD9D5;background:#FDF4F2}
.btn-copy{background:var(--primary-soft);border-color:#CFE0D8;color:var(--primary)}
.btn-copy:active{background:#DCEAE4}
.copy-hint{font-size:11px;color:var(--ink-3);text-align:center;margin-top:6px;line-height:1.5}
.btn:disabled{opacity:.5;box-shadow:none}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

/* ---------- segmented / chips ---------- */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);transition:.15s}
.seg button.active{background:var(--primary);color:#fff;box-shadow:0 3px 9px rgba(44,93,82,.2)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  min-height:34px;padding:0 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex:none;
}
.chip.active{background:var(--accent-soft);border-color:#EBC7BC;color:#A8452F}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--primary-soft);color:var(--primary)}
.badge.gold{background:#FBF1DD;color:#9C7526}
.badge.grey{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}

/* ---------- kana ---------- */
.kana-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kana-grid.yoon{grid-template-columns:repeat(3,1fr)}
.kana-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  height:62px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  box-shadow:0 1px 1px rgba(31,39,51,.03);transition:.14s;
}
.kana-cell .k{font-size:23px;font-weight:500;line-height:1.1;letter-spacing:0}
.kana-cell .r{font-size:10px;color:var(--ink-3);letter-spacing:.2px}
.kana-cell:active{background:var(--primary-soft);border-color:#C9DED6;transform:scale(.96)}
.kana-cell.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px var(--primary) inset}
.kana-cell.sel .k{font-weight:700;color:var(--primary)}
.kana-grid.yoon .kana-cell{height:58px}
.kana-grid.yoon .kana-cell .k{font-size:20px}

/* ---------- writing pad ---------- */
.pad-card{padding:14px}
.pad-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pad-char{font-size:13px;color:var(--ink-2)}
.pad-char b{font-size:17px;color:var(--ink);margin-left:3px}
.pad-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:
  linear-gradient(to right,transparent 49.6%,#EEE9DF 49.6%,#EEE9DF 50.4%,transparent 50.4%),
  linear-gradient(to bottom,transparent 49.6%,#EEE9DF 49.6%,#EEE9DF 50.4%,transparent 50.4%),
  #FCFBF8}
#padCanvas{display:block;width:100%;height:280px;touch-action:none;cursor:crosshair}
.pad-tools{display:flex;gap:7px;margin-top:11px;align-items:center}
.pad-tools .btn{flex:1}
.pad-tools .icon-btn{flex:none}
.icon-btn{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:var(--surface-2);border:1px solid var(--line);font-size:16px;
}
.icon-btn:active{background:var(--primary-soft)}
.icon-btn.starred{color:var(--gold);background:#FCF5E4;border-color:#F0DFB4}
.pad-tip{font-size:11.5px;color:var(--ink-3);margin-top:8px;text-align:center}

/* ---------- flashcard ---------- */
.flash{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);padding:20px 18px;min-height:266px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;text-align:center;transition:transform .1s ease;
}
.flash:active{transform:scale(.995)}
.flash .flash-top{position:absolute;top:12px;left:14px;right:12px;display:flex;align-items:center;justify-content:space-between}
.flash-word{font-size:52px;font-weight:600;line-height:1.2;letter-spacing:1px;margin-top:8px}
.flash-word ruby rt{font-size:.3em;letter-spacing:0}
.flash-kana{font-size:19px;color:var(--primary);font-weight:600;margin-top:2px;letter-spacing:1px}
.flash-romaji{font-size:12.5px;color:var(--ink-3);letter-spacing:.6px;text-transform:none}
.flash-ko{
  font-size:16px;font-weight:600;color:var(--ink);margin-top:8px;padding-top:12px;
  border-top:1px dashed var(--line);width:82%;
}
.flash .tap-hint{font-size:11.5px;color:var(--ink-3);margin-top:14px}
.flash.revealed .flash-ko{color:var(--accent)}
.hidden{display:none !important}

.flash-nav{display:flex;align-items:center;gap:8px;margin-top:2px}
.flash-nav .btn{flex:1}
.flash-count{font-size:12px;color:var(--ink-3);text-align:center;margin-top:2px}
.flash-tools{display:flex;gap:7px;margin-top:10px}

/* ---------- word lists ---------- */
.word-list{display:flex;flex-direction:column}
.word-row{display:flex;align-items:center;gap:11px;padding:11px 2px;min-height:56px}
.word-row + .word-row{border-top:1px solid var(--surface-2)}
.word-main{flex:1;min-width:0}
.word-jp{font-size:17px;font-weight:600;letter-spacing:.3px}
.word-jp ruby rt{font-size:.42em}
.word-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.word-ko{font-size:13px;color:var(--ink-2);flex:none;max-width:42%;text-align:right}

/* ---------- grammar ---------- */
.gram-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.gram-card > summary{
  list-style:none;display:flex;align-items:center;gap:10px;padding:14px;min-height:56px;cursor:pointer;
}
.gram-card > summary::-webkit-details-marker{display:none}
.gram-card > summary::after{content:"›";margin-left:auto;color:var(--ink-3);font-size:20px;transform:rotate(90deg);transition:.2s}
.gram-card[open] > summary::after{transform:rotate(-90deg)}
.gram-key{
  width:38px;height:38px;border-radius:11px;background:var(--primary-soft);color:var(--primary);
  display:grid;place-items:center;font-size:15px;font-weight:700;flex:none;
}
.gram-t{flex:1;min-width:0}
.gram-t b{display:block;font-size:13.5px;font-weight:700}
.gram-t span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.gram-body{padding:0 14px 14px}
.gram-body p{font-size:12.5px;color:var(--ink-2);margin-bottom:10px;line-height:1.6}
.ex{background:var(--surface-2);border:1px solid #F0EBE1;border-radius:11px;padding:11px 12px;margin-top:8px}
.ex-jp{font-size:16px;font-weight:600;line-height:1.5;letter-spacing:.3px}
.ex-jp ruby rt{font-size:.44em}
.ex-kana{font-size:11.5px;color:var(--primary);margin-top:2px}
.ex-ko{font-size:12px;color:var(--ink-2);margin-top:3px}
.ex-romaji{font-size:11px;color:var(--ink-3);margin-top:2px;letter-spacing:.2px}
.ex-actions{display:flex;gap:6px;margin-top:8px}
.mini-btn{
  min-height:32px;padding:0 10px;border-radius:9px;font-size:11.5px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;
}
.mini-btn:active{background:var(--primary-soft)}
.mini-btn.on{color:var(--gold);border-color:#F0DFB4;background:#FCF5E4}

/* ---------- stats ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 13px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:21px;font-weight:800;letter-spacing:-.5px}
.stat span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.empty{text-align:center;color:var(--ink-3);font-size:12.5px;padding:22px 10px;line-height:1.7}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:100%;max-width:480px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line);
}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:50px;border-radius:11px;color:var(--ink-3);font-size:10.5px;font-weight:600;letter-spacing:.1px}
.tab svg{width:21px;height:21px;stroke-width:1.7}
.tab.active{color:var(--primary);background:var(--primary-soft)}
.tab:active{background:var(--surface-2)}

/* ---------- sheet / quiz ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(24,30,38,.42);animation:fade .18s ease}
.sheet-panel{
  position:relative;width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow-y:auto;
  background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .26s cubic-bezier(.2,.8,.2,1);
}
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.sheet-grip{width:38px;height:4px;border-radius:99px;background:#DCD6CB;margin:0 auto 12px}
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.quiz-head b{font-size:13px;font-weight:700}
.quiz-head span{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.q-progress{height:6px;border-radius:99px;background:#E9E4DA;overflow:hidden;margin-bottom:16px}
.q-progress > i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s ease}
.q-body{text-align:center;padding:6px 0 4px}
.q-main{font-size:44px;font-weight:600;line-height:1.25;letter-spacing:1px}
.q-main.kr{font-size:20px;letter-spacing:0;line-height:1.45}
.q-main.small{font-size:26px;letter-spacing:0}
.q-sub{font-size:12.5px;color:var(--ink-3);margin-top:7px}
.q-options{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.q-opt{
  min-height:52px;padding:10px 14px;border-radius:13px;background:var(--surface);border:1.4px solid var(--line);
  font-size:15px;font-weight:600;text-align:left;display:flex;align-items:center;gap:9px;transition:.15s;
}
.q-opt .num{
  width:22px;height:22px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:11px;color:var(--ink-3);flex:none;font-weight:700;
}
.q-opt.ja{font-size:17px;font-weight:600}
.q-opt.ok{border-color:var(--ok);background:#EDF6F1;color:#1F6347}
.q-opt.ok .num{background:var(--ok);color:#fff;border-color:var(--ok)}
.q-opt.bad{border-color:#E5B3AC;background:#FCEFED;color:#9C372C}
.q-opt.bad .num{background:var(--bad);color:#fff;border-color:var(--bad)}
.q-opt:disabled{opacity:1}
.q-opt.faded{opacity:.55}
.q-feedback{margin-top:14px;font-size:12.5px;line-height:1.6;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.q-feedback b{color:var(--ink)}
.q-feedback.ok{border-color:#CBE3D7;background:#F1F8F4}
.q-feedback.bad{border-color:#EBD3CE;background:#FDF3F1}
.q-foot{margin-top:14px;display:flex;gap:8px}
.q-foot .btn{flex:1}
.q-score{text-align:center;padding:8px 0 4px}
.q-score .big{font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1.1}
.q-score .big small{font-size:16px;color:var(--ink-3);font-weight:700;letter-spacing:0}
.q-score p{font-size:13px;color:var(--ink-2);margin-top:6px}
.q-score .emoji{font-size:34px;display:block;margin-bottom:6px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:rgba(31,39,51,.94);color:#fff;font-size:12.5px;padding:10px 16px;border-radius:99px;z-index:90;
  opacity:0;pointer-events:none;transition:.22s;max-width:88%;text-align:center;
}

/* ---------------- 기본 유틸 ---------------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isKanji = ch => /[\u4e00-\u9fff]/.test(ch);
const pad2 = n => String(n).padStart(2, '0');
const rand = n => Math.floor(Math.random() * n);
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function dkey(d) { const x = d || new Date(); return x.getFullYear() + '-' + pad2(x.getMonth() + 1) + '-' + pad2(x.getDate()); }
function dayIndex() { const now = new Date(); const start = new Date(now.getFullYear(), 0, 0); return Math.floor((now - start) / 86400000); }
function koreanDate(d) { const x = d || new Date(); return (x.getMonth() + 1) + '월 ' + x.getDate() + '일'; }

/* 후리가나: 한자 부분에만 읽기를 붙이고 꼬리 가나는 그대로 둔다 */
function rubyHTML(jp, kana, show) {
  const base = String(jp || ''), rd = String(kana || '');
  if (!show || !rd || base === rd) return esc(base);
  let i = base.length - 1, j = rd.length - 1;
  while (i >= 0 && j >= 0 && base[i] === rd[j] && !isKanji(base[i])) { i--; j--; }
  const kanjiPart = base.slice(0, i + 1);
  const tail = base.slice(i + 1);
  const ruby = rd.slice(0, j + 1);
  if (!kanjiPart) return esc(base);
  return '<ruby>' + esc(kanjiPart) + '<rt>' + esc(ruby) + '</rt></ruby>' + esc(tail);
}

/* ---------------- 저장소 ---------------- */
const KEY = 'seon-japanese-v1';
function defaultState() {
  return {
    v: 1,
    days: {},
    star: { kana: [], word: [], sent: [] },
    wrong: { kana: {}, word: {}, sent: {}, jlpt: {} },
    stats: { answered: 0, correct: 0, quizzes: 0 },
    settings: { furigana: false, romaji: false, rate: 0.75 },
    diary: {},
    streak: 0
  };
}
function normalizeState(raw) {
  const d = defaultState();
  const p = raw && typeof raw === 'object' ? raw : {};
  const s = {
    v: 1,
    days: p.days && typeof p.days === 'object' ? p.days : {},
    star: Object.assign({ kana: [], word: [], sent: [] }, p.star || {}),
    wrong: Object.assign({ kana: {}, word: {}, sent: {}, jlpt: {} }, p.wrong || {}),
    stats: Object.assign({ answered: 0, correct: 0, quizzes: 0 }, p.stats || {}),
    settings: Object.assign({ furigana: false, romaji: false, rate: 0.75 }, p.settings || {}),
    diary: p.diary && typeof p.diary === 'object' ? p.diary : {},
    streak: Number(p.streak) || 0
  };
  ['kana', 'word', 'sent'].forEach(k => { if (!Array.isArray(s.star[k])) s.star[k] = []; });
  ['kana', 'word', 'sent', 'jlpt'].forEach(k => {
    let w = s.wrong[k];
    if (Array.isArray(w)) { const o = {}; w.forEach(id => { o[id] = { n: 1, t: Date.now() }; }); w = o; }
    if (!w || typeof w !== 'object') w = {};
    s.wrong[k] = w;
  });
  if (!(Number(s.settings.rate) > 0)) s.settings.rate = 0.75;
  return s;
}
let S = defaultState();
function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) S = normalizeState(JSON.parse(raw));
  } catch (e) {
    console.warn('저장된 학습 기록을 읽지 못했습니다.', e);
    S = defaultState();
  }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('학습 기록을 저장하지 못했어요 (저장 공간 부족)'); }
}
function updateStreak() {
  let n = 0;
  const d = new Date();
  if (!S.days[dkey(d)]) d.setDate(d.getDate() - 1);
  let guard = 0;
  while (S.days[dkey(d)] && guard++ < 3650) { n++; d.setDate(d.getDate() - 1); }
  S.streak = n;
}
function markStudy(kind) {
  const k = dkey();
  if (!S.days[k]) S.days[k] = {};
  S.days[k][kind] = true;
  updateStreak();
  save();
  updateStreakChip();
  if (currentTab === 'today') renderToday();
}

let jaVoice = null;
const speechOK = (typeof window !== 'undefined') && ('speechSynthesis' in window) && typeof SpeechSynthesisUtterance !== 'undefined';
function loadVoices() {
  if (!speechOK) return;
  try {
    const vs = speechSynthesis.getVoices() || [];
    jaVoice = vs.find(v => /ja[-_]JP/i.test(v.lang || '')) || vs.find(v => String(v.lang || '').toLowerCase().indexOf('ja') === 0) || null;
  } catch (e) { jaVoice = null; }
}
if (speechOK) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, rate) {
  if (!speechOK || !text) { toast('이 브라우저에서는 음성을 재생할 수 없어요'); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'ja-JP';
    if (jaVoice) u.voice = jaVoice;
    u.rate = rate || Number(S.settings.rate) || 0.9;
    u.pitch = 1;
    speechSynthesis.speak(u);
  } catch (e) { toast('음성을 재생하지 못했어요'); }
}

function kanaSets() {

    { list: KANA_SEION, script: 'hira', name: '청음' },
    { list: KANA_DAKU, script: 'hira', name: '탁음' },

    { list: KANA_YOON, script: 'hira', name: '요음' },
    { list: KANA_YOON, script: 'kata', name: '요음' }
  ];
}
function allKana(script) {
  const out = [];
  [KANA_SEION, KANA_DAKU, KANA_YOON].forEach(list => {
    list.forEach(row => {
      const ch = script === 'kata' ? row[1] : row[0];
      out.push({ ch: ch, r: row[2] });
    });
  });
  return out;
}
function kanaInfo(ch) {
  const sets = [KANA_SEION, KANA_DAKU, KANA_YOON];
  for (let s = 0; s < sets.length; s++) {
    for (let i = 0; i < sets[s].length; i++) {
      const row = sets[s][i];
      if (row[1] === ch) return { ch: ch, h: row[0], k: row[1], r: row[2] };
      if (row[0] === ch) return { ch: ch, h: row[0], k: row[1], r: row[2] };
    }
  }
  return null;
}
function isKata(ch) { return /[\u30a0-\u30ff]/.test(ch); }

/* ---------------- 퀴즈 엔진 ---------------- */
const Q = { active: false, items: [], i: 0, title: '', ok: 0, answered: false, onDone: null };

function startQuiz(opts) {
  if (!opts || !opts.items || !opts.items.length) { toast('문제를 준비하지 못했어요'); return; }
  Q.active = true;
  Q.items = opts.items;
  Q.i = 0;
  Q.title = opts.title || '퀴즈';
  Q.ok = 0;
  Q.answered = false;
  Q.onDone = opts.onDone || null;
  S.stats.quizzes++;
  save();
  renderQuiz();
}
function renderQuiz() {
  if (!Q.active) return;
  const it = Q.items[Q.i];
  if (!it) { renderQuizSummary(); return; }
  const pct = Math.max(4, Math.round((Q.i / Q.items.length) * 100));
  const opts = it.options.map((o, i) =>
    '<button class="q-opt ' + (it.optClass || '') + '" data-opt="' + i + '"><span class="num">' + (i + 1) + '</span><span>' + o + '</span></button>'
  ).join('');
  openSheet(
    '<div class="quiz-head"><b>' + esc(Q.title) + '</b><span>' + (Q.i + 1) + ' / ' + Q.items.length + '</span></div>' +
    '<div class="q-progress"><i style="width:' + pct + '%"></i></div>' +
    '<div class="q-body">' +
      '<div class="q-main ' + (it.promptClass || '') + '">' + (it.mainHTML || esc(it.main || '')) + '</div>' +
      (it.sub ? '<div class="q-sub">' + esc(it.sub) + '</div>' : '') +
      (it.speak ? '<div style="margin-top:10px"><button class="mini-btn" data-speak="' + esc(it.speak) + '">🔊 발음 듣기</button></div>' : '') +
    '</div>' +
    '<div class="q-options">' + opts + '</div>' +
    '<div id="qFeedback"></div>' +
    '<div class="q-foot" id="qFoot"></div>'
  );
}
function recordWrong(it) {
  const key = it.type;
  if (!key || !S.wrong[key]) return;
  const cur = S.wrong[key][it.id];
  S.wrong[key][it.id] = { n: (cur && cur.n ? cur.n : 0) + 1, t: Date.now() };
}
function answerQuiz(idx) {
  if (!Q.active || Q.answered) return;
  const it = Q.items[Q.i];
  if (!it) return;
  Q.answered = true;
  const good = idx === it.answer;
  if (good) Q.ok++;
  S.stats.answered++;
  if (good) S.stats.correct++; else recordWrong(it);
  if (good && it.review && S.wrong[it.type] && S.wrong[it.type][it.id]) delete S.wrong[it.type][it.id];
  save();
  $$('.q-opt').forEach((b, i) => {
    b.disabled = true;
    if (i === it.answer) b.classList.add('ok');
    else if (i === idx) b.classList.add('bad');
    else b.classList.add('faded');
  });
  const fb = $('#qFeedback');
  if (fb) {
    fb.innerHTML = '<div class="q-feedback ' + (good ? 'ok' : 'bad') + '">' +
      (good ? '<b>정답이에요!</b> ' : '<b>아쉬워요.</b> ') + (it.explain || '') + '</div>';
  }
  const foot = $('#qFoot');
  if (foot) {
    foot.innerHTML = '<button class="btn btn-primary" data-qnext="1">' +
      (Q.i + 1 < Q.items.length ? '다음 문제' : '결과 보기') + '</button>';
  }
  updateStreakChip();
}
function renderQuizSummary() {
  const total = Q.items.length;
  const pct = total ? Math.round((Q.ok / total) * 100) : 0;
  const emoji = pct >= 90 ? '🎉' : pct >= 70 ? '👍' : pct >= 50 ? '💪' : '📖';
  const msg = pct >= 90 ? '거의 완벽해요!' : pct >= 70 ? '좋아요, 조금만 더!' : pct >= 50 ? '절반을 넘었어요.' : '오늘은 여기까지. 내일 다시 봐요.';
  openSheet(
    '<div class="q-score"><span class="emoji">' + emoji + '</span>' +
      '<div class="big">' + Q.ok + '<small> / ' + total + '</small></div>' +
      '<p>' + msg + ' · 정답률 ' + pct + '%</p></div>' +
    '<div class="q-foot"><button class="btn" data-qagain="1">한 번 더</button>' +
      '<button class="btn btn-primary" data-qclose="1">확인</button></div>'
  );
}
function finishQuiz() {
  const cb = Q.onDone;
  Q.active = false;
  Q.items = [];
  Q.onDone = null;
  closeSheet();
  if (typeof cb === 'function') cb();
  if (!Q.active) renderCurrent();
  updateStreakChip();
}

/* ---------------- 문제 생성: 가나 ---------------- */
function buildKanaQuestions(n) {
  const out = [];
  const used = {};
  let guard = 0;
  while (out.length < n && guard++ < 300) {
    const script = Math.random() < 0.72 ? 'hira' : 'kata';
    const groups = CONFUSABLE[script] || CONFUSABLE.hira;
    const raw = groups[rand(groups.length)] || groups[0];
    const grp = raw.filter((c, i, a) => a.indexOf(c) === i && kanaInfo(c));
    if (!grp.length) continue;
    const ch = grp[rand(grp.length)];
    const info = kanaInfo(ch);
    if (!info) continue;
    const sig = script + '|' + ch;
    if (used[sig]) continue;
    used[sig] = 1;

    const dir = Math.random() < 0.5 ? 'read' : 'pick';
    let main, mainHTML, promptClass, options, answer, sub, explain, optClass = '';
    const others = shuffle(allKana(script).filter(c => c.r !== info.r)).slice(0, 6);
    if (dir === 'read') {
      mainHTML = esc(ch);
      promptClass = '';
      sub = '이 가나의 발음(로마자)은?';
      const opts = [info.r];
      others.forEach(c => { if (opts.length < 4 && opts.indexOf(c.r) < 0) opts.push(c.r); });
      while (opts.length < 4) opts.push(['a', 'i', 'u', 'e', 'o', 'ka'][opts.length]);
      options = shuffle(opts);
      answer = options.indexOf(info.r);
      explain = '<b>' + esc(ch) + '</b>는 <b>' + esc(info.r) + '</b>로 읽어요. 비슷한 글자: ' + grp.filter(c => c !== ch).map(esc).join(' ');
    } else {
      main = info.r;
      mainHTML = esc(info.r);
      promptClass = 'small';
      sub = '이 발음의 가나를 고르세요';
      const opts = [ch];
      grp.filter(c => c !== ch).forEach(c => { if (opts.length < 3) opts.push(c); });
      others.forEach(c => { if (opts.length < 4 && opts.indexOf(c.ch) < 0) opts.push(c.ch); });
      options = shuffle(opts.slice(0, 4));
      answer = options.indexOf(ch);
      explain = '<b>' + esc(info.r) + '</b>는 <b>' + esc(ch) + '</b>. 헷갈릴 때는 획의 방향을 확인하세요.';
      optClass = 'ja';
    }
    out.push({
      type: 'kana', id: ch, main: main || ch, mainHTML: mainHTML, promptClass: promptClass,
      sub: sub, speak: ch, options: options, answer: Math.max(0, answer),
      explain: explain, optClass: optClass
    });
  }
  return out;
}

/* ---------------- 문제 생성: 단어 ---------------- */
function buildWordQuestions(list, count, mode) {
  const pool = (list && list.length ? list : WORDS).slice();
  const picked = shuffle(pool).slice(0, Math.min(count || 10, pool.length));
  return picked.map(w => {
    let m = mode === 'mix' || !mode ? (Math.random() < 0.5 ? 'meaning' : 'reading') : mode;
    if (m === 'reading' && w.jp === w.kana) m = 'meaning';
    if (m === 'reading') {
      const opts = [w.kana];
      shuffle(WORDS.filter(x => x.id !== w.id && x.kana !== w.kana)).forEach(x => {
        if (opts.length < 4 && opts.indexOf(x.kana) < 0) opts.push(x.kana);
      });
      const options = shuffle(opts);
      return {
        type: 'word', id: w.id, main: w.jp,
        mainHTML: esc(w.jp), sub: '읽기(후리가나)를 고르세요',
        speak: w.kana, options: options, answer: options.indexOf(w.kana),
        explain: '<b>' + esc(w.jp) + '</b> = ' + esc(w.kana) + ' (' + esc(w.romaji) + ') · ' + esc(w.ko),
        optClass: 'ja'
      };
    }
    const opts = [w.ko];
    shuffle(WORDS.filter(x => x.id !== w.id && x.ko !== w.ko)).forEach(x => {
      if (opts.length < 4 && opts.indexOf(x.ko) < 0) opts.push(x.ko);
    });
    const options = shuffle(opts);
    return {
      type: 'word', id: w.id, main: w.jp,
      mainHTML: rubyHTML(w.jp, w.kana, S.settings.furigana), sub: '뜻을 고르세요',
      speak: w.kana, options: options, answer: options.indexOf(w.ko),
      explain: '<b>' + esc(w.jp) + '</b> = ' + esc(w.kana) + ' · ' + esc(w.ko)
    };
  });
}

/* ---------------- 문제 생성: 회화 ---------------- */
function buildSentQuestions(list, count) {
  const pool = (list && list.length ? list : SENTENCES).slice();
  const picked = shuffle(pool).slice(0, Math.min(count || 10, pool.length));
  return picked.map(s => {
    const opts = [s.jp];
    shuffle(SENTENCES.filter(x => x.id !== s.id)).forEach(x => {
      if (opts.length < 4 && opts.indexOf(x.jp) < 0) opts.push(x.jp);
    });
    const options = shuffle(opts);
    return {
      type: 'sent', id: s.id, main: s.ko, mainHTML: esc(s.ko), promptClass: 'kr',
      sub: '이 뜻에 맞는 일본어 문장은?', speak: s.kana,
      options: options.map(esc), answer: options.indexOf(s.jp),
      explain: '<b>' + esc(s.jp) + '</b><br>' + esc(s.kana) + ' · ' + esc(s.ko),
      optClass: 'ja'
    };
  });
}

/* ---------------- 문제 생성: JLPT ---------------- */
function buildJlptQuestions(kind, count) {
  let pool = JLPT.slice();
  if (kind && kind !== 'all') pool = pool.filter(q => q.kind === kind);
  const picked = shuffle(pool).slice(0, Math.min(count || pool.length, pool.length));
  return picked.map(q => {
    const paired = q.options.map((o, i) => ({ o: o, ok: i === q.answer }));
    const sh = shuffle(paired);
    const options = sh.map(p => esc(p.o));
    const answer = sh.findIndex(p => p.ok);
    return {
      type: 'jlpt', id: q.id, main: q.prompt, mainHTML: esc(q.prompt), promptClass: 'small',
      sub: q.sub, options: options, answer: answer,
      explain: q.exp + ' → 정답: <b>' + esc(q.options[q.answer]) + '</b>'
    };
  });
}

function initPad() {
  const c = $('#padCanvas');
  if (!c) { pad.canvas = null; return; }
  pad.canvas = c;
  pad.ctx = c.getContext('2d');
  const rect = c.getBoundingClientRect();
  const w = Math.max(160, Math.round(rect.width || 300));
  const h = Math.round(rect.height || 280);
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  c.width = Math.round(w * dpr);
  c.height = Math.round(h * dpr);
  pad.dpr = dpr; pad.w = w; pad.h = h;
  pad.lw = Math.max(4, Math.min(w, h) * 0.048);
  pad.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawPad();
  if (c.dataset.bound === '1') return;
  c.dataset.bound = '1';

  function endStroke() {
    if (!pad.cur) return;
    pad.cur = null;
    if (pad.strokes.length && !pad.marked) {
      pad.marked = true;
      markStudy('kana');
      toast('따라 쓰기 기록 완료 · 오늘의 가나 학습');
    }
  }
  c.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (c.setPointerCapture) { try { c.setPointerCapture(e.pointerId); } catch (err) {} }
    const p = padPoint(e);
    pad.cur = [p];
    pad.strokes.push(pad.cur);
    dot(p);
  });
  c.addEventListener('pointermove', function (e) {
    if (!pad.cur) return;
    e.preventDefault();
    const p = padPoint(e);
    const last = pad.cur[pad.cur.length - 1];
    if (Math.abs(p.x - last.x) < 1.1 && Math.abs(p.y - last.y) < 1.1) return;
    pad.cur.push(p);
    segment(last, p);
  });
  c.addEventListener('pointerup', endStroke);
  c.addEventListener('pointercancel', endStroke);
  c.addEventListener('pointerleave', endStroke);
}
function padPoint(e) {
  const r = pad.canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function dot(p) {
  const ctx = pad.ctx; if (!ctx) return;
  ctx.fillStyle = '#2A3B52';
  ctx.beginPath();
  ctx.arc(p.x, p.y, pad.lw / 2, 0, Math.PI * 2);
  ctx.fill();
}
function segment(a, b) {
  const ctx = pad.ctx; if (!ctx) return;
  ctx.strokeStyle = '#2A3B52';
  ctx.lineWidth = pad.lw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}
function drawPad() {
  const ctx = pad.ctx; if (!ctx) return;
  const w = pad.w, h = pad.h;
  ctx.clearRect(0, 0, w, h);
  const size = Math.min(w, h) * 0.76;
  ctx.save();
  ctx.fillStyle = 'rgba(44,93,82,0.13)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 ' + size + 'px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
  ctx.fillText(pad.char, w / 2, h / 2 + size * 0.045);
  ctx.restore();
  ctx.strokeStyle = '#2A3B52';
  ctx.lineWidth = pad.lw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  pad.strokes.forEach(function (st) {
    if (!st.length) return;
    if (st.length === 1) { dot(st[0]); return; }
    ctx.beginPath();
    ctx.moveTo(st[0].x, st[0].y);
    for (let i = 1; i < st.length; i++) ctx.lineTo(st[i].x, st[i].y);
    ctx.stroke();
  });
}
function padMove(step) {
  const list = kanaScript === 'kata' ? KANA_SEION.map(r => r[1]) : KANA_SEION.map(r => r[0]);
  let i = list.indexOf(pad.char);
  if (i < 0) i = 0;
  i = (i + step + list.length) % list.length;
  pad.char = list[i];
  pad.strokes = [];
  const label = $('#padCharLabel');
  if (label) label.textContent = pad.char;
  $$('.kana-cell').forEach(function (b) { b.classList.toggle('sel', b.dataset.kana === pad.char); });
  const info = kanaInfo(pad.char);
  const hint = $('.section-title .hint');
  if (hint && info && currentTab === 'kana') {
    const secs = $$('#view-kana .section-title');
    const last = secs[secs.length - 1];
    if (last) { const hh = last.querySelector('.hint'); if (hh) hh.textContent = info.r; }
  }
  drawPad();
}
function selectKana(ch) {
  pad.char = ch;
  pad.strokes = [];
  const label = $('#padCharLabel');
  if (label) label.textContent = ch;
  $$('.kana-cell').forEach(function (b) { b.classList.toggle('sel', b.dataset.kana === ch); });
  const info = kanaInfo(ch);
  const sub = $('#view-kana .pad-head .pad-char');
  if (sub && info) sub.innerHTML = '따라 쓸 글자 <b id="padCharLabel">' + ch + '</b>';
  const starBtn = $('#view-kana [data-pad="star"]');
  if (starBtn) starBtn.classList.toggle('on', S.star.kana.indexOf(ch) >= 0);
  drawPad();
  speak(ch);
}

/* ---------------- 백업 ---------------- */
function exportData() {
  const payload = { app: 'nihongo-note', v: 1, exportedAt: new Date().toISOString(), state: S };
  try {
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'nihongo-note-' + dkey() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
    toast('백업 파일을 내려받았어요');
  } catch (e) { toast('백업 파일을 만들지 못했어요'); }
}
function importData(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = function () {
    try {
      const parsed = JSON.parse(String(fr.result));
      const st = parsed && parsed.state ? parsed.state : parsed;
      if (!st || typeof st !== 'object' || (!st.days && !st.stats && !st.star && !st.diary)) throw new Error('bad');
      S = normalizeState(st);
      save();
      updateStreak();
      renderCurrent();
      toast('학습 기록을 가져왔어요');
    } catch (e) { toast('이 파일은 학습 기록 백업이 아니에요'); }
  };
  fr.onerror = function () { toast('파일을 읽지 못했어요'); };
  fr.readAsText(file);
}

/* ---------- 첨삭용 복사 ----------
   일기를 채팅창에 붙여넣어 첨삭을 받을 수 있는 형식으로 만든다. */
let copySheetBack = false;
function proofreadBlock(date, mood, weather, jp, ko) {
  const d = String(date || '').trim() || dkey();
  const meta = [String(mood || '').replace(/\s+/g, ''), String(weather || '').replace(/\s+/g, '')]
    .filter(Boolean).join(' ');
  const lines = [
    '[일본어 일기 첨삭 부탁해요]',
    '날짜: ' + d + (meta ? ' (' + meta + ')' : ''),
    '일본어: ' + String(jp || '').trim()
  ];
  const k = String(ko || '').trim();
  if (k) lines.push('한국어 메모: ' + k);
  return lines.join('\n');
}
function legacyCopy(text) {
  let ok = false;
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
    ok = document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) { ok = false; }
  return ok;
}
function flashCopied(btn) {
  if (!btn || !btn.dataset) return;
  if (!btn.dataset.copyLabel) btn.dataset.copyLabel = btn.textContent;
  btn.textContent = '✅ 복사했어요';
  btn.classList.add('on');
  clearTimeout(btn._copyTimer);
  btn._copyTimer = setTimeout(function () {
    btn.textContent = btn.dataset.copyLabel;
    btn.classList.remove('on');
  }, 1600);
}
function copyProofreadRequest(text, btn, backToDiary) {
  const done = function (ok) {
    if (ok) {
      toast('복사됐어요! 채팅창에 붙여넣기 해주세요');
      flashCopied(btn);
    } else {
      showCopySheet(text, backToDiary);
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(legacyCopy(text)); });
  } else {
    done(legacyCopy(text));
  }
}
/* 클립보드가 막힌 환경(비보안 컨텍스트·권한 거부)에서는 직접 고를 수 있게 보여준다 */

/* ---------------- 탭 ----------------

const TABS = { today: renderToday, kana: renderKana, words: renderWords, gram: renderGram, review: renderReview };
function switchTab(tab) {
  if (!TABS[tab]) return;
  currentTab = tab;
  $$('.tab').forEach(function (b) {
    const on = b.dataset.tab === tab;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $$('.view').forEach(function (v) { v.classList.toggle('active', v.id === 'view-' + tab); });
  renderCurrent();
  try { window.scrollTo(0, 0); } catch (e) {}
}
function renderCurrent() { (TABS[currentTab] || renderToday)(); updateStreakChip(); }

/* ---------------- 이벤트 ---------------- */
function toggleStar(kind, id) {
  const arr = S.star[kind];
  if (!arr) return;
  const i = arr.indexOf(id);
  if (i >= 0) { arr.splice(i, 1); toast('즐겨찾기에서 뺐어요'); }
  else { arr.push(id); toast('★ 즐겨찾기에 저장했어요'); }
  save();
  renderCurrent();
}

function onTodayClick(e) {
  const t = e.target;
  const chk = t.closest('[data-check]');
  if (chk) {
    const k = chk.dataset.check;
    if (k === 'kana') startQuiz({ title: '가나 워밍업', items: buildKanaQuestions(5), onDone: function () { markStudy('kana'); } });
    else if (k === 'words') startQuiz({ title: '오늘의 단어 5개', items: buildWordQuestions(todayWords(), 5, 'mix'), onDone: function () { markStudy('words'); } });
    else openSentence(todaySentence().id);
    return;
  }
  if (t.closest('[data-routine]')) { startRoutine(); return; }
  const dl = t.closest('[data-diary-list]');
  if (dl) { openDiaryList(); return; }
  const dw = t.closest('[data-diary]');
  if (dw) { openDiary(dw.dataset.diary); return; }
  const dsp = t.closest('[data-diary-speak]');
  if (dsp) {
    const e = diaryFor(dsp.dataset.diarySpeak);
    speak(e && e.text ? e.text : '');
    return;
  }
  const dcp = t.closest('[data-dcopykey]');
  if (dcp) { copyDiaryEntry(dcp.dataset.dcopykey, dcp); return; }
  const go = t.closest('[data-goto]');
  if (go) { switchTab(go.dataset.goto); return; }
  const sp = t.closest('[data-speak-slow]');
  if (sp) { speak(sp.dataset.speakSlow, 0.6); return; }
  const s2 = t.closest('[data-speak]');
  if (s2) { speak(s2.dataset.speak); return; }
  const sent = t.closest('[data-sent]');
  if (sent) { openSentence(sent.dataset.sent); return; }
}

function onKanaClick(e) {
  const t = e.target;
  const sc = t.closest('[data-script]');
  if (sc) { kanaScript = sc.dataset.script; renderKana(); return; }
  const cell = t.closest('[data-kana]');
  if (cell) { selectKana(cell.dataset.kana); return; }
  const kq = t.closest('[data-kquiz]');
  if (kq) {
    const n = Number(kq.dataset.kquiz) || 5;
    if (n === 46) {
      const all = (kanaScript === 'kata' ? KANA_SEION.map(function (r) { return r[1]; }) : KANA_SEION.map(function (r) { return r[0]; }));
      const items = all.map(function (ch, i) {
        const info = kanaInfo(ch);
        const opts = [info.r];
        shuffle(all.map(function (c) { return kanaInfo(c).r; }).filter(function (r) { return r !== info.r; })).forEach(function (r) {
          if (opts.length < 4 && opts.indexOf(r) < 0) opts.push(r);
        });
        const options = shuffle(opts);
        return { type: 'kana', id: ch, main: ch, mainHTML: esc(ch), sub: '이 가나의 발음은?', speak: ch,
          options: options, answer: options.indexOf(info.r), explain: '<b>' + esc(ch) + '</b> = ' + esc(info.r) };
      });
      startQuiz({ title: '가나 46음 훑기', items: items, onDone: function () { markStudy('kana'); } });
      return;
    }
    startQuiz({ title: '헷갈리는 가나 ' + n + '문제', items: buildKanaQuestions(n), onDone: function () { markStudy('kana'); } });
    return;
  }
  const padBtn = t.closest('[data-pad]');
  if (padBtn) {
    const act = padBtn.dataset.pad;
    if (act === 'clear') { pad.strokes = []; drawPad(); return; }
    if (act === 'prev') { padMove(-1); return; }
    if (act === 'next') { padMove(1); return; }
    if (act === 'speak') { speak(pad.char); return; }
    if (act === 'star') { toggleStar('kana', pad.char); return; }
  }
  const sp = t.closest('[data-speak]');
  if (sp) { speak(sp.dataset.speak); return; }
}

function onWordsClick(e) {
  const t = e.target;
  const mode = t.closest('[data-wmode]');
  if (mode) { wState.mode = mode.dataset.wmode; wState.reveal = false; renderWords(); return; }
  const cat = t.closest('[data-cat]');
  if (cat) { wState.cat = cat.dataset.cat; wState.idx = 0; wState.reveal = false; renderWords(); return; }
  const wset = t.closest('[data-wset]');
  if (wset) {
    const k = wset.dataset.wset;
    if (k === 'furigana') { S.settings.furigana = !S.settings.furigana; toast('후리가나 ' + (S.settings.furigana ? 'ON · 읽기가 보여요' : 'OFF · 읽기 연습')); }
    else if (k === 'romaji') { S.settings.romaji = !S.settings.romaji; toast('로마자 ' + (S.settings.romaji ? 'ON' : 'OFF')); }
    else if (k === 'rate') { S.settings.rate = Number(S.settings.rate) === 1 ? 0.75 : 1; toast('재생 속도 ' + (Number(S.settings.rate) === 1 ? '1.0배' : '0.75배 (느리게)')); }
    else if (k === 'staronly') { wState.starredOnly = !wState.starredOnly; wState.idx = 0; if (wState.starredOnly && !S.star.word.length) toast('아직 즐겨찾기한 단어가 없어요'); }
    else if (k === 'shuffle') { wState.idx = rand(Math.max(1, filteredWords().length)); wState.reveal = false; toast('카드를 섞었어요'); }
    save();
    renderWords();
    return;
  }
  const flash = t.closest('[data-flash]');
  if (flash && !t.closest('[data-star]')) {
    wState.reveal = !wState.reveal;
    const card = flash;
    card.classList.toggle('revealed', wState.reveal);
    const ko = card.querySelector('.flash-ko');
    if (ko) ko.classList.toggle('hidden', !wState.reveal);
    const hint = card.querySelector('.tap-hint');
    if (hint) hint.textContent = wState.reveal ? '카드를 눌러 접기' : '카드를 누르면 뜻이 보여요';
    const arr = filteredWords();
    const w = arr[wState.idx];
    if (w && wState.reveal && !S.settings.furigana && w.jp !== w.kana) {
      const k = card.querySelector('.flash-kana');
      if (!k) {
        const div = document.createElement('div');
        div.className = 'flash-kana';
        div.textContent = w.kana;
        const wordEl = card.querySelector('.flash-word');
        if (wordEl && wordEl.parentNode) wordEl.parentNode.insertBefore(div, wordEl.nextSibling);
      }
    } else {
      const k = card.querySelector('.flash-kana');
      if (k && !S.settings.furigana) k.remove();
    }
    return;
  }
  const star = t.closest('[data-star]');
  if (star) { toggleStar('word', star.dataset.star); return; }
  const move = t.closest('[data-wmove]');
  if (move) {
    const arr = filteredWords();
    if (!arr.length) return;
    wState.idx = (wState.idx + Number(move.dataset.wmove) + arr.length) % arr.length;
    wState.reveal = false;
    renderWords();
    return;
  }
  const wq = t.closest('[data-wquiz]');
  if (wq) {
    const arr = filteredWords();
    const k = wq.dataset.wquiz;
    if (k === 'today') { startQuiz({ title: '오늘의 단어 5개', items: buildWordQuestions(todayWords(), 5, 'mix'), onDone: function () { markStudy('words'); } }); return; }
    if (k === 'single') {
      const w = arr[wState.idx];
      if (w) startQuiz({ title: '이 단어 퀴즈', items: buildWordQuestions([w], 1, 'mix'), onDone: function () { markStudy('words'); } });
      return;
    }
    const mode = k === 'meaning' ? 'meaning' : k === 'reading' ? 'reading' : 'mix';
    startQuiz({ title: '단어 퀴즈 · ' + (mode === 'mix' ? '섞어서' : mode === 'meaning' ? '뜻' : '읽기'), items: buildWordQuestions(arr, 10, mode), onDone: function () { markStudy('words'); } });
    return;
  }
  const slow = t.closest('[data-speak-slow]');
  if (slow) { speak(slow.dataset.speakSlow, 0.6); return; }
  const sp = t.closest('[data-speak]');
  if (sp) { speak(sp.dataset.speak); return; }
}

function onGramClick(e) {
  const t = e.target;
  const gt = t.closest('[data-gtab]');
  if (gt) { gTab = gt.dataset.gtab; renderGram(); return; }
  const sc = t.closest('[data-scene]');
  if (sc) { sentScene = sc.dataset.scene; renderGram(); return; }
  const g = t.closest('[data-gram]');
  if (g) {
    const item = GRAMMAR.filter(function (x) { return x.id === g.dataset.gram; })[0];
    gTab = 'gram';
    renderGram();
    setTimeout(function () {
      $$('#view-gram details').forEach(function (d) {
        const keyEl = d.querySelector('.gram-key');
        if (item && keyEl && keyEl.textContent.trim() === item.key) d.open = true;
      });
      const el = $$('#view-gram details').filter(function (d) { return d.open; }).pop();
      if (el) el.scrollIntoView({ block: 'center' });
    }, 60);
    return;
  }
  const jq = t.closest('[data-jlpt]');
  if (jq) {
    const kind = jq.dataset.jlpt;
    startQuiz({
      title: 'JLPT N5 미니 퀴즈',
      items: buildJlptQuestions(kind, kind === 'all' ? 12 : 8),
      onDone: function () { toast('JLPT 퀴즈 결과가 오답노트에 기록됐어요'); }
    });
    return;
  }
  const sq = t.closest('[data-squiz]');
  if (sq) {
    const list = sentScene === '전체' ? SENTENCES : SENTENCES.filter(function (s) { return s.scene === sentScene; });
    startQuiz({ title: '회화 문장 퀴즈', items: buildSentQuestions(list, 10), onDone: function () { markStudy('talk'); } });
    return;
  }
  const starsent = t.closest('[data-starsent]');
  if (starsent) { toggleStar('sent', starsent.dataset.starsent); return; }
  const sent = t.closest('[data-sent]');
  if (sent) { openSentence(sent.dataset.sent); return; }
  const slow = t.closest('[data-speak-slow]');
  if (slow) { speak(slow.dataset.speakSlow, 0.6); return; }
  const sp = t.closest('[data-speak]');
  if (sp) { speak(sp.dataset.speak); return; }
}

function onReviewClick(e) {
  const t = e.target;
  const rv = t.closest('[data-review]');
  if (rv) {
    const kind = rv.dataset.review;
    let items = [];
    if (kind === 'kana' || kind === 'all') {
      items = items.concat(wrongItems('kana').map(function (x) {
        const info = kanaInfo(x.id);
        if (!info) return null;
        const script = isKata(x.id) ? 'kata' : 'hira';
        const opts = [info.r];
        shuffle(allKana(script).filter(function (c) { return c.r !== info.r; })).forEach(function (c) {
          if (opts.length < 4 && opts.indexOf(c.r) < 0) opts.push(c.r);
        });
        const options = shuffle(opts);
        return { type: 'kana', id: x.id, main: x.id, mainHTML: esc(x.id), sub: '이 가나의 발음은?', speak: x.id,
          options: options, answer: options.indexOf(info.r),
          explain: '<b>' + esc(x.id) + '</b> = ' + esc(info.r), review: true };
      }).filter(Boolean));
    }
    if (kind === 'word' || kind === 'all') {
      const ids = wrongItems('word').map(function (x) { return x.id; });
      const list = WORDS.filter(function (w) { return ids.indexOf(w.id) >= 0; });
      items = items.concat(buildWordQuestions(list, list.length, 'mix').map(function (it) { it.review = true; return it; }));
    }
    if (kind === 'sent' || kind === 'all') {
      const ids = wrongItems('sent').map(function (x) { return x.id; });
      const list = SENTENCES.filter(function (s) { return ids.indexOf(s.id) >= 0; });
      items = items.concat(buildSentQuestions(list, list.length).map(function (it) { it.review = true; return it; }));
    }
    if (kind === 'jlpt' || kind === 'all') {
      const ids = wrongItems('jlpt').map(function (x) { return x.id; });
      const list = JLPT.filter(function (q) { return ids.indexOf(q.id) >= 0; });
      if (kind === 'jlpt') {
        items = items.concat(buildJlptQuestions('all', 99).filter(function (it) { return ids.indexOf(it.id) >= 0; }).map(function (it) { it.review = true; return it; }));
      } else {
        buildJlptQuestions('all', 99).forEach(function (it) {
          if (ids.indexOf(it.id) >= 0) { it.review = true; items.push(it); }
        });
      }
    }
    if (!items.length) { toast('다시 풀 문제가 없어요'); return; }
    startQuiz({ title: '오답 다시 풀기', items: items });
    return;
  }
  const uk = t.closest('[data-unstar-kana]');
  if (uk) { toggleStar('kana', uk.dataset.unstarKana); return; }
  const uw = t.closest('[data-unstar-word]');
  if (uw) { toggleStar('word', uw.dataset.unstarWord); return; }
  const us = t.closest('[data-unstar-sent]');
  if (us) { toggleStar('sent', us.dataset.unstarSent); return; }
  const dl = t.closest('[data-diary-list]');
  if (dl) { openDiaryList(); return; }
  const dw = t.closest('[data-diary]');
  if (dw) { openDiary(dw.dataset.diary); return; }
  const dcp = t.closest('[data-dcopykey]');
  if (dcp) { copyDiaryEntry(dcp.dataset.dcopykey, dcp); return; }
  const back = t.closest('[data-backup]');
  if (back) {
    const k = back.dataset.backup;
    if (k === 'export') { exportData(); return; }
    if (k === 'import') { const f = $('#importFile'); if (f) f.click(); return; }
    if (k === 'reset') {
      askConfirm('학습 기록을 초기화할까요?', '연속 학습일, 즐겨찾기, 오답노트, 쓴 일기가 모두 사라집니다.<br>필요하면 먼저 <b>JSON 백업</b>을 내려받아 두세요.', '초기화', function () {
        S = defaultState();
        save();
        updateStreak();
        renderCurrent();
        toast('학습 기록을 초기화했어요');
      });
      return;
    }
  }
  const sent = t.closest('[data-sent]');
  if (sent) { openSentence(sent.dataset.sent); return; }
  const sp = t.closest('[data-speak]');
  if (sp) { speak(sp.dataset.speak); return; }
}

function onSheetClick(e) {
  const t = e.target;
  if (t.closest('[data-qnext]')) {
    Q.i++;
    Q.answered = false;
    renderQuiz();
    return;
  }
  if (t.closest('[data-qagain]')) {
    Q.i = 0; Q.ok = 0; Q.answered = false;
    renderQuiz();
    return;
  }
  if (t.closest('[data-qclose]')) { finishQuiz(); return; }
  if (t.closest('[data-confirm]')) {
    const cb = confirmCb;
    closeSheet();
    if (cb) cb();
    return;
  }
  if (t.closest('[data-cancel]')) { closeSheet(); return; }
  if (t.closest('[data-close]')) {
    const back = copySheetBack;
    copySheetBack = false;
    closeSheet();
    if (back && diaryDraft) renderDiarySheet();
    return;
  }
  const dlist = t.closest('[data-diary-list]');
  if (dlist) { openDiaryList(); return; }
  const dnew = t.closest('[data-diary]');
  if (dnew) { openDiary(dnew.dataset.diary); return; }
  const dm = t.closest('[data-dmood]');
  if (dm) { syncDiaryInputs(); diaryDraft.mood = dm.dataset.dmood; renderDiarySheet(); return; }
  const dwt = t.closest('[data-dweather]');
  if (dwt) { syncDiaryInputs(); diaryDraft.weather = dwt.dataset.dweather; renderDiarySheet(); return; }
  const dtp = t.closest('[data-dtpl]');
  if (dtp) { insertTemplate(DIARY_TEMPLATES[Number(dtp.dataset.dtpl)]); return; }
  const dsv = t.closest('[data-dsave]');
  if (dsv) { saveDiary(); return; }
  const dcp = t.closest('[data-dcopy]');
  if (dcp) { copyDiarySheet(); return; }
  const dcpk = t.closest('[data-dcopykey]');
  if (dcpk) { copyDiaryEntry(dcpk.dataset.dcopykey, dcpk); return; }
  const cps = t.closest('[data-copysheet]');
  if (cps) {
    const ta = $('#copyFallback');
    const txt = ta ? ta.value : '';
    if (!txt) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () {
        toast('복사됐어요! 채팅창에 붙여넣기 해주세요');
      }, function () {
        if (legacyCopy(txt)) toast('복사됐어요! 채팅창에 붙여넣기 해주세요');
        else toast('자동 복사가 안 돼요. 내용을 길게 눌러 복사해 주세요');
      });
    } else if (legacyCopy(txt)) {
      toast('복사됐어요! 채팅창에 붙여넣기 해주세요');
    } else {
      toast('자동 복사가 안 돼요. 내용을 길게 눌러 복사해 주세요');
    }
    return;
  }
  const ddel = t.closest('[data-ddel]');
  if (ddel) { deleteDiary(ddel.dataset.ddel); return; }
  const dedit = t.closest('[data-dedit]');
  if (dedit) { openDiary(dedit.dataset.dedit); return; }
  const dspk = t.closest('[data-dspeak]');
  if (dspk) {
    const e = diaryFor(dspk.dataset.dspeak);
    const live = $('#diaryText');
    speak((live && live.value.trim()) || (e && e.text) || '');
    return;
  }
  const opt = t.closest('[data-opt]');
  if (opt) { answerQuiz(Number(opt.dataset.opt)); return; }
  const td = t.closest('[data-talk-done]');
  if (td) {
    markStudy('talk');
    toast('오늘의 회화 학습 완료 🎌');
    closeSheet();
    renderCurrent();
    return;
  }
  const ss = t.closest('[data-starsent]');
  if (ss) {
    const id = ss.dataset.starsent;
    const arr = S.star.sent;
    const i = arr.indexOf(id);
    if (i >= 0) { arr.splice(i, 1); toast('즐겨찾기에서 뺐어요'); }
    else { arr.push(id); toast('★ 즐겨찾기에 저장했어요'); }
    save();
    ss.classList.toggle('on', i < 0);
    ss.textContent = (i < 0 ? '★ 저장됨' : '★ 저장');
    return;
  }
  const slow = t.closest('[data-speak-slow]');
  if (slow) { speak(slow.dataset.speakSlow, 0.6); return; }
  const sp = t.closest('[data-speak]');
  if (sp) { speak(sp.dataset.speak); return; }
}

/* ---------------- 시작 ---------------- */
function init() {
  loadState();
  updateStreak();
  save();

  $('#tabbar').addEventListener('click', function (e) {
    const b = e.target.closest('[data-tab]');
    if (b) switchTab(b.dataset.tab);
  });
  $('#streakChip').addEventListener('click', function () { switchTab('review'); });
  $('#view-today').addEventListener('click', onTodayClick);
  $('#view-kana').addEventListener('click', onKanaClick);
  $('#view-words').addEventListener('click', onWordsClick);
  $('#view-gram').addEventListener('click', onGramClick);
  $('#view-review').addEventListener('click', onReviewClick);
  $('#sheetPanel').addEventListener('click', onSheetClick);
  $('#sheetBackdrop').addEventListener('click', function () {
    if (Q.active) { Q.active = false; Q.items = []; Q.onDone = null; }
    closeSheet();
    renderCurrent();
  });
  $('#view-review').addEventListener('change', function (e) {
    if (e.target && e.target.id === 'importFile') importData(e.target.files && e.target.files[0]);
  });

  let rt = null;
  window.addEventListener('resize', function () {
    if (currentTab !== 'kana') return;
    clearTimeout(rt);
    rt = setTimeout(function () {
      const keep = pad.strokes.slice();
      initPad();
      pad.strokes = keep;
      drawPad();
    }, 180);
  });

  renderCurrent();
  updateStreakChip();

  /* 홈 화면 추가·오프라인용 서비스 워커 (http/https에서만, 파일로 열 때는 건너뜀) */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>
