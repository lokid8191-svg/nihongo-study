<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F6">
<meta name="description" content="JLPT N5 일본어 학습 + 데일리 루틴·냉장고 관리. 오프라인 단독 실행.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="withかっちゃん">
<!-- 홈 화면에 추가(PWA). manifest·아이콘이 없어도 index.html 단독으로 그대로 동작합니다. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>withかっちゃん</title>
<style>
:root{
  --bg:#F3F4F6;
  --surface:#FFFFFF;
  --surface-2:#F7F8FA;
  --ink:#1F2733;
  --ink-2:#5C6572;
  --ink-3:#8D939C;
  --line:#E3E5E9;
  --primary:#DC2626;
  --primary-soft:#FEF2F2;
  --accent:#B91C1C;
  --accent-soft:#FEE2E2;
  --gold:#D9A441;
  --warn:#B45309;
  --ok:#15803D;
  --bad:#B91C1C;
  --shadow:0 1px 2px rgba(31,39,51,.04), 0 6px 18px rgba(31,39,51,.045);
  --radius:16px;
  --tab-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0;display:none}
body{
  font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{cursor:default}
h1,h2,h3,h4,p{margin:0}
ruby{ruby-position:over}
rt{font-size:.5em;color:var(--ink-3);font-weight:500;letter-spacing:0}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow-x:hidden}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px 16px 12px;background:rgba(243,244,246,.94);
  backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid rgba(227,229,233,.85);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:40px;height:40px;border-radius:8px;object-fit:cover;display:block;flex:none;
  background:var(--surface);box-shadow:0 4px 12px rgba(220,38,38,.22);
}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand p{font-size:11.5px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak-chip{
  display:flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;flex:none;
  box-shadow:var(--shadow);
}
.streak-chip span{color:var(--accent)}

/* ---------- views ---------- */
main{flex:1 0 auto;padding-bottom:calc(var(--tab-h) + 26px + env(safe-area-inset-bottom))}
.view{display:none;animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.view-inner{padding:16px 16px 8px;display:flex;flex-direction:column;gap:14px}

.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 2px -2px}
.section-title h2{font-size:14.5px;font-weight:700;letter-spacing:.1px;display:flex;align-items:center;gap:7px}
.section-title h2::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accent);display:inline-block}
.section-title .hint{font-size:11.5px;color:var(--ink-3)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card.tight{padding:13px 14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-head h3{font-size:13.5px;font-weight:700}
.card-head .sub{font-size:11.5px;color:var(--ink-3)}

/* ---------- streak / today ---------- */
.hero{
  border-radius:20px;padding:18px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#DC2626 0%,#B91C1C 55%,#7F1D1D 100%);
  box-shadow:0 10px 24px rgba(220,38,38,.22);
}
.hero::after{
  content:"あ";position:absolute;right:-16px;bottom:-66px;font-size:104px;font-weight:700;
  color:rgba(255,255,255,.055);line-height:1;pointer-events:none;
}
.hero .greet{font-size:12.5px;opacity:.82;letter-spacing:.2px}
.hero .streak-line{display:flex;align-items:flex-end;gap:8px;margin-top:6px}
.hero .streak-num{font-size:40px;font-weight:800;line-height:1;letter-spacing:-1px}
.hero .streak-msg{font-size:12.5px;opacity:.9;padding-bottom:5px}
.hero .hero-sub{font-size:12.5px;opacity:.85;margin-top:10px}
.week-row{display:flex;justify-content:space-between;margin-top:14px;position:relative;z-index:1}
.day-cell{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.day-dot{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  background:rgba(255,255,255,.14);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.16);
}
.day-dot.on{background:#fff;color:var(--primary);font-weight:700;border-color:#fff}
.day-dot.today{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.day-label{font-size:10px;opacity:.7}

.checklist{display:flex;flex-direction:column;gap:2px}
.check-row{display:flex;align-items:center;gap:12px;padding:11px 2px;min-height:56px}
.check-row + .check-row{border-top:1px solid var(--surface-2)}
.check-circle{
  width:26px;height:26px;border-radius:50%;border:1.8px solid var(--line);flex:none;
  display:grid;place-items:center;color:#fff;font-size:14px;transition:.2s;background:var(--surface-2);
}
.check-row.done .check-circle{background:var(--primary);border-color:var(--primary)}
.check-txt{flex:1;min-width:0}
.check-txt b{display:block;font-size:13.5px;font-weight:600}
.check-txt span{display:block;font-size:11.5px;color:var(--ink-3)}
.check-row.done .check-txt b{color:var(--ink-3);text-decoration:line-through}
.progress{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#F87171);border-radius:99px;transition:width .35s ease;width:0}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;
  border-radius:12px;font-size:14px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);
  transition:transform .06s ease, background .15s ease;white-space:nowrap;
}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(220,38,38,.2)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(220,38,38,.18)}
.btn-ghost{background:transparent}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn-danger{color:var(--bad);border-color:#FECACA;background:#FEF3F2}
.btn-copy{background:var(--primary-soft);border-color:#FECACA;color:var(--primary)}
.btn-copy:active{background:#FEE2E2}
.copy-hint{font-size:11px;color:var(--ink-3);text-align:center;margin-top:6px;line-height:1.5}
.btn:disabled{opacity:.5;box-shadow:none}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

/* ---------- segmented / chips ---------- */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.seg button{flex:1;min-height:38px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);transition:.15s}
.seg button.active{background:var(--primary);color:#fff;box-shadow:0 3px 9px rgba(220,38,38,.2)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  min-height:34px;padding:0 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex:none;
}
.chip.active{background:var(--accent-soft);border-color:#FECACA;color:#B91C1C}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--primary-soft);color:var(--primary)}
.badge.gold{background:#FEF3C7;color:#92400E}
.badge.grey{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}

/* ---------- kana ---------- */
.kana-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kana-grid.yoon{grid-template-columns:repeat(3,1fr)}
.kana-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  height:62px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  box-shadow:0 1px 1px rgba(31,39,51,.03);transition:.14s;
}
.kana-cell .k{font-size:23px;font-weight:500;line-height:1.1;letter-spacing:0}
.kana-cell .r{font-size:10px;color:var(--ink-3);letter-spacing:.2px}
.kana-cell:active{background:var(--primary-soft);border-color:#FECACA;transform:scale(.96)}
.kana-cell.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px var(--primary) inset}
.kana-cell.sel .k{font-weight:700;color:var(--primary)}
.kana-grid.yoon .kana-cell{height:58px}
.kana-grid.yoon .kana-cell .k{font-size:20px}

/* ---------- writing pad ---------- */
.pad-card{padding:14px}
.pad-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.pad-char{font-size:13px;color:var(--ink-2)}
.pad-char b{font-size:17px;color:var(--ink);margin-left:3px}
.pad-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:
  linear-gradient(to right,transparent 49.6%,#E7E9ED 49.6%,#E7E9ED 50.4%,transparent 50.4%),
  linear-gradient(to bottom,transparent 49.6%,#E7E9ED 49.6%,#E7E9ED 50.4%,transparent 50.4%),
  #FCFCFD}
#padCanvas{display:block;width:100%;height:280px;touch-action:none;cursor:crosshair}
.pad-tools{display:flex;gap:7px;margin-top:11px;align-items:center}
.pad-tools .btn{flex:1}
.pad-tools .icon-btn{flex:none}
.icon-btn{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:var(--surface-2);border:1px solid var(--line);font-size:16px;
}
.icon-btn:active{background:var(--primary-soft)}
.icon-btn.starred{color:var(--gold);background:#FFFBEB;border-color:#FDE68A}
.pad-tip{font-size:11.5px;color:var(--ink-3);margin-top:8px;text-align:center}

/* ---------- flashcard ---------- */
.flash{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);padding:20px 18px;min-height:266px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;text-align:center;transition:transform .1s ease;
}
.flash:active{transform:scale(.995)}
.flash .flash-top{position:absolute;top:12px;left:14px;right:12px;display:flex;align-items:center;justify-content:space-between}
.flash-word{font-size:52px;font-weight:600;line-height:1.2;letter-spacing:1px;margin-top:8px}
.flash-word ruby rt{font-size:.3em;letter-spacing:0}
.flash-kana{font-size:19px;color:var(--primary);font-weight:600;margin-top:2px;letter-spacing:1px}
.flash-romaji{font-size:12.5px;color:var(--ink-3);letter-spacing:.6px;text-transform:none}
.flash-ko{
  font-size:16px;font-weight:600;color:var(--ink);margin-top:8px;padding-top:12px;
  border-top:1px dashed var(--line);width:82%;
}
.flash .tap-hint{font-size:11.5px;color:var(--ink-3);margin-top:14px}
.flash.revealed .flash-ko{color:var(--accent)}
.hidden{display:none !important}

.flash-nav{display:flex;align-items:center;gap:8px;margin-top:2px}
.flash-nav .btn{flex:1}
.flash-count{font-size:12px;color:var(--ink-3);text-align:center;margin-top:2px}
.flash-tools{display:flex;gap:7px;margin-top:10px}

/* ---------- word lists ---------- */
.word-list{display:flex;flex-direction:column}
.word-row{display:flex;align-items:center;gap:11px;padding:11px 2px;min-height:56px}
.word-row + .word-row{border-top:1px solid var(--surface-2)}
.word-main{flex:1;min-width:0}
.word-jp{font-size:17px;font-weight:600;letter-spacing:.3px}
.word-jp ruby rt{font-size:.42em}
.word-sub{font-size:11.5px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.word-ko{font-size:13px;color:var(--ink-2);flex:none;max-width:42%;text-align:right}

/* ---------- grammar ---------- */
.gram-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.gram-card > summary{
  list-style:none;display:flex;align-items:center;gap:10px;padding:14px;min-height:56px;cursor:pointer;
}
.gram-card > summary::-webkit-details-marker{display:none}
.gram-card > summary::after{content:"›";margin-left:auto;color:var(--ink-3);font-size:20px;transform:rotate(90deg);transition:.2s}
.gram-card[open] > summary::after{transform:rotate(-90deg)}
.gram-key{
  width:38px;height:38px;border-radius:11px;background:var(--primary-soft);color:var(--primary);
  display:grid;place-items:center;font-size:15px;font-weight:700;flex:none;
}
.gram-t{flex:1;min-width:0}
.gram-t b{display:block;font-size:13.5px;font-weight:700}
.gram-t span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.gram-body{padding:0 14px 14px}
.gram-body p{font-size:12.5px;color:var(--ink-2);margin-bottom:10px;line-height:1.6}
.ex{background:var(--surface-2);border:1px solid #EEF0F2;border-radius:11px;padding:11px 12px;margin-top:8px}
.ex-jp{font-size:16px;font-weight:600;line-height:1.5;letter-spacing:.3px}
.ex-jp ruby rt{font-size:.44em}
.ex-kana{font-size:11.5px;color:var(--primary);margin-top:2px}
.ex-ko{font-size:12px;color:var(--ink-2);margin-top:3px}
.ex-romaji{font-size:11px;color:var(--ink-3);margin-top:2px;letter-spacing:.2px}
.ex-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini-btn{
  min-height:32px;padding:0 10px;border-radius:9px;font-size:11.5px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;
}
.mini-btn:active{background:var(--primary-soft)}
.mini-btn.on{color:var(--gold);border-color:#FDE68A;background:#FFFBEB}

/* ---------- stats ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 13px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:21px;font-weight:800;letter-spacing:-.5px}
.stat span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.empty{text-align:center;color:var(--ink-3);font-size:12.5px;padding:22px 10px;line-height:1.7}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:100%;max-width:480px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line);
}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:50px;border-radius:11px;color:var(--ink-3);font-size:10.5px;font-weight:600;letter-spacing:.1px}
.tab svg{width:21px;height:21px;stroke-width:1.7}
.tab.active{color:var(--primary);background:var(--primary-soft)}
.tab:active{background:var(--surface-2)}

/* ---------- sheet / quiz ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(24,30,38,.42);animation:fade .18s ease}
.sheet-panel{
  position:relative;width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow-y:auto;
  background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .26s cubic-bezier(.2,.8,.2,1);
}
@keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
.sheet-grip{width:38px;height:4px;border-radius:99px;background:#D5D8DD;margin:0 auto 12px}
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.quiz-head b{font-size:13px;font-weight:700}
.quiz-head span{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.q-progress{height:6px;border-radius:99px;background:#E5E7EB;overflow:hidden;margin-bottom:16px}
.q-progress > i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s ease}
.q-body{text-align:center;padding:6px 0 4px}
.q-main{font-size:44px;font-weight:600;line-height:1.25;letter-spacing:1px}
.q-main.kr{font-size:20px;letter-spacing:0;line-height:1.45}
.q-main.small{font-size:26px;letter-spacing:0}
.q-sub{font-size:12.5px;color:var(--ink-3);margin-top:7px}
.q-options{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.q-opt{
  min-height:52px;padding:10px 14px;border-radius:13px;background:var(--surface);border:1.4px solid var(--line);
  font-size:15px;font-weight:600;text-align:left;display:flex;align-items:center;gap:9px;transition:.15s;
}
.q-opt .num{
  width:22px;height:22px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:11px;color:var(--ink-3);flex:none;font-weight:700;
}
.q-opt.ja{font-size:17px;font-weight:600}
.q-opt.ok{border-color:var(--ok);background:#EDF6F1;color:#1F6347}
.q-opt.ok .num{background:var(--ok);color:#fff;border-color:var(--ok)}
.q-opt.bad{border-color:#FCA5A5;background:#FEF3F2;color:#991B1B}
.q-opt.bad .num{background:var(--bad);color:#fff;border-color:var(--bad)}
.q-opt:disabled{opacity:1}
.q-opt.faded{opacity:.55}
.q-feedback{margin-top:14px;font-size:12.5px;line-height:1.6;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.q-feedback b{color:var(--ink)}
.q-feedback.ok{border-color:#CBE3D7;background:#F1F8F4}
.q-feedback.bad{border-color:#FECACA;background:#FEF3F2}
.q-foot{margin-top:14px;display:flex;gap:8px}
.q-foot .btn{flex:1}
.q-score{text-align:center;padding:8px 0 4px}
.q-score .big{font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1.1}
.q-score .big small{font-size:16px;color:var(--ink-3);font-weight:700;letter-spacing:0}
.q-score p{font-size:13px;color:var(--ink-2);margin-top:6px}
.q-score .emoji{font-size:34px;display:block;margin-bottom:6px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:rgba(31,39,51,.94);color:#fff;font-size:12.5px;padding:10px 16px;border-radius:99px;z-index:90;
  opacity:0;pointer-events:none;transition:.22s;max-width:88%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot-note{text-align:center;font-size:11px;color:var(--ink-3);padding:6px 10px 10px;line-height:1.6}

/* ---------- 한 줄 일기 ---------- */
.diary-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.diary-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.diary-meta .badge{font-size:11px}
.diary-text{font-size:18px;font-weight:600;line-height:1.6;letter-spacing:.3px;white-space:pre-wrap;word-break:break-word}
.diary-ko{font-size:12.5px;color:var(--ink-2);margin-top:6px;white-space:pre-wrap}
.diary-empty{font-size:13px;color:var(--ink-2);line-height:1.75}
.diary-ex{font-size:12.5px;color:var(--ink-3);margin-top:9px;line-height:1.6}
.diary-ex b{color:var(--primary);font-weight:600}
.diary-note{font-size:14px;font-weight:500;line-height:1.75;letter-spacing:.2px;white-space:pre-wrap;word-break:break-word}
.diary-actions{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.sheet-date{font-size:12px;color:var(--ink-3);margin:2px 0 4px;line-height:1.6}
.field-label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin:14px 0 6px;letter-spacing:.1px}
.field-label span{font-weight:500;color:var(--ink-3);margin-left:4px}
input[type="date"].field{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font-family:inherit;font-size:14px}
textarea.field{width:100%;min-height:104px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px;font-family:inherit;font-size:15px;line-height:1.7;resize:vertical}
textarea.field:focus,input[type="date"].field:focus{outline:2px solid #FECACA;outline-offset:1px;border-color:#FECACA}
.picker{display:flex;gap:7px;flex-wrap:wrap}
.pick{width:46px;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-size:20px;display:grid;place-items:center;line-height:1}
.pick.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1.5px var(--primary) inset}
.tpl-wrap{display:flex;flex-wrap:wrap;gap:6px}
.tpl{min-height:38px;padding:6px 11px;border-radius:11px;background:var(--primary-soft);border:1px solid #FECACA;color:#991B1B;font-size:12.5px;font-weight:600;text-align:left;line-height:1.35}
.tpl small{display:block;font-size:10.5px;font-weight:500;color:var(--ink-3);margin-top:1px}
.tpl:active{background:#FEE2E2}
/* ---------- 데일리 루틴 (노션 🍰 HABBIT TRACKER) ---------- */
input[type="text"].field{width:100%;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 11px;font-family:inherit;font-size:13.5px;color:var(--ink)}
input[type="text"].field:focus{outline:2px solid #FECACA;outline-offset:1px;border-color:#FECACA}
.wk-nav{display:flex;gap:5px;align-items:center}
.wk-nav button{min-height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;font-weight:700;color:var(--ink-2);display:grid;place-items:center;white-space:nowrap}
.wk-nav button:active{background:var(--primary-soft)}
.wk-row{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wk-cell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.wk-cell .wk-d{font-size:10px;color:var(--ink-3);font-weight:600}
.wk-cell .wk-n{font-size:13.5px;font-weight:700;letter-spacing:-.3px}
.wk-cell .wk-bar{width:70%;height:3px;border-radius:99px;background:#E5E7EB;overflow:hidden}
.wk-cell .wk-bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.wk-cell.dim .wk-n{color:var(--ink-3);font-weight:600}
.wk-cell.today .wk-d{color:var(--accent)}
.wk-cell.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1.5px var(--primary) inset}
.wk-cell.sel .wk-n{color:var(--primary)}
.rhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.rhead .rd{font-size:15px;font-weight:800;letter-spacing:-.2px}
.rhead .rs{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.rrate{font-size:24px;font-weight:800;letter-spacing:-1px;color:var(--primary);line-height:1.05;text-align:right}
.rrate small{display:block;font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:0;margin-top:2px}
.rdaynav{display:flex;align-items:center;gap:6px;margin-top:12px}
.rdaynav button{height:34px;min-width:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;font-weight:700;color:var(--ink-2);display:grid;place-items:center}
.rdaynav .sp{flex:1}
.rt-list{display:flex;flex-direction:column}
.rt-row + .rt-row{border-top:1px solid var(--surface-2)}
.rt-hit{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 2px;min-height:52px}
.rt-box{width:26px;height:26px;border-radius:8px;border:1.8px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:#fff;font-size:14px;flex:none;transition:.16s}
.rt-hit.done .rt-box{background:var(--primary);border-color:var(--primary)}
.rt-hit.done .rt-t{color:var(--ink-3);text-decoration:line-through}
.rt-t{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.4}
.rt-t small{display:block;font-size:10.5px;font-weight:500;color:var(--ink-3);text-decoration:none;margin-top:1px}
.rt-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mood{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 3px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);transition:.14s}
.mood .me{font-size:21px;line-height:1.15}
.mood .ml{font-size:10.5px;color:var(--ink-3);font-weight:600}
.mood.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1.5px var(--primary) inset}
.mood.on .ml{color:var(--primary);font-weight:700}
.memo-state{font-size:11px;color:var(--ink-3);margin-top:7px;min-height:15px}
.edit-row{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.edit-row input[type="text"]{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-family:inherit;font-size:13.5px;color:var(--ink)}
.edit-row .ord{display:flex;flex-direction:column;gap:2px;flex:none}
.edit-row .ord button{width:26px;height:18px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);font-size:9px;line-height:1;color:var(--ink-2);display:grid;place-items:center}
.edit-row .ord button:disabled{opacity:.35}
.edit-row .mini-btn{flex:none}
/* ---------- 스터디 메이트 (爆豪勝己) ---------- */
.buddy{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;overflow:hidden;position:relative}
.buddy::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#DC2626,#D9A441)}
.buddy-img{width:100px;flex:none;border-radius:12px;object-fit:cover;object-position:50% 10%;background:#ECEEF1;align-self:stretch;min-height:132px}
.buddy-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-left:4px}
.buddy-name{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.1px;margin-bottom:2px}
.buddy-name span{display:block;font-size:10px;color:var(--ink-3);font-weight:600;margin-top:1px}
.buddy-jp{font-size:14.5px;font-weight:700;line-height:1.45;letter-spacing:.1px}
.buddy-read{font-size:11px;color:var(--primary);line-height:1.45;margin-top:1px}
.buddy-ko{font-size:12px;color:var(--ink-2);font-weight:600;line-height:1.45}
.buddy-actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.buddy.compact{padding:10px 11px;gap:10px;align-items:center}
.buddy.compact .buddy-img{width:48px;height:48px;border-radius:50%;object-position:50% 22%;align-self:auto}
.buddy.compact .buddy-name span{display:inline;margin:0 0 0 3px;font-size:10px}
.buddy.compact .buddy-jp{font-size:13px}
.buddy.compact .buddy-actions{margin-top:4px}
.buddy.compact .buddy-ko{font-size:11.5px}

/* ---------- 냉장고 ---------- */
.fr-stats{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 11px}
.fr-stat{font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:5px 9px}
.fr-stat b{color:var(--primary);margin-left:2px}
.fr-stat.warn{background:#FEF3F2;border-color:#FECACA;color:var(--bad)}
.fr-stat.warn b{color:var(--bad)}
.fr-row{display:flex;align-items:flex-start;gap:10px;padding:11px 2px;border-top:1px solid var(--surface-2)}
.fr-row:first-child{border-top:0}
.fr-check{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--line);background:var(--surface-2);color:#fff;font-size:13px;flex:none;display:grid;place-items:center;margin-top:1px}
.fr-row.out .fr-check{background:var(--ink-3);border-color:var(--ink-3)}
.fr-main{flex:1;min-width:0}
.fr-name{font-size:14px;font-weight:700;line-height:1.4}
.fr-name em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--primary);margin-left:5px}
.fr-row.out .fr-name{color:var(--ink-3);text-decoration:line-through}
.fr-meta{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.fr-badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.fr-badge.soon{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
.fr-badge.over{background:#FEF3F2;border-color:#FECACA;color:var(--bad)}
.fr-memo{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.fr-edit{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);flex:none;display:grid;place-items:center;font-size:14px}
.fr-voca{display:flex;flex-wrap:wrap;gap:6px}
.fr-chip{min-height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:baseline;gap:5px}
.fr-chip b{font-weight:700;color:var(--ink);font-size:13px}
.fr-chip small{font-size:10px;color:var(--ink-3)}
.fr-guide{font-size:12.5px;color:var(--ink-2);line-height:1.75}
.fr-guide b{color:var(--primary)}

/* ---------- 오늘의 5~10분 운동 ---------- */
.wo-card{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--surface-2);margin-top:11px}
.wo-card.done{border-color:#CBE3D7;background:#F1F8F4}
.wo-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;color:#B91C1C;background:var(--accent-soft);border:1px solid #FECACA;border-radius:99px;padding:3px 8px}
.wo-title{font-size:14.5px;font-weight:700;line-height:1.4;margin-top:8px}
.wo-sub{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.wo-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;align-items:center}
.wo-actions .btn{flex:1;min-width:130px}
.wo-done{font-size:11.5px;font-weight:700;color:var(--ok)}
.wo-mini{display:flex;align-items:center;gap:10px}
.wo-mini .wo-main{flex:1;min-width:0}
.wo-mini .wo-k{font-size:10.5px;font-weight:800;color:var(--accent);letter-spacing:.1px}
.wo-mini .wo-t{font-size:13px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-mini .wo-s{font-size:11px;color:var(--ink-3);margin-top:1px}

/* ---------- 식단 기록 ---------- */
.dsub{margin-bottom:10px}
.dgo{display:flex;flex-direction:column;gap:12px}
.dgo-row{display:flex;flex-direction:column;gap:5px}
.dgo-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dgo-k{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.dgo-v{font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.2px}
.dgo-v small{font-size:10.5px;font-weight:600;color:var(--ink-3);margin-left:4px;letter-spacing:0}
.dgo-bar{position:relative;height:9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.dgo-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--primary),#F87171);border-radius:99px;transition:width .3s ease}
.dgo-fill.over{background:linear-gradient(90deg,#F59E0B,#B45309)}
.dgo-zone{position:absolute;top:0;bottom:0;background:rgba(220,38,38,.12);border-left:1.5px dashed rgba(220,38,38,.45);border-right:1.5px dashed rgba(220,38,38,.45)}
.dgo-state{font-size:10.5px;font-weight:700;color:var(--ink-3)}
.dgo-state.ok{color:var(--ok)}
.dgo-state.over{color:var(--bad)}
.dgo-state.short{color:var(--warn)}
.dwater{display:flex;align-items:center;gap:7px}
.dwater .dw-v{font-size:20px;font-weight:800;letter-spacing:-.6px}
.dwater .dw-v small{font-size:11px;font-weight:600;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.dwater .sp{flex:1}
.dwater .btn{min-width:62px}
.dmeal + .dmeal{margin-top:12px;padding-top:12px;border-top:1px solid var(--surface-2)}
.dmeal-head{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.dmeal-head .dmh-t{font-size:13px;font-weight:800}
.dmeal-head .dmh-k{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.dmeal-head .sp{flex:1}
.dmeal-head .dmh-add{min-height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:11.5px;font-weight:700;color:var(--primary);flex:none}
.dm-row{display:flex;align-items:flex-start;gap:6px;padding:8px 0;border-top:1px solid var(--surface-2)}
.dm-main{flex:1;min-width:0}
.dm-name{font-size:13px;font-weight:600;line-height:1.4}
.dm-est{font-size:9.5px;font-weight:800;color:#92400E;background:#FFFBEB;border:1px solid #FDE68A;border-radius:99px;padding:1px 6px;margin-left:5px;vertical-align:1px;white-space:nowrap}
.dm-meta{font-size:11px;color:var(--ink-3);margin-top:2px}
.dm-btn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-3);font-size:12px;flex:none;display:grid;place-items:center}
.dm-btn:active{background:var(--primary-soft)}
.dm-empty{font-size:12px;color:var(--ink-3);padding:7px 0}
.dmac{display:flex;gap:6px}
.dmac .field{flex:1;min-width:0;text-align:center;padding:0 6px}
.dcheck{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);margin-top:12px}
.dcheck input{width:18px;height:18px;accent-color:var(--primary)}
.diet-mini{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;cursor:pointer}
.diet-mini .dmin-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.diet-mini .dmin-t{font-size:13px;font-weight:700}
.diet-mini .dmin-v{font-size:15px;font-weight:800;color:var(--primary);letter-spacing:-.3px}
.diet-mini .dmin-bar{height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.diet-mini .dmin-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#F87171);border-radius:99px}
.diet-mini .dmin-bar i.over{background:linear-gradient(90deg,#F59E0B,#B45309)}
.diet-mini .dmin-s{font-size:11.5px;color:var(--ink-3);line-height:1.5}

/* ---------- 홈: 하루치 대시보드 ---------- */
.hm-wrap{display:flex;flex-direction:column;gap:7px}
.view-inner.hm-view{padding:10px 16px 4px}
.hm-card{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:10px 11px}
.hm-h{display:flex;align-items:center;gap:6px;min-height:16px}
.hm-h .t{flex:1;min-width:0;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
.hm-h .v{flex:none;font-size:11.5px;font-weight:800;color:var(--primary);letter-spacing:-.2px;white-space:nowrap}
.hm-h .v small{font-size:10px;font-weight:700;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.hm-h .link{flex:none;font-size:10.5px;font-weight:700;color:var(--ink-3);padding:3px 0 3px 4px;white-space:nowrap}
.hm-h .link:active{color:var(--primary)}
/* 스터디 메이트: 루틴 탭과 같은 큰 세로 포토 프레임 */
.buddy.hm-buddy-card{padding:10px 11px}
.buddy.hm-buddy-card .buddy-jp{font-size:12.5px;line-height:1.5;text-wrap:balance}
.hm-bd-date{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--ink-3);line-height:1.3;margin-bottom:1px}
.hm-bd-date .hm-fire{color:var(--accent);font-weight:800}
.hm-bd-date b{font-weight:700;color:var(--ink-2);font-size:10.5px}
.hm-bd-tools{display:flex;align-items:center;gap:4px;margin-left:auto}
.hm-bd-btn{font-size:9.5px;font-weight:700;color:var(--ink-2);border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:2px 7px;line-height:1.25;white-space:nowrap}
.hm-bd-btn:active{background:var(--primary-soft)}
/* 루틴 요약 */
.hm-rt{display:flex;align-items:center;gap:8px;margin-top:6px}
.hm-rt b{font-size:14px;font-weight:800;letter-spacing:-.3px;color:var(--primary);white-space:nowrap}
.hm-rt b small{font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:0}
.hm-bar{flex:1;height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.hm-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),#F87171);transition:width .3s ease}
.hm-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}
.hm-chip{display:flex;align-items:center;gap:3px;min-width:0;min-height:27px;padding:0 7px;border-radius:9px;
  border:1px solid var(--line);background:var(--surface-2);font-size:10.5px;font-weight:700;color:var(--ink-2);text-align:left;letter-spacing:-.2px}
.hm-chip .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-chip.on{border-color:#FECACA;background:var(--primary-soft);color:var(--primary)}
.hm-chip.on::before{content:"✓";flex:none;font-size:9.5px;font-weight:800}
.hm-chip:active{transform:scale(.97)}
/* 식단 · 수분 */
.hm-gauges{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.hm-g-t{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--ink-3);line-height:1.3}
.hm-g .hm-track{flex:1;min-width:0;margin-top:0}
.hm-g-t b{flex:none;font-size:11.5px;font-weight:800;color:var(--ink);letter-spacing:-.2px;white-space:nowrap}
.hm-g-t b small{font-size:10px;font-weight:700;color:var(--ink-3);margin-left:2px;letter-spacing:0}
.hm-track{position:relative;height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:3px}
.hm-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),#F87171)}
.hm-track i.over{background:linear-gradient(90deg,#F59E0B,#B45309)}
.hm-zone{position:absolute;top:0;bottom:0;background:rgba(220,38,38,.1);border-left:1px solid rgba(220,38,38,.28);border-right:1px solid rgba(220,38,38,.28)}

.hm-water small{font-size:10.5px;color:var(--ink-3);font-weight:700}
.hm-water .sp{flex:1}
.hm-water .btn{min-height:28px;padding:0 9px;font-size:11px;border-radius:9px}
/* 운동 */
.hm-wo-t{font-size:12.5px;font-weight:700;line-height:1.35;margin-top:5px}
.hm-wo-row{display:flex;align-items:center;gap:5px;margin-top:5px}
.hm-wo-s{flex:1;min-width:0;font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-wo-row .btn{flex:none;min-height:30px;padding:0 9px;font-size:10.5px;border-radius:9px}
.hm-acts{display:flex;gap:6px;margin-top:7px}
.hm-acts .btn{flex:1;min-height:31px;font-size:10.5px;border-radius:9px;padding:0 8px}
/* 일본어 */
.hm-jp{display:flex;align-items:center;gap:6px;margin-top:7px}
.hm-jp .txt{flex:1;min-width:0;font-size:10.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-jp .btn{flex:none;min-height:30px;padding:0 9px;font-size:10.5px;border-radius:9px}
.hm-jp .st{font-weight:800;color:var(--accent);font-size:12.5px;letter-spacing:-.2px}
.hm-jp .sep{color:#D5D8DD}
.hm-jp .dy{font-weight:600}
.hm-jp .dy.on{color:var(--primary);font-weight:700}
/* 냉장고 */
.hm-fr{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.hm-fr span{font-size:10.5px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px 7px}
.hm-fr span b{color:var(--primary);font-weight:800;margin-left:1px}
.hm-fr span.warn{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
.hm-fr span.warn b{color:#92400E}
.hm-fr-line{display:flex;align-items:center;font-size:10px;color:var(--ink-2);margin-top:6px;line-height:1.45;min-width:0}
.hm-fr-line b{flex:none;font-weight:700;color:var(--ink)}
.hm-fr-line .hl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-fr-line.warn{color:#92400E;font-weight:700}

/* ---------- 2단 묶음: 접은 화면에서는 그대로 1열로 쌓임 ---------- */
.vcols{display:flex;flex-direction:column;gap:14px}
.vcols > .vcol{display:flex;flex-direction:column;gap:14px;min-width:0}

/* ---------- 펼친 화면(갤럭시 폴드 메인 · 태블릿): 가로 폭을 살린 2단 레이아웃 ---------- */
@media (min-width:600px){
  .app{max-width:840px}
  .topbar{padding:16px 22px 14px}
  .view-inner{padding:18px 22px 10px}
  .view-inner.hm-view{padding:14px 22px 6px}
  .tabbar{max-width:840px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  .tab{height:54px;font-size:11px;max-width:132px;width:100%;justify-self:center}
  .tab svg{width:22px;height:22px}
  .seg{width:100%;max-width:560px;margin-left:auto;margin-right:auto}

  /* 홈: 스터디 메이트는 전체 폭 배너, 나머지 카드는 2열 */
  .hm-wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .hm-wrap > .hm-buddy-card{grid-column:1 / -1}
  .hm-wrap > .hm-wide{grid-column:1 / -1}
  .buddy.hm-buddy-card{padding:14px 16px;gap:16px}
  .buddy.hm-buddy-card .buddy-img{width:184px;height:152px;min-height:0;align-self:center;border-radius:13px}
  .buddy.hm-buddy-card .buddy-name{font-size:12.5px}
  .buddy.hm-buddy-card .buddy-name span{font-size:10.5px;display:inline;margin-left:4px}
  .buddy.hm-buddy-card .buddy-jp{font-size:16px;line-height:1.5}
  .buddy.hm-buddy-card .buddy-ko{font-size:13px;line-height:1.5;margin-top:1px}
  .hm-bd-date{font-size:11.5px;margin-bottom:4px}
  .hm-bd-date b{font-size:11.5px}
  .hm-card{padding:13px 14px;border-radius:16px}

  /* 탭별 2단 구성 */
  .vcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;align-items:start}

  /* 카드 안쪽도 넓이에 맞춰 펼치기 */
  .stat-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .mood-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  .kana-grid{grid-template-columns:repeat(8,1fr)}
  .kana-grid.yoon{grid-template-columns:repeat(6,1fr)}
  .fr-2col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;align-items:start}
  .fr-2col .fr-row{border-top:0;padding:11px 0}
  .fr-2col .fr-row:nth-child(n+3){border-top:1px solid var(--surface-2)}
  .fr-voca{gap:7px}
  .dm-row{padding:9px 0}
  /* 혼자 가운데 놓이는 카드(단어 플래시카드·따라쓰기 패드)는 너무 넓어지지 않게 */
  .flash{max-width:560px;width:100%;margin-left:auto;margin-right:auto}
  .pad-wrap{max-width:560px;margin-left:auto;margin-right:auto}
  .chips{flex-wrap:wrap;overflow-x:visible}
  .btn-block{max-width:440px;margin-left:auto;margin-right:auto}
  .btn-row{max-width:560px;margin-left:auto;margin-right:auto}

  /* 바텀시트는 가운데 정렬 모달로 (너무 넓어지지 않게) */
  .sheet{align-items:center;padding:24px 16px}
  .sheet-panel{max-width:520px;border-radius:20px;padding-bottom:20px;max-height:min(86vh,760px);max-height:min(86dvh,760px)}
  .sheet-grip{display:none}
  .toast{max-width:420px}
}
/* 갤럭시 폴드 펼침(≈673px)처럼 2열이 아직 좁은 폭: 홈 루틴 칩은 2열로 */
@media (min-width:600px) and (max-width:719px){
  .hm-chips{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media (max-width:340px){
  /* 갤릭시 폴드 커버(≈280px)처럼 아주 좡은 화면: 날짜가 한 글자씩 쪼개지지 않게 */
  .hm-bd-date{flex-wrap:wrap;row-gap:3px}
  .hm-bd-date b{white-space:nowrap}
  .hm-bd-tools{margin-left:0}
}

@media (max-width:360px){
  .brand h1{font-size:15px}
  .kana-cell{height:56px}
  .flash-word{font-size:44px}
  .tab{font-size:9.5px}
  .tab svg{width:19px;height:19px}
  .rt-t{font-size:12.5px}
  .hm-chip{font-size:10px;padding:0 6px}
  .hm-chip .dot{width:13px;height:13px}
}
/* ---------- ⚖️ 체중·마운자로 ---------- */
.wt-top{display:flex;align-items:flex-end;gap:9px;flex-wrap:wrap}
.wt-kg{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1}

.wt-delta{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:#E9F7EF;color:#15803D}
.wt-delta.up{background:var(--accent-soft);color:var(--accent)}
.wt-sub{font-size:11.5px;color:var(--ink-3);margin-top:6px;line-height:1.55}
.wt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.wt-stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}

.wt-stat span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.wt-chart{width:100%;height:auto;display:block;margin-top:4px}
.wt-legend{display:flex;gap:10px;font-size:10.5px;color:var(--ink-3);margin-top:5px;flex-wrap:wrap}
.wt-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px}
.wt-tools{display:flex;gap:6px;flex:none}
.wt-dose{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.wt-dose span{font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.wt-dose span.hi{background:var(--primary-soft);border-color:#FECACA;color:var(--primary)}
.wt-row{display:flex;align-items:center;gap:7px;padding:8px 0;border-top:1px solid var(--surface-2);min-width:0}

.wt-row .d{font-size:11px;color:var(--ink-3);width:56px;flex:none;font-variant-numeric:tabular-nums}

.wt-row .bi{font-size:10px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wt-row .sp{flex:1}
.wt-row .mini-btn{flex:none;padding:0 9px;height:26px}
.hm-weight{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:9px;border-top:1px solid var(--surface-2);font-size:11.5px;color:var(--ink-2);flex-wrap:wrap;min-width:0}

.hm-weight .sp{flex:1}
.hm-menu{display:flex;align-items:flex-start;gap:8px;margin-top:9px;width:100%;text-align:left;padding:10px 11px;border-radius:12px;background:var(--primary-soft);border:1px solid #FECACA;color:var(--primary);font-size:14px;line-height:1.2}
.hm-menu span{min-width:0}
.hm-menu b{display:block;font-size:12.5px;letter-spacing:-.1px}

.menu-list{display:grid;gap:8px;margin-top:2px}

/* ---------- 🎯 N3 로드맵 ---------- */
.n3-dday{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);flex:none}
.n3-bar{display:block;height:5px;border-radius:99px;background:#E5E7EB;margin:7px 0 6px;overflow:hidden}
.n3-bar.wide{height:7px;margin:6px 0 2px}
.n3-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#F87171);border-radius:99px;transition:width .3s ease}
/* 한눈 요약 (지금 단계 · 기간 경과 · D-day) */
.n3-ov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:12px}
.n3-ov > div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 9px;min-width:0}
.n3-ov b{display:block;font-size:15px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n3-ov span{display:block;font-size:9.5px;color:var(--ink-3);margin-top:1px;line-height:1.3}
.n3-ov .cur b{color:var(--primary)}
/* 전체 일정 타임라인 */
.n3-tl{display:flex;flex-direction:column}
.n3-tl-item{display:grid;grid-template-columns:24px minmax(0,1fr);gap:9px;min-width:0}
.n3-tl-rail{display:flex;flex-direction:column;align-items:center;min-width:0}
.n3-tl-dot{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-3);font-size:10.5px;font-weight:800;display:grid;place-items:center;margin-top:10px;line-height:1}
.n3-tl-rail::after{content:"";flex:1;width:2px;background:var(--line);margin:4px 0 0;border-radius:2px}
.n3-tl-item:last-child .n3-tl-rail::after{display:none}
.n3-tl-item.now .n3-tl-dot{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-soft)}
.n3-tl-item.done .n3-tl-dot{background:var(--surface);border-color:var(--primary);color:var(--primary)}
.n3-tl-item.exam .n3-tl-dot{font-size:11px}
.n3-tl-body{border:1px solid var(--line);border-radius:13px;background:var(--surface-2);padding:9px 11px 10px;margin-bottom:9px;min-width:0}
.n3-tl-item.now .n3-tl-body{border-color:#FECACA;background:#FFF5F5}
.n3-tl-item.done .n3-tl-body{opacity:.92}
.n3-tl-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.n3-tl-no{font-size:9.5px;font-weight:700;color:#fff;background:var(--primary);border-radius:99px;padding:2px 7px;flex:none}
.n3-tl-item.done .n3-tl-no{background:var(--ink-3)}
.n3-tl-pd{font-size:10.5px;color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.n3-tl-badge{margin-left:auto;flex:none;font-size:9.5px;font-weight:700;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 7px}
.n3-tl-item.now .n3-tl-badge{color:var(--primary);border-color:#FECACA;background:#fff}
.n3-tl-item.done .n3-tl-badge{color:var(--ok);border-color:#BBF7D0;background:#F0FDF4}
.n3-tl-name{font-size:13px;font-weight:800;margin-top:5px;letter-spacing:-.2px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;line-height:1.35}
.n3-tl-dd{font-size:10.5px;font-weight:800;color:var(--accent);flex:none}
.n3-tl-books{font-size:11px;color:var(--ink-2);margin-top:3px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.n3-tl-bar{display:block;height:5px;border-radius:99px;background:#E5E7EB;margin-top:8px;overflow:hidden}
.n3-tl-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#F87171);border-radius:99px;transition:width .3s ease}
.n3-tl-item.done .n3-tl-bar i{background:var(--ok)}
.n3-tl-meta{display:flex;justify-content:space-between;gap:6px;font-size:9.5px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}
.n3-tl-day{font-size:10.5px;color:var(--ink-2);margin-top:6px;line-height:1.45;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
.n3-tl-foot{display:flex;justify-content:flex-end;margin-top:7px}
.n3-tl-foot .mini-btn{min-height:26px;font-size:10.5px;padding:0 9px}

.n3-wk.sel .n3-wk-c{color:var(--primary);font-weight:700}
.n3-dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin:14px 0 2px}
.n3-dhead b{display:block;font-size:13px;font-weight:800;letter-spacing:-.2px;line-height:1.4}
.n3-dhead span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.n3-dpct{font-size:17px;font-weight:800;letter-spacing:-.5px;flex:none;font-variant-numeric:tabular-nums;line-height:1.2}

.n3-dtasks{display:flex;flex-direction:column;margin-top:5px}
.n3-dt{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;padding:9px 2px;border-top:1px solid var(--surface-2);min-width:0}

.n3-dfoot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}

.n3-dst span{display:block;font-size:9.5px;color:var(--ink-3);margin-top:1px;line-height:1.3}
.n3-ed-l{display:block;font-size:11px;font-weight:700;color:var(--ink-2);margin:12px 0 5px}

/* ---------------- 기본 유틸 ---------------- */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isKanji = ch => /[\u4e00-\u9fff]/.test(ch);
const pad2 = n => String(n).padStart(2, '0');
const rand = n => Math.floor(Math.random() * n);
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function dkey(d) { const x = d || new Date(); return x.getFullYear() + '-' + pad2(x.getMonth() + 1) + '-' + pad2(x.getDate()); }
function dayIndex() { const now = new Date(); const start = new Date(now.getFullYear(), 0, 0); return Math.floor((now - start) / 86400000); }
function koreanDate(d) { const x = d || new Date(); return (x.getMonth() + 1) + '월 ' + x.getDate() + '일'; }

/* 후리가나: 한자 부분에만 읽기를 붙이고 꼬리 가나는 그대로 둔다 */
function rubyHTML(jp, kana, show) {
  const base = String(jp || ''), rd = String(kana || '');
  if (!show || !rd || base === rd) return esc(base);
  let i = base.length - 1, j = rd.length - 1;
  while (i >= 0 && j >= 0 && base[i] === rd[j] && !isKanji(base[i])) { i--; j--; }
  const kanjiPart = base.slice(0, i + 1);
  const tail = base.slice(i + 1);
  const ruby = rd.slice(0, j + 1);
  if (!kanjiPart) return esc(base);
  return '<ruby>' + esc(kanjiPart) + '<rt>' + esc(ruby) + '</rt></ruby>' + esc(tail);
}

const KEY = 'seon-japanese-v1';
function defaultState() {
  return {
    v: 1,

    star: { kana: [], word: [], sent: [] },
    wrong: { kana: {}, word: {}, sent: {}, jlpt: {} },

function normalizeState(raw) {

    v: 1,

    weight: normalizeWeight(p.weight),
    n3: normalizeN3(p.n3),
    streak: Number(p.streak) || 0
  };
  ['kana', 'word', 'sent'].forEach(k => { if (!Array.isArray(s.star[k])) s.star[k] = []; });
  ['kana', 'word', 'sent', 'jlpt'].forEach(k => {
    let w = s.wrong[k];
    if (Array.isArray(w)) { const o = {}; w.forEach(id => { o[id] = { n: 1, t: Date.now() }; }); w = o; }
    if (!w || typeof w !== 'object') w = {};

  if (!(Number(s.settings.rate) > 0)) s.settings.rate = 0.75;
  return s;

/* 루틴 기록은 예전 백업 파일에 없을 수 있으므로 항상 기본값으로 메꿔 둡니다. */
function normalizeRoutine(raw) {
  const r = raw && typeof raw === 'object' ? raw : {};
  let items = Array.isArray(r.items) ? r.items.filter(function (it) { return it && it.id; }).map(function (it) {
    return { id: String(it.id), label: String(it.label || '항목').slice(0, 40), icon: String(it.icon || '•') };
  }) : routineDefaultItems();
  const days = {};
  if (r.days && typeof r.days === 'object') {
    Object.keys(r.days).forEach(function (k) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      const d = r.days[k] || {};
      const day = {
        checks: (d.checks && typeof d.checks === 'object') ? d.checks : {},
        mood: typeof d.mood === 'string' ? d.mood : '',
        memo: typeof d.memo === 'string' ? d.memo : ''
      };
      if (d.workout && d.workout.id) day.workout = { id: String(d.workout.id), at: Number(d.workout.at) || 0 };
      if (d.woPick) day.woPick = String(d.woPick);

/* 냉장고 재료: 백업·예전 저장본에 없으면 빈 목록 */
/* 1회분 영양성분(추천 계산용). 없는 재료는 이름으로 짐작합니다. */
function normalizeFridgeNutri(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const n = {};
  ['kcal', 'carb', 'protein', 'fat'].forEach(function (k) {
    const v = Number(raw[k]);
    if (isFinite(v) && v >= 0) n[k] = Math.round(v * 100) / 100;
  });
  if (n.kcal === undefined) return null;
  if (typeof raw.label === 'string' && raw.label) n.label = raw.label.slice(0, 30);
  if (typeof raw.serving === 'string' && raw.serving) n.serving = raw.serving.slice(0, 20);
  if (typeof raw.unit === 'string' && raw.unit) n.unit = raw.unit.slice(0, 6);
  if (raw.est) n.est = true;
  return n;
}
function normalizeFridge(raw) {
  const f = raw && typeof raw === 'object' ? raw : {};
  const items = Array.isArray(f.items) ? f.items.filter(function (it) { return it && it.name; }).map(function (it) {
    const place = normFridgePlace(it.place);
    return {
      id: String(it.id || ('x-' + Math.random().toString(36).slice(2, 8))),
      name: String(it.name).slice(0, 40),
      jp: String(it.jp || '').slice(0, 40),
      kana: String(it.kana || '').slice(0, 60),
      place: place,
      qty: String(it.qty || '').slice(0, 24),
      expires: /^\d{4}-\d{2}-\d{2}$/.test(String(it.expires || '')) ? it.expires : '',
      memo: String(it.memo || '').slice(0, 120),
      nutri: normalizeFridgeNutri(it.nutri),
      out: !!it.out,
      src: it.src === 'seed' ? 'seed' : 'user',
      edited: !!it.edited
    };
  }) : [];
  return { items: items, seedVersion: Number(f.seedVersion) || 0, syncedAt: typeof f.syncedAt === 'string' ? f.syncedAt : '' };
}
function normalizeN3(raw) {
  const r = raw && typeof raw === 'object' ? raw : {};
  const out = { checks: {}, days: {}, stageDone: {}, labels: {} };
  /* 예전 단계별 체크(18항목) — 화면에서는 쓰지 않고 그대로 보관만 합니다. */
  if (r.checks && typeof r.checks === 'object') {
    Object.keys(r.checks).forEach(function (k) { if (r.checks[k]) out.checks[String(k).slice(0, 40)] = true; });
  }
  /* 날짜별 매일 공부량 체크 */
  if (r.days && typeof r.days === 'object') {
    Object.keys(r.days).forEach(function (k) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      const d = r.days[k];
      if (!d || typeof d !== 'object') return;
      const tasks = {};
      if (d.tasks && typeof d.tasks === 'object') {
        Object.keys(d.tasks).forEach(function (t) {
          if (d.tasks[t] && /^[a-z]{1,8}$/.test(t)) tasks[t] = true;
        });
      }
      out.days[k] = { tasks: tasks };
    });
  }
  /* 단계 완료 표시 */
  if (r.stageDone && typeof r.stageDone === 'object') {
    Object.keys(r.stageDone).forEach(function (k) {
      if (r.stageDone[k] && /^s[1-4]$/.test(k)) out.stageDone[k] = true;
    });
  }
  /* 날짜별 계획 문구 수정 */
  if (r.labels && typeof r.labels === 'object') {
    Object.keys(r.labels).forEach(function (k) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      const lab = r.labels[k];
      if (!lab || typeof lab !== 'object') return;
      const m = {};
      Object.keys(lab).forEach(function (key) {
        const v = String(lab[key] == null ? '' : lab[key]).trim().slice(0, 60);
        if (v && /^[a-z]{1,8}$/.test(key)) m[key] = v;
      });
      if (Object.keys(m).length) out.labels[k] = m;
    });
  }
  return out;
}

function updateStreak() {

  if (!S.days[dkey(d)]) d.setDate(d.getDate() - 1);
  let guard = 0;
  while (S.days[dkey(d)] && guard++ < 3650) { n++; d.setDate(d.getDate() - 1); }
  S.streak = n;
}

let jaVoice = null;
const speechOK = (typeof window !== 'undefined') && ('speechSynthesis' in window) && typeof SpeechSynthesisUtterance !== 'undefined';
function loadVoices() {
  if (!speechOK) return;
  try {
    const vs = speechSynthesis.getVoices() || [];
    jaVoice = vs.find(v => /ja[-_]JP/i.test(v.lang || '')) || vs.find(v => String(v.lang || '').toLowerCase().indexOf('ja') === 0) || null;
  } catch (e) { jaVoice = null; }
}

  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, rate) {
  if (!speechOK || !text) { toast('이 브라우저에서는 음성을 재생할 수 없어요'); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'ja-JP';
    if (jaVoice) u.voice = jaVoice;
    u.rate = rate || Number(S.settings.rate) || 0.9;
    u.pitch = 1;
    speechSynthesis.speak(u);
  } catch (e) { toast('음성을 재생하지 못했어요'); }
}

    { list: KANA_DAKU, script: 'kata', name: '탁음' },
    { list: KANA_YOON, script: 'hira', name: '요음' },
    { list: KANA_YOON, script: 'kata', name: '요음' }
  ];
}
function allKana(script) {
  const out = [];
  [KANA_SEION, KANA_DAKU, KANA_YOON].forEach(list => {
    list.forEach(row => {
      const ch = script === 'kata' ? row[1] : row[0];
      out.push({ ch: ch, r: row[2] });
    });
  });
  return out;
}
function kanaInfo(ch) {
  const sets = [KANA_SEION, KANA_DAKU, KANA_YOON];
  for (let s = 0; s < sets.length; s++) {
    for (let i = 0; i < sets[s].length; i++) {
      const row = sets[s][i];
      if (row[1] === ch) return { ch: ch, h: row[0], k: row[1], r: row[2] };
      if (row[0] === ch) return { ch: ch, h: row[0], k: row[1], r: row[2] };
    }
  }
  return null;
}
function isKata(ch) { return /[\u30a0-\u30ff]/.test(ch); }

/* ---------------- 문제 생성: 가나 ---------------- */
function buildKanaQuestions(n) {
  const out = [];
  const used = {};
  let guard = 0;
  while (out.length < n && guard++ < 300) {
    const script = Math.random() < 0.72 ? 'hira' : 'kata';
    const groups = CONFUSABLE[script] || CONFUSABLE.hira;
    const raw = groups[rand(groups.length)] || groups[0];
    const grp = raw.filter((c, i, a) => a.indexOf(c) === i && kanaInfo(c));
    if (!grp.length) continue;
    const ch = grp[rand(grp.length)];
    const info = kanaInfo(ch);
    if (!info) continue;
    const sig = script + '|' + ch;
    if (used[sig]) continue;
    used[sig] = 1;

    const dir = Math.random() < 0.5 ? 'read' : 'pick';
    let main, mainHTML, promptClass, options, answer, sub, explain, optClass = '';
    const others = shuffle(allKana(script).filter(c => c.r !== info.r)).slice(0, 6);
    if (dir === 'read') {
      mainHTML = esc(ch);
      promptClass = '';
      sub = '이 가나의 발음(로마자)은?';
      const opts = [info.r];
      others.forEach(c => { if (opts.length < 4 && opts.indexOf(c.r) < 0) opts.push(c.r); });
      while (opts.length < 4) opts.push(['a', 'i', 'u', 'e', 'o', 'ka'][opts.length]);
      options = shuffle(opts);
      answer = options.indexOf(info.r);
      explain = '<b>' + esc(ch) + '</b>는 <b>' + esc(info.r) + '</b>로 읽어요. 비슷한 글자: ' + grp.filter(c => c !== ch).map(esc).join(' ');
    } else {
      main = info.r;
      mainHTML = esc(info.r);
      promptClass = 'small';
      sub = '이 발음의 가나를 고르세요';
      const opts = [ch];
      grp.filter(c => c !== ch).forEach(c => { if (opts.length < 3) opts.push(c); });
      others.forEach(c => { if (opts.length < 4 && opts.indexOf(c.ch) < 0) opts.push(c.ch); });
      options = shuffle(opts.slice(0, 4));
      answer = options.indexOf(ch);
      explain = '<b>' + esc(info.r) + '</b>는 <b>' + esc(ch) + '</b>. 헷갈릴 때는 획의 방향을 확인하세요.';
      optClass = 'ja';
    }
    out.push({
      type: 'kana', id: ch, main: main || ch, mainHTML: mainHTML, promptClass: promptClass,
      sub: sub, speak: ch, options: options, answer: Math.max(0, answer),
      explain: explain, optClass: optClass
    });
  }
  return out;
}

/* ---------------- 문제 생성: 단어 ---------------- */
function buildWordQuestions(list, count, mode) {
  const pool = (list && list.length ? list : WORDS).slice();
  const picked = shuffle(pool).slice(0, Math.min(count || 10, pool.length));
  return picked.map(w => {
    let m = mode === 'mix' || !mode ? (Math.random() < 0.5 ? 'meaning' : 'reading') : mode;
    if (m === 'reading' && w.jp === w.kana) m = 'meaning';
    if (m === 'reading') {
      const opts = [w.kana];
      shuffle(WORDS.filter(x => x.id !== w.id && x.kana !== w.kana)).forEach(x => {
        if (opts.length < 4 && opts.indexOf(x.kana) < 0) opts.push(x.kana);
      });
      const options = shuffle(opts);
      return {
        type: 'word', id: w.id, main: w.jp,
        mainHTML: esc(w.jp), sub: '읽기(후리가나)를 고르세요',
        speak: w.kana, options: options, answer: options.indexOf(w.kana),
        explain: '<b>' + esc(w.jp) + '</b> = ' + esc(w.kana) + ' (' + esc(w.romaji) + ') · ' + esc(w.ko),
        optClass: 'ja'
      };
    }
    const opts = [w.ko];
    shuffle(WORDS.filter(x => x.id !== w.id && x.ko !== w.ko)).forEach(x => {
      if (opts.length < 4 && opts.indexOf(x.ko) < 0) opts.push(x.ko);
    });
    const options = shuffle(opts);
    return {
      type: 'word', id: w.id, main: w.jp,
      mainHTML: rubyHTML(w.jp, w.kana, S.settings.furigana), sub: '뜻을 고르세요',
      speak: w.kana, options: options, answer: options.indexOf(w.ko),
      explain: '<b>' + esc(w.jp) + '</b> = ' + esc(w.kana) + ' · ' + esc(w.ko)
    };
  });
}

/* ---------------- 문제 생성: 회화 ---------------- */
function buildSentQuestions(list, count) {
  const pool = (list && list.length ? list : SENTENCES).slice();
  const picked = shuffle(pool).slice(0, Math.min(count || 10, pool.length));
  return picked.map(s => {
    const opts = [s.jp];
    shuffle(SENTENCES.filter(x => x.id !== s.id)).forEach(x => {
      if (opts.length < 4 && opts.indexOf(x.jp) < 0) opts.push(x.jp);
    });
    const options = shuffle(opts);
    return {
      type: 'sent', id: s.id, main: s.ko, mainHTML: esc(s.ko), promptClass: 'kr',
      sub: '이 뜻에 맞는 일본어 문장은?', speak: s.kana,
      options: options.map(esc), answer: options.indexOf(s.jp),
      explain: '<b>' + esc(s.jp) + '</b><br>' + esc(s.kana) + ' · ' + esc(s.ko),
      optClass: 'ja'
    };
  });
}

/* ---------------- 문제 생성: JLPT ---------------- */
function buildJlptQuestions(kind, count) {
  let pool = JLPT.slice();
  if (kind && kind !== 'all') pool = pool.filter(q => q.kind === kind);
  const picked = shuffle(pool).slice(0, Math.min(count || pool.length, pool.length));
  return picked.map(q => {
    const paired = q.options.map((o, i) => ({ o: o, ok: i === q.answer }));
    const sh = shuffle(paired);
    const options = sh.map(p => esc(p.o));
    const answer = sh.findIndex(p => p.ok);
    return {
      type: 'jlpt', id: q.id, main: q.prompt, mainHTML: esc(q.prompt), promptClass: 'small',
      sub: q.sub, options: options, answer: answer,
      explain: q.exp + ' → 정답: <b>' + esc(q.options[q.answer]) + '</b>'
    };
  });
}

function initPad() {
  const c = $('#padCanvas');
  if (!c) { pad.canvas = null; return; }
  pad.canvas = c;
  pad.ctx = c.getContext('2d');
  const rect = c.getBoundingClientRect();
  const w = Math.max(160, Math.round(rect.width || 300));
  const h = Math.round(rect.height || 280);
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  c.width = Math.round(w * dpr);
  c.height = Math.round(h * dpr);
  pad.dpr = dpr; pad.w = w; pad.h = h;
  pad.lw = Math.max(4, Math.min(w, h) * 0.048);
  pad.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawPad();
  if (c.dataset.bound === '1') return;
  c.dataset.bound = '1';

  function endStroke() {
    if (!pad.cur) return;
    pad.cur = null;
    if (pad.strokes.length && !pad.marked) {
      pad.marked = true;
      markStudy('kana');
      toast('따라 쓰기 기록 완료 · 오늘의 가나 학습');
    }
  }
  c.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (c.setPointerCapture) { try { c.setPointerCapture(e.pointerId); } catch (err) {} }
    const p = padPoint(e);
    pad.cur = [p];
    pad.strokes.push(pad.cur);
    dot(p);
  });
  c.addEventListener('pointermove', function (e) {
    if (!pad.cur) return;
    e.preventDefault();
    const p = padPoint(e);
    const last = pad.cur[pad.cur.length - 1];
    if (Math.abs(p.x - last.x) < 1.1 && Math.abs(p.y - last.y) < 1.1) return;
    pad.cur.push(p);
    segment(last, p);
  });
  c.addEventListener('pointerup', endStroke);
  c.addEventListener('pointercancel', endStroke);
  c.addEventListener('pointerleave', endStroke);
}
function padPoint(e) {
  const r = pad.canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function dot(p) {
  const ctx = pad.ctx; if (!ctx) return;
  ctx.fillStyle = '#2A3B52';
  ctx.beginPath();
  ctx.arc(p.x, p.y, pad.lw / 2, 0, Math.PI * 2);
  ctx.fill();
}
function segment(a, b) {
  const ctx = pad.ctx; if (!ctx) return;
  ctx.strokeStyle = '#2A3B52';
  ctx.lineWidth = pad.lw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}
function drawPad() {
  const ctx = pad.ctx; if (!ctx) return;
  const w = pad.w, h = pad.h;
  ctx.clearRect(0, 0, w, h);
  const size = Math.min(w, h) * 0.76;
  ctx.save();
  ctx.fillStyle = 'rgba(220,38,38,0.1)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 ' + size + 'px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
  ctx.fillText(pad.char, w / 2, h / 2 + size * 0.045);
  ctx.restore();
  ctx.strokeStyle = '#2A3B52';
  ctx.lineWidth = pad.lw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  pad.strokes.forEach(function (st) {
    if (!st.length) return;
    if (st.length === 1) { dot(st[0]); return; }
    ctx.beginPath();
    ctx.moveTo(st[0].x, st[0].y);
    for (let i = 1; i < st.length; i++) ctx.lineTo(st[i].x, st[i].y);
    ctx.stroke();
  });
}
function padMove(step) {
  const list = kanaScript === 'kata' ? KANA_SEION.map(r => r[1]) : KANA_SEION.map(r => r[0]);
  let i = list.indexOf(pad.char);
  if (i < 0) i = 0;
  i = (i + step + list.length) % list.length;
  pad.char = list[i];
  pad.strokes = [];
  const label = $('#padCharLabel');
  if (label) label.textContent = pad.char;
  $$('.kana-cell').forEach(function (b) { b.classList.toggle('sel', b.dataset.kana === pad.char); });
  const info = kanaInfo(pad.char);
  const hint = $('.section-title .hint');
  if (hint && info && currentTab === 'kana') {
    const secs = $$('#view-kana .section-title');
    const last = secs[secs.length - 1];
    if (last) { const hh = last.querySelector('.hint'); if (hh) hh.textContent = info.r; }
  }
  drawPad();
}
function selectKana(ch) {
  pad.char = ch;
  pad.strokes = [];
  const label = $('#padCharLabel');
  if (label) label.textContent = ch;
  $$('.kana-cell').forEach(function (b) { b.classList.toggle('sel', b.dataset.kana === ch); });

  drawPad();
  speak(ch);
}

      '<button class="chip ' + (S.settings.romaji ? 'active' : '') + '" data-wset="romaji">로마자 ' + (S.settings.romaji ? 'ON' : 'OFF') + '</button>' +

      body =
        '<div class="flash ' + (wState.reveal ? 'revealed' : '') + '" data-flash="1">' +
          '<div class="flash-top"><span class="badge grey">' + esc(w.cat) + '</span>' +
            '<button class="mini-btn ' + (starred ? 'on' : '') + '" data-star="' + w.id + '">★</button></div>' +
          '<div class="flash-word">' + rubyHTML(w.jp, w.kana, S.settings.furigana) + '</div>' +
          (showKana ? '<div class="flash-kana">' + esc(w.kana) + '</div>' : '') +
          (S.settings.romaji ? '<div class="flash-romaji">' + esc(w.romaji) + '</div>' : '') +
          '<div class="flash-ko ' + (wState.reveal ? '' : 'hidden') + '">' + esc(w.ko) + '</div>' +
          '<div class="tap-hint">' + (wState.reveal ? '카드를 눌러 접기' : '카드를 누르면 뜻이 보여요') + '</div>' +
        '</div>' +
        '<div class="flash-tools">' +
          '<button class="mini-btn" data-speak="' + esc(w.kana) + '">🔊 보통</button>' +
          '<button class="mini-btn" data-speak-slow="' + esc(w.kana) + '">🐢 느리게</button>' +
          '<button class="mini-btn" data-wquiz="single">이 단어로 퀴즈</button>' +
        '</div>' +
        '<div class="flash-nav">' +
          '<button class="btn" data-wmove="-1">◀ 이전</button>' +
          '<button class="btn btn-primary" data-wmove="1">다음 ▶</button>' +
        '</div>' +
        '<div class="flash-count">' + (wState.idx + 1) + ' / ' + arr.length + ' · ' + esc(w.cat) + '</div>';
    }
  } else {
    body =
      '<div class="card">' +
        '<div class="card-head"><h3>4지선다 퀴즈</h3><span class="badge">' + esc(wState.cat) + ' · ' + arr.length + '개</span></div>' +
        '<p style="font-size:12.5px;color:var(--ink-2);line-height:1.65">' +
          '뜻 맞추기와 읽기 맞추기를 섞어서 낼 수 있어요. 틀린 단어는 복습 탭 오답노트에 자동으로 쌓입니다.</p>' +
        '<div style="display:flex;flex-direction:column;gap:8px;margin-top:13px">' +
          '<button class="btn btn-primary btn-block" data-wquiz="mix10">섞어서 10문제</button>' +
          '<button class="btn btn-block" data-wquiz="meaning">뜻 맞추기 10문제</button>' +
          '<button class="btn btn-block" data-wquiz="reading">읽기 맞추기 10문제</button>' +
          '<button class="btn btn-ghost btn-block" data-wquiz="today">오늘의 단어 5개로 풀기</button>' +
        '</div>' +
      '</div>' +
      '<div class="card tight">' +
        '<div class="card-head" style="margin-bottom:4px"><h3>이 카테고리 단어</h3><span class="sub">' + arr.length + '개</span></div>' +
        '<p style="font-size:11.5px;color:var(--ink-3)">카드 모드에서 한 개씩 넘겨보며 뜻을 확인할 수 있어요.</p>' +
      '</div>';
