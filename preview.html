<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 미리보기 · 日本語ノート</title>
<style>
  html,body{margin:0;padding:0;background:#E9E6DF;min-height:100vh;
    font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#5C6572}
  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
  .cap{font-size:12px;letter-spacing:.3px}
  .phone{width:390px;height:844px;border-radius:36px;overflow:hidden;background:#F7F5F0;
    box-shadow:0 30px 70px rgba(31,39,51,.28),0 0 0 1px rgba(31,39,51,.08)}
  iframe{width:390px;height:844px;border:0;display:block;background:#F7F5F0}
</style>
</head>
<body>
<div class="stage">
  <div class="cap">日本語ノート · 390 × 844 미리보기</div>
  <div class="phone"><iframe id="appFrame" title="日本語ノート 앱 미리보기"></iframe></div>
</div>
<script>
  (function () {
    var RAW = 'https://raw.githubusercontent.com/lokid8191-svg/nihongo-study/main/index.html';
    var f = document.getElementById('appFrame');
    if (!/htmlpreview/i.test(location.hostname)) {
      f.src = 'index.html';
      return;
    }
    fetch(RAW).then(function (r) { return r.text(); }).then(function (t) { f.srcdoc = t; });
  })();
</script>
</body>
</html>
