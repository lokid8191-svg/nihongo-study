    <circle cx="158" cy="253" r="5.2" fill="#FFFFFF"/>
    <circle cx="180" cy="265" r="3.4" fill="#FFFFFF"/>
    <circle cx="354" cy="253" r="5.2" fill="#FFFFFF"/>
    <circle cx="332" cy="265" r="3.4" fill="#FFFFFF"/>

