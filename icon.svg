      <path d="M96 158 L152 128 L198 174 C182 192 160 200 138 197 C114 194 98 178 96 158 Z" fill="url(#earIn)"/>
    </g>

    <!-- 얼굴 -->
    <path d="M256 126 C300 126 342 138 370 164 C398 190 410 236 408 286 C406 344 374 392 330 412 C308 422 282 426 256 426 C230 426 204 422 182 412 C138 392 106 344 104 286 C102 236 114 190 142 164 C170 138 212 126 256 126 Z" fill="url(#fur)"/>
