    <path d="M234 286 C242 277 270 277 278 286 C283 296 270 310 256 314 C242 310 229 296 234 286 Z" fill="#2A211D"/>
    <path d="M246 289 C251 285 261 285 266 289" fill="none" stroke="#6E6057" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

