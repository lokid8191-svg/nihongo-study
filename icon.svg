<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="withかっちゃん — 바쿠독">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#326658"/>
      <stop offset="1" stop-color="#1D3833"/>
    </linearGradient>
    <radialGradient id="fur" cx="46%" cy="28%" r="82%">
      <stop offset="0" stop-color="#FFF2D6"/>
      <stop offset="0.62" stop-color="#F9E4B6"/>
