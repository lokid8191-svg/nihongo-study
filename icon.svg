    <linearGradient id="eye" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FB8140"/>
      <stop offset="0.45" stop-color="#E5501C"/>
      <stop offset="1" stop-color="#AE2A0F"/>
    </linearGradient>
    <linearGradient id="mouth" x1="0" y1="0" x2="0" y2="1">
