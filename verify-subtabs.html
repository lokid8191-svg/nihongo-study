<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>verify · 공부 서브탭</title>
<style>
html,body{margin:0;background:#0f1115;color:#e5e7eb;font:12px/1.45 -apple-system,'Apple SD Gothic Neo',sans-serif}
#log{margin:8px 10px;padding:6px 9px;background:#1f2937;border-radius:8px;min-height:20px;white-space:pre-wrap;color:#a7f3d0}
.row{display:flex;gap:14px;padding:0 10px 10px;align-items:flex-start}
figure{margin:0}
figcaption{padding:4px 2px 5px;font-weight:700;color:#9ca3af}
iframe{border:1px solid #374151;background:#fff;display:block}
</style>
</head>
<body>
<div id="log">errors: 0</div>
<div class="row">
  <figure><figcaption>360×800 · 접은 화면</figcaption><iframe id="f360" src="index.html" width="360" height="800"></iframe></figure>
  <figure><figcaption>768×820 · 펼친 화면</figcaption><iframe id="f768" src="index.html" width="768" height="820"></iframe></figure>
</div>
<script>
var errs = [];
function log(t) {
  errs.push(t);
  document.getElementById('log').textContent = 'errors: ' + errs.length + '\n' + errs.join('\n');
}
['f360', 'f768'].forEach(function (id) {
  var f = document.getElementById(id);
  function hook() {
    var w;
    try { w = f.contentWindow; } catch (e) { return; }
    if (!w || w.__hooked) return;
    w.__hooked = true;
    w.addEventListener('error', function (ev) {
      log(id + ' error: ' + (ev.message || '') + ' (' + String(ev.filename || '').split('/').pop() + ':' + ev.lineno + ')');
    });
    w.addEventListener('unhandledrejection', function (ev) { log(id + ' reject: ' + ev.reason); });
    ['error', 'warn'].forEach(function (k) {
      var o = w.console[k].bind(w.console);
      w.console[k] = function () { log(id + ' console.' + k + ': ' + Array.prototype.join.call(arguments, ' ')); return o.apply(null, arguments); };
    });
    log(id + ' hooked (readyState=' + w.document.readyState + ')');
  }
  f.addEventListener('load', hook);
  setTimeout(hook, 1200);
});
</script>
</body>
</html>
